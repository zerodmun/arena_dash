<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Radial Cosmic Gradient -->
    <radialGradient id="spaceBg" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#0f1d38"/>
      <stop offset="55%" stop-color="#050a16"/>
      <stop offset="100%" stop-color="#020409"/>
    </radialGradient>

    <!-- Outer Squircle Bevel Gradient -->
    <linearGradient id="frameRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4de8ff"/>
      <stop offset="35%" stop-color="#0284c7"/>
      <stop offset="70%" stop-color="#034b75"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Metallic Hull Gradient -->
    <linearGradient id="hullMetal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#075985"/>
      <stop offset="25%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#e0f2fe"/>
      <stop offset="75%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>

    <!-- Wing Armor Gradient (Left) -->
    <linearGradient id="wingLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="60%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0c2d48"/>
    </linearGradient>

    <!-- Wing Armor Gradient (Right) -->
    <linearGradient id="wingRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="60%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0c2d48"/>
    </linearGradient>

    <!-- Thruster Fire Gradient -->
    <radialGradient id="thrusterFire" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#38bdf8"/>
      <stop offset="75%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0"/>
    </radialGradient>

    <!-- Deep Drop Shadow Filter for Ship -->
    <filter id="shipDropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="20" flood-color="#000000" flood-opacity="0.9"/>
    </filter>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 1. Master Squircle App Frame -->
  <rect x="20" y="20" width="472" height="472" rx="108" ry="108" fill="url(#spaceBg)" stroke="url(#frameRim)" stroke-width="12"/>

  <!-- Inner Cyan Energy Ring Accent -->
  <rect x="30" y="30" width="452" height="452" rx="98" ry="98" fill="none" stroke="#00f0ff" stroke-width="2.5" opacity="0.45"/>

  <!-- 2. Cyber Tactical Grid & Targeting Reticle -->
  <g opacity="0.35">
    <!-- Grid Lines -->
    <line x1="256" y1="30" x2="256" y2="482" stroke="#0284c7" stroke-width="2"/>
    <line x1="30" y1="256" x2="482" y2="256" stroke="#0284c7" stroke-width="2"/>
    <line x1="120" y1="30" x2="120" y2="482" stroke="#0284c7" stroke-width="1.2" stroke-dasharray="8 6"/>
    <line x1="392" y1="30" x2="392" y2="482" stroke="#0284c7" stroke-width="1.2" stroke-dasharray="8 6"/>
    <line x1="30" y1="120" x2="482" y2="120" stroke="#0284c7" stroke-width="1.2" stroke-dasharray="8 6"/>
    <line x1="30" y1="392" x2="482" y2="392" stroke="#0284c7" stroke-width="1.2" stroke-dasharray="8 6"/>
    
    <!-- Concentric Cyber Targeting Rings -->
    <circle cx="256" cy="256" r="185" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="16 12"/>
    <circle cx="256" cy="256" r="130" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="10 8"/>
    <circle cx="256" cy="256" r="75" fill="none" stroke="#00e5ff" stroke-width="2"/>

    <!-- Corner Radar Ticks -->
    <path d="M140 100 L100 100 L100 140" fill="none" stroke="#00f0ff" stroke-width="3"/>
    <path d="M372 100 L412 100 L412 140" fill="none" stroke="#00f0ff" stroke-width="3"/>
    <path d="M100 372 L100 412 L140 412" fill="none" stroke="#00f0ff" stroke-width="3"/>
    <path d="M412 372 L412 412 L372 412" fill="none" stroke="#00f0ff" stroke-width="3"/>
  </g>

  <!-- 3. Dynamic Twin Plasma Thruster Fire -->
  <g>
    <!-- Left Thruster Jet -->
    <polygon points="195,360 215,360 205,450" fill="url(#thrusterFire)"/>
    <ellipse cx="205" cy="380" rx="14" ry="42" fill="#00e5ff" filter="url(#neonGlow)"/>
    <ellipse cx="205" cy="370" rx="7" ry="24" fill="#ffffff"/>

    <!-- Right Thruster Jet -->
    <polygon points="297,360 317,360 307,450" fill="url(#thrusterFire)"/>
    <ellipse cx="307" cy="380" rx="14" ry="42" fill="#00e5ff" filter="url(#neonGlow)"/>
    <ellipse cx="307" cy="370" rx="7" ry="24" fill="#ffffff"/>

    <!-- Particle Sparks -->
    <circle cx="195" cy="440" r="4" fill="#00f0ff"/>
    <circle cx="315" cy="445" r="3.5" fill="#00f0ff"/>
    <circle cx="205" cy="465" r="2.5" fill="#ffffff"/>
    <circle cx="307" cy="460" r="3" fill="#ffffff"/>
  </g>

  <!-- 4. Valkyrie Semi-3D Starfighter Main Subject -->
  <g filter="url(#shipDropShadow)">
    <!-- Left Swept Delta Wing -->
    <polygon points="256,90 256,330 85,385 115,260 195,175" 
             fill="url(#wingLeft)" stroke="#02213d" stroke-width="8" stroke-linejoin="round"/>
    
    <!-- Left Wing Bevel Edge & Panel Lines -->
    <polygon points="115,260 85,385 160,360 200,300" fill="#026aa3" opacity="0.8"/>
    <line x1="160" y1="215" x2="110" y2="340" stroke="#00f0ff" stroke-width="4" stroke-linecap="round"/>
    <line x1="195" y1="260" x2="145" y2="355" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>

    <!-- Right Swept Delta Wing -->
    <polygon points="256,90 256,330 427,385 397,260 317,175" 
             fill="url(#wingRight)" stroke="#02213d" stroke-width="8" stroke-linejoin="round"/>
    
    <!-- Right Wing Bevel Edge & Panel Lines -->
    <polygon points="397,260 427,385 352,360 312,300" fill="#026aa3" opacity="0.8"/>
    <line x1="352" y1="215" x2="402" y2="340" stroke="#00f0ff" stroke-width="4" stroke-linecap="round"/>
    <line x1="317" y1="260" x2="367" y2="355" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>

    <!-- Wingtip Kinetic Laser Cannons -->
    <rect x="79" y="325" width="12" height="65" rx="4" fill="#0c1e33" stroke="#00f0ff" stroke-width="3"/>
    <circle cx="85" cy="325" r="5" fill="#ffffff" filter="url(#neonGlow)"/>
    <rect x="421" y="325" width="12" height="65" rx="4" fill="#0c1e33" stroke="#00f0ff" stroke-width="3"/>
    <circle cx="427" cy="325" r="5" fill="#ffffff" filter="url(#neonGlow)"/>

    <!-- Central Sculpted Fuselage -->
    <polygon points="256,70 295,190 295,355 256,380 217,355 217,190" 
             fill="url(#hullMetal)" stroke="#011b33" stroke-width="8" stroke-linejoin="round"/>

    <!-- Central Titanium Spine Ridge -->
    <polygon points="256,72 265,190 265,370 256,378 247,370 247,190" fill="#ffffff" opacity="0.85"/>

    <!-- Cockpit Canopy (Crystalline Glass with Specular Glint) -->
    <polygon points="256,170 278,240 272,280 256,290 240,280 234,240" 
             fill="#02263d" stroke="#00f0ff" stroke-width="5" stroke-linejoin="round"/>
    
    <!-- Canopy Inner Core -->
    <polygon points="256,178 272,238 266,274 256,282 246,274 240,238" fill="#0284c7"/>
    
    <!-- Specular Canopy Glint Curve -->
    <path d="M246,195 Q256,200 256,260" stroke="#ffffff" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.95"/>
    <circle cx="250" cy="195" r="3" fill="#ffffff"/>

    <!-- Nose Cone Plasma Tip -->
    <polygon points="256,66 264,115 248,115" fill="#00e5ff" stroke="#02213d" stroke-width="3"/>
    <circle cx="256" cy="68" r="6" fill="#ffffff" filter="url(#neonGlow)"/>
  </g>

  <!-- 5. Bottom Cyber Monogram Accent Banner -->
  <g>
    <!-- Sleek Tech Chevron Base -->
    <polygon points="200,432 256,412 312,432 256,424" fill="#00e5ff" opacity="0.85" filter="url(#neonGlow)"/>
    <text x="256" y="468" font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="22" font-weight="900" letter-spacing="6" fill="#ffffff" text-anchor="middle">ARENA DASH</text>
  </g>
</svg>