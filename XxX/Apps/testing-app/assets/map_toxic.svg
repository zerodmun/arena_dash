<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Bio-Hazard Smog Sky -->
    <linearGradient id="toxicSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="35%" stop-color="#064e3b"/>
      <stop offset="70%" stop-color="#14532d"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>

    <!-- Fluorescent Acid Sludge -->
    <linearGradient id="acidSludge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#bef264"/>
      <stop offset="55%" stop-color="#84cc16"/>
      <stop offset="85%" stop-color="#4d7c0f"/>
      <stop offset="100%" stop-color="#1a2e05"/>
    </linearGradient>

    <!-- Corroded Industrial Steel -->
    <linearGradient id="corrodedMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="35%" stop-color="#334155"/>
      <stop offset="70%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Toxic Vapor Bloom Filter -->
    <filter id="toxicGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Toxic Smog Sky Background -->
  <rect width="512" height="512" rx="28" fill="url(#toxicSky)"/>

  <!-- Distant Nuclear Cooling Towers & Industrial Silos -->
  <path d="M70,220 L85,130 L135,130 L150,220 Z" fill="#1e293b" opacity="0.65"/>
  <path d="M170,230 L182,145 L228,145 L240,230 Z" fill="#0f172a" opacity="0.75"/>
  <path d="M360,225 L372,135 L420,135 L432,225 Z" fill="#1e293b" opacity="0.65"/>

  <!-- Green Smog Clouds from Towers -->
  <ellipse cx="110" cy="115" rx="45" ry="22" fill="#84cc16" opacity="0.4" filter="url(#toxicGlow)"/>
  <ellipse cx="205" cy="130" rx="35" ry="18" fill="#bef264" opacity="0.4" filter="url(#toxicGlow)"/>
  <ellipse cx="396" cy="120" rx="42" ry="20" fill="#84cc16" opacity="0.4" filter="url(#toxicGlow)"/>

  <!-- Industrial Citadel Grated Floor Deck -->
  <path d="M-20,250 Q140,190 280,240 T530,220 L530,530 L-20,530 Z" fill="url(#corrodedMetal)"/>

  <!-- Glowing Acid Waste Conduit Canal -->
  <path d="M-20,360 Q130,270 270,340 T530,300 L530,420 Q370,450 240,430 T-20,440 Z" fill="url(#acidSludge)" filter="url(#toxicGlow)"/>

  <!-- High-Intensity Acid Core Stream -->
  <path d="M-10,380 Q135,290 270,355 T520,325" fill="none" stroke="#bef264" stroke-width="10" filter="url(#toxicGlow)"/>
  <path d="M-10,380 Q135,290 270,355 T520,325" fill="none" stroke="#ffffff" stroke-width="3.5"/>

  <!-- Acid Pipe Feeders -->
  <path d="M130,230 Q170,270 180,330" fill="none" stroke="#84cc16" stroke-width="6" filter="url(#toxicGlow)"/>
  <path d="M370,230 Q340,270 330,330" fill="none" stroke="#84cc16" stroke-width="6" filter="url(#toxicGlow)"/>

  <!-- Industrial Grating Platforms over Acid -->
  <g transform="translate(140, 320) rotate(-10)">
    <rect x="-4" y="4" width="84" height="42" rx="4" fill="#000000" opacity="0.5"/>
    <rect x="0" y="0" width="84" height="42" rx="4" fill="#334155" stroke="#84cc16" stroke-width="2"/>
    <!-- Yellow/Black Hazard Strip -->
    <rect x="6" y="6" width="72" height="10" fill="#facc15"/>
    <line x1="16" y1="6" x2="10" y2="16" stroke="#000000" stroke-width="2.5"/>
    <line x1="30" y1="6" x2="24" y2="16" stroke="#000000" stroke-width="2.5"/>
    <line x1="44" y1="6" x2="38" y2="16" stroke="#000000" stroke-width="2.5"/>
    <line x1="58" y1="6" x2="52" y2="16" stroke="#000000" stroke-width="2.5"/>
    <line x1="72" y1="6" x2="66" y2="16" stroke="#000000" stroke-width="2.5"/>
  </g>

  <g transform="translate(320, 350) rotate(14)">
    <rect x="-4" y="4" width="88" height="44" rx="4" fill="#000000" opacity="0.5"/>
    <rect x="0" y="0" width="88" height="44" rx="4" fill="#334155" stroke="#84cc16" stroke-width="2"/>
    <circle cx="24" cy="22" r="12" fill="#14532d" stroke="#bef264" stroke-width="2"/>
    <circle cx="60" cy="22" r="12" fill="#14532d" stroke="#bef264" stroke-width="2"/>
  </g>

  <!-- Chemical Storage Tanks / Radiation Silos -->
  <g transform="translate(60, 220)">
    <rect x="0" y="0" width="34" height="70" rx="8" fill="#1e293b" stroke="#84cc16" stroke-width="2.5"/>
    <rect x="4" y="25" width="26" height="35" rx="3" fill="#84cc16" opacity="0.75" filter="url(#toxicGlow)"/>
  </g>
  <g transform="translate(420, 210)">
    <rect x="0" y="0" width="34" height="70" rx="8" fill="#1e293b" stroke="#84cc16" stroke-width="2.5"/>
    <rect x="4" y="25" width="26" height="35" rx="3" fill="#84cc16" opacity="0.75" filter="url(#toxicGlow)"/>
  </g>

  <!-- Rising Bio-Luminescent Spore Bubbles -->
  <g fill="#bef264" opacity="0.85">
    <circle cx="110" cy="360" r="4" filter="url(#toxicGlow)"/>
    <circle cx="170" cy="380" r="5" filter="url(#toxicGlow)"/>
    <circle cx="240" cy="340" r="3" filter="url(#toxicGlow)"/>
    <circle cx="310" cy="370" r="5.5" filter="url(#toxicGlow)"/>
    <circle cx="430" cy="330" r="3.5" filter="url(#toxicGlow)"/>
    <circle cx="280" cy="400" r="4.5" filter="url(#toxicGlow)"/>
  </g>

  <!-- Perimeter Frame -->
  <rect x="2" y="2" width="508" height="508" rx="26" fill="none" stroke="#84cc16" stroke-width="2" opacity="0.4"/>
</svg>
