<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <filter id="brShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="8" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
    <linearGradient id="drumMetal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="25%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#64748b"/>
      <stop offset="75%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="toxicGlow">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#brShadow)">
    <!-- Heavy Industrial Containment Silo / Drum -->
    <rect x="48" y="44" width="160" height="168" rx="24" fill="url(#drumMetal)" stroke="#0f172a" stroke-width="4"/>
    <!-- Reinforcement Ribs -->
    <line x1="48" y1="84" x2="208" y2="84" stroke="#0f172a" stroke-width="6"/>
    <line x1="48" y1="128" x2="208" y2="128" stroke="#0f172a" stroke-width="6"/>
    <line x1="48" y1="172" x2="208" y2="172" stroke="#0f172a" stroke-width="6"/>
    <!-- Yellow/Black Hazard Strip -->
    <rect x="56" y="94" width="144" height="24" fill="#facc15"/>
    <g stroke="#000000" stroke-width="5">
      <line x1="70" y1="94" x2="60" y2="118"/>
      <line x1="94" y1="94" x2="84" y2="118"/>
      <line x1="118" y1="94" x2="108" y2="118"/>
      <line x1="142" y1="94" x2="132" y2="118"/>
      <line x1="166" y1="94" x2="156" y2="118"/>
      <line x1="190" y1="94" x2="180" y2="118"/>
    </g>
    <!-- Biohazard Symbol / Toxic Slime Valve -->
    <circle cx="128" cy="150" r="14" fill="#14532d" stroke="#84cc16" stroke-width="3"/>
    <circle cx="128" cy="150" r="6" fill="#bef264" filter="url(#toxicGlow)"/>
  </g>
</svg>
