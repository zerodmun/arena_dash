<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- Drop Shadow for Floating Elevation -->
    <filter id="puShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="30" stdDeviation="16" flood-color="#000000" flood-opacity="0.65"/>
    </filter>

    <!-- Top Cap Light Facet -->
    <linearGradient id="puTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#facc15"/>
    </linearGradient>

    <!-- Mid Left Facet -->
    <linearGradient id="puMidL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>

    <!-- Mid Right Facet -->
    <linearGradient id="puMidR" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>

    <!-- Bottom Left Facet -->
    <linearGradient id="puBotL" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#713f12"/>
    </linearGradient>

    <!-- Bottom Right Facet -->
    <linearGradient id="puBotR" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>

    <!-- Shimmer Core -->
    <radialGradient id="puCore" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#fef08a"/>
      <stop offset="80%" stop-color="#eab308" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ca8a04" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g filter="url(#puShadow)">
    <!-- Floating Cyber Energy Halo -->
    <ellipse cx="256" cy="256" rx="190" ry="80" fill="none" stroke="#fde047" stroke-width="8" stroke-dasharray="24 16" opacity="0.6" transform="rotate(-15 256 256)"/>

    <!-- 3D Multifaceted Crystal Gem -->
    <!-- Top Apex Cap -->
    <polygon points="256,52 372,168 256,206 140,168" fill="url(#puTop)" stroke="#fef9c3" stroke-width="5" stroke-linejoin="round"/>

    <!-- Mid Left -->
    <polygon points="140,168 256,206 256,346 116,244" fill="url(#puMidL)" stroke="#fef08a" stroke-width="5" stroke-linejoin="round"/>

    <!-- Mid Right -->
    <polygon points="256,206 372,168 396,244 256,346" fill="url(#puMidR)" stroke="#fef08a" stroke-width="5" stroke-linejoin="round"/>

    <!-- Bottom Left Tip -->
    <polygon points="116,244 256,346 256,448" fill="url(#puBotL)" stroke="#ca8a04" stroke-width="5" stroke-linejoin="round"/>

    <!-- Bottom Right Tip -->
    <polygon points="256,346 396,244 256,448" fill="url(#puBotR)" stroke="#a16207" stroke-width="5" stroke-linejoin="round"/>

    <!-- Brilliant Core Pulse -->
    <circle cx="256" cy="244" r="64" fill="url(#puCore)"/>

    <!-- Sparkle Highlights -->
    <circle cx="256" cy="52" r="14" fill="#ffffff"/>
    <circle cx="256" cy="206" r="16" fill="#ffffff"/>
    <polygon points="256,100 276,168 256,152 236,168" fill="#ffffff" opacity="0.9"/>
  </g>
</svg>
