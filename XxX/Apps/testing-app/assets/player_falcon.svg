<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- Heavy Drop Shadow -->
    <filter id="fShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="16" flood-color="#000000" flood-opacity="0.75"/>
    </filter>

    <!-- Gunmetal Armor Plates -->
    <linearGradient id="fArmor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="25%" stop-color="#64748b"/>
      <stop offset="65%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Wing Highlight Left -->
    <linearGradient id="fWingL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="30%" stop-color="#64748b"/>
      <stop offset="70%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Wing Highlight Right -->
    <linearGradient id="fWingR" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="30%" stop-color="#64748b"/>
      <stop offset="70%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Titanium Fuselage Spine -->
    <linearGradient id="fSpine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="30%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="70%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Amber Cockpit Canopy -->
    <radialGradient id="fCockpit" cx="42%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="25%" stop-color="#f59e0b"/>
      <stop offset="65%" stop-color="#d97706"/>
      <stop offset="90%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#451a03"/>
    </radialGradient>

    <!-- Afterburner Flame -->
    <radialGradient id="fFlame" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#fef08a"/>
      <stop offset="70%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0"/>
    </radialGradient>

    <!-- Orange Accent Trim -->
    <linearGradient id="fOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="50%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
  </defs>

  <g filter="url(#fShadow)">
    <!-- Twin Afterburner Plumes -->
    <ellipse cx="228" cy="450" rx="15" ry="46" fill="url(#fFlame)"/>
    <ellipse cx="284" cy="450" rx="15" ry="46" fill="url(#fFlame)"/>
    <ellipse cx="228" cy="442" rx="7" ry="24" fill="#ffffff"/>
    <ellipse cx="284" cy="442" rx="7" ry="24" fill="#ffffff"/>

    <!-- Wingtip Missile Rails -->
    <rect x="42" y="270" width="8" height="110" rx="4" fill="#1e293b" stroke="#f97316" stroke-width="2"/>
    <polygon points="46,260 40,274 52,274" fill="#f97316"/>
    <rect x="462" y="270" width="8" height="110" rx="4" fill="#1e293b" stroke="#f97316" stroke-width="2"/>
    <polygon points="466,260 460,274 472,274" fill="#f97316"/>

    <!-- Main Swept Wings -->
    <!-- Left Wing -->
    <polygon points="256,90 200,240 48,340 76,375 210,335 220,410" fill="url(#fWingL)" stroke="#0f172a" stroke-width="4" stroke-linejoin="round"/>
    <!-- Right Wing -->
    <polygon points="256,90 312,240 464,340 436,375 302,335 292,410" fill="url(#fWingR)" stroke="#0f172a" stroke-width="4" stroke-linejoin="round"/>

    <!-- Leading Edge Wing Slats & Accents -->
    <polygon points="256,90 216,215 90,320 62,336 200,240" fill="#475569" opacity="0.6"/>
    <polygon points="256,90 296,215 422,320 450,336 312,240" fill="#475569" opacity="0.6"/>

    <!-- High-Vis Orange Wing Chevrons -->
    <polygon points="120,315 155,305 215,312 210,326 150,320 115,330" fill="url(#fOrange)"/>
    <polygon points="392,315 357,305 297,312 302,326 362,320 397,330" fill="url(#fOrange)"/>

    <!-- Flaps & Aileron Panel Lines -->
    <line x1="88" y1="365" x2="190" y2="335" stroke="#1e293b" stroke-width="3"/>
    <line x1="424" y1="365" x2="322" y2="335" stroke="#1e293b" stroke-width="3"/>

    <!-- Twin Canted Horizontal Stabilizers -->
    <polygon points="220,380 155,445 178,465 230,425" fill="#334155" stroke="#0f172a" stroke-width="3"/>
    <polygon points="292,380 357,445 334,465 282,425" fill="#334155" stroke="#0f172a" stroke-width="3"/>

    <!-- Twin Vertical Stabilizer Fins with Orange Tips -->
    <polygon points="208,310 190,430 218,422 225,320" fill="#475569" stroke="#0f172a" stroke-width="2"/>
    <polygon points="190,430 194,400 206,400 203,426" fill="#f97316"/>
    <polygon points="304,310 322,430 294,422 287,320" fill="#475569" stroke="#0f172a" stroke-width="2"/>
    <polygon points="322,430 318,400 306,400 309,426" fill="#f97316"/>

    <!-- Central Lifting Fuselage -->
    <polygon points="256,40 218,170 212,390 240,435 272,435 300,390 294,170" fill="url(#fArmor)" stroke="#0f172a" stroke-width="4" stroke-linejoin="round"/>

    <!-- Raised Fuselage Spine -->
    <polygon points="256,50 238,160 234,380 256,410 278,380 274,160" fill="url(#fSpine)"/>

    <!-- Air Intake Cowlings -->
    <polygon points="208,210 226,210 224,285 204,275" fill="#0f172a" stroke="#475569" stroke-width="2"/>
    <polygon points="304,210 286,210 288,285 308,275" fill="#0f172a" stroke="#475569" stroke-width="2"/>
    <rect x="210" y="214" width="14" height="28" fill="#f97316" opacity="0.8"/>
    <rect x="288" y="214" width="14" height="28" fill="#f97316" opacity="0.8"/>

    <!-- Engine Exhaust Nozzles -->
    <rect x="216" y="420" width="24" height="18" rx="4" fill="#0f172a" stroke="#64748b" stroke-width="2"/>
    <rect x="272" y="420" width="24" height="18" rx="4" fill="#0f172a" stroke="#64748b" stroke-width="2"/>

    <!-- Volumetric Amber Cockpit Canopy -->
    <ellipse cx="256" cy="190" rx="18" ry="52" fill="url(#fCockpit)" stroke="#1e293b" stroke-width="3"/>
    <!-- Specular Highlight Strip -->
    <path d="M252,148 Q247,185 251,225" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.75"/>
    <ellipse cx="254" cy="162" rx="4" ry="12" fill="#ffffff" opacity="0.85"/>

    <!-- Tactical HUD Frame & Nose Probe -->
    <line x1="256" y1="20" x2="256" y2="40" stroke="#94a3b8" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="256" cy="20" r="3" fill="#f97316"/>

    <!-- Formation Lights -->
    <circle cx="58" cy="336" r="4.5" fill="#ef4444"/> <!-- Port Red -->
    <circle cx="454" cy="336" r="4.5" fill="#22c55e"/> <!-- Starboard Green -->
    <circle cx="256" cy="428" r="3.5" fill="#fef08a"/> <!-- Strobe White -->
  </g>
</svg>