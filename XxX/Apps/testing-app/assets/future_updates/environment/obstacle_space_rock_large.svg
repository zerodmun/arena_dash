<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="rk-lrg-main" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="30%" stop-color="#64748b" />
      <stop offset="65%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="rk-hi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <linearGradient id="rk-sh" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <linearGradient id="rk-ore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
  </defs>

  <!-- Ground Drop Shadow -->
  <polygon points="24,32 52,14 88,18 116,44 112,82 86,112 44,116 16,88 12,54" fill="#040711" opacity="0.65" transform="translate(4, 6)" />

  <!-- Outer Rock Silhouette -->
  <polygon points="24,32 52,14 88,18 116,44 112,82 86,112 44,116 16,88 12,54" fill="url(#rk-lrg-main)" stroke="#090d16" stroke-width="3" stroke-linejoin="round" />

  <!-- Faceted Geometrical Planes -->
  <!-- Top Highlight Facet -->
  <polygon points="24,32 52,14 74,32 46,46" fill="url(#rk-hi)" opacity="0.85" />
  <polygon points="52,14 88,18 94,40 74,32" fill="#cbd5e1" opacity="0.75" />

  <!-- Far Right Shadow Facet -->
  <polygon points="88,18 116,44 98,64 94,40" fill="#475569" />
  <polygon points="116,44 112,82 84,78 98,64" fill="url(#rk-sh)" />

  <!-- Central Upper Plateau -->
  <polygon points="46,46 74,32 94,40 98,64 68,72 42,66" fill="#64748b" />

  <!-- Left Flank -->
  <polygon points="12,54 24,32 46,46 42,66 22,76" fill="#475569" />
  <polygon points="12,54 22,76 16,88" fill="#334155" />

  <!-- Lower Terraces -->
  <polygon points="42,66 68,72 58,98 34,92 22,76" fill="#334155" />
  <polygon points="68,72 98,64 84,78 86,112 58,98" fill="url(#rk-sh)" />
  <polygon points="22,76 34,92 44,116 16,88" fill="#1e293b" />
  <polygon points="34,92 58,98 86,112 44,116" fill="url(#rk-sh)" />

  <!-- Deep Impact Craters -->
  <!-- Crater 1 (Top Plateau) -->
  <ellipse cx="60" cy="50" rx="9" ry="6" fill="#1e293b" />
  <ellipse cx="58" cy="49" rx="7" ry="4" fill="#090d16" />
  <path d="M 51 50 A 9 6 0 0 0 69 50" fill="none" stroke="#94a3b8" stroke-width="1.2" />

  <!-- Crater 2 (Lower Left) -->
  <ellipse cx="32" cy="74" rx="7" ry="5" fill="#1e293b" />
  <ellipse cx="31" cy="73" rx="5" ry="3" fill="#090d16" />
  <path d="M 25 74 A 7 5 0 0 0 39 74" fill="none" stroke="#64748b" stroke-width="1.2" />

  <!-- Crater 3 (Right Flank) -->
  <ellipse cx="92" cy="56" rx="6" ry="4" fill="#090d16" />
  <path d="M 86 56 A 6 4 0 0 0 98 56" fill="none" stroke="#64748b" stroke-width="1" />

  <!-- Glowing Alien Crystal / Energized Mineral Fissure -->
  <path d="M 52 14 L 46 46 L 42 66 L 58 98" fill="none" stroke="url(#rk-ore)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 46 46 L 68 72 L 84 78" fill="none" stroke="url(#rk-ore)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Energy nodes in fissure -->
  <circle cx="46" cy="46" r="3" fill="#bae6fd" />
  <circle cx="42" cy="66" r="2.5" fill="#e0e7ff" />
  <circle cx="68" cy="72" r="2.5" fill="#bae6fd" />
</svg>
