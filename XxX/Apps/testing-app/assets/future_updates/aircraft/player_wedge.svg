<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Drop Shadow -->
    <filter id="wShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="16" flood-color="#000000" flood-opacity="0.8"/>
    </filter>

    <!-- Metallic Ice Blue Hull -->
    <linearGradient id="wedgeHull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="20%" stop-color="#bae6fd"/>
      <stop offset="50%" stop-color="#7dd3fc"/>
      <stop offset="80%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </linearGradient>

    <!-- Dark Steel Armor Inset -->
    <linearGradient id="wedgeDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Glowing Cyan Cockpit Energy Lines -->
    <linearGradient id="cyanConduit" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Twin Thruster Flare -->
    <radialGradient id="wedgeFlame" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#67e8f9"/>
      <stop offset="70%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>

    <filter id="glowBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g filter="url(#wShadow)">
    <!-- Dual Exhaust Plumes -->
    <ellipse cx="206" cy="415" rx="18" ry="48" fill="url(#wedgeFlame)" filter="url(#glowBloom)"/>
    <ellipse cx="306" cy="415" rx="18" ry="48" fill="url(#wedgeFlame)" filter="url(#glowBloom)"/>
    <ellipse cx="206" cy="405" rx="8" ry="24" fill="#ffffff"/>
    <ellipse cx="306" cy="405" rx="8" ry="24" fill="#ffffff"/>

    <!-- Wide Faceted Wedge Main Body (Lower Shell) -->
    <polygon points="256,90 440,320 380,390 132,390 72,320" fill="url(#wedgeDark)" stroke="#0c4a6e" stroke-width="4" stroke-linejoin="round"/>

    <!-- Main Upper Wedge Armor Plate -->
    <polygon points="256,105 425,315 365,375 147,375 87,315" fill="url(#wedgeHull)" stroke="#0284c7" stroke-width="3" stroke-linejoin="round"/>

    <!-- Faceted Chined Wing Panels -->
    <polygon points="256,105 256,260 87,315" fill="#e0f2fe" opacity="0.6"/>
    <polygon points="256,105 256,260 425,315" fill="#0369a1" opacity="0.5"/>
    <polygon points="256,260 147,375 365,375" fill="#0284c7" opacity="0.4"/>

    <!-- Wing Flap Panel Recesses -->
    <polygon points="120,315 160,365 210,365 170,315" fill="url(#wedgeDark)" stroke="#38bdf8" stroke-width="2"/>
    <polygon points="392,315 352,365 302,365 342,315" fill="url(#wedgeDark)" stroke="#38bdf8" stroke-width="2"/>

    <!-- Central Raised Cockpit Canopy Structure -->
    <polygon points="256,140 216,250 220,330 256,350 292,330 296,250" fill="url(#wedgeDark)" stroke="#0284c7" stroke-width="3"/>

    <!-- Curved Glowing Cyan Cockpit Energy Bands -->
    <path d="M256,160 C230,220 230,280 256,310 C282,280 282,220 256,160 Z" fill="url(#cyanConduit)" stroke="#ffffff" stroke-width="2" filter="url(#glowBloom)"/>
    <ellipse cx="256" cy="235" rx="10" ry="40" fill="#ffffff" opacity="0.85"/>

    <!-- Horizontal Energy Splitter Bar -->
    <rect x="236" y="240" width="40" height="6" rx="3" fill="#ffffff" filter="url(#glowBloom)"/>

    <!-- Yellow Wingtip Beacon Lights -->
    <circle cx="95" cy="318" r="6" fill="#facc15" filter="url(#glowBloom)"/>
    <circle cx="417" cy="318" r="6" fill="#facc15" filter="url(#glowBloom)"/>
    <circle cx="216" cy="180" r="4" fill="#facc15"/>
    <circle cx="296" cy="180" r="4" fill="#facc15"/>

    <!-- Engine Cowling Bezels -->
    <rect x="190" y="365" width="32" height="20" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <rect x="290" y="365" width="32" height="20" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  </g>
</svg>
