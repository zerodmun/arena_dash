<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Radiant Silver Chrome Star Gradient -->
    <linearGradient id="star-slv-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#e2e8f0" />
      <stop offset="65%" stop-color="#94a3b8" />
      <stop offset="90%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <radialGradient id="star-slv-glow" cx="50%" cy="50%" r="50%">
      <stop offset="30%" stop-color="#94a3b8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#475569" stop-opacity="0" />
    </radialGradient>

    <filter id="star-slv-drop" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Aura Glow -->
  <circle cx="32" cy="32" r="30" fill="url(#star-slv-glow)" />

  <g filter="url(#star-slv-drop)">
    <!-- Dark Outline / Bevel Underlay -->
    <polygon points="32,6 40,22 58,23 44,35 48,53 32,44 16,53 20,35 6,23 24,22" 
             fill="#1e293b" stroke="#1e293b" stroke-width="3" stroke-linejoin="round" />

    <!-- Main Silver Star Body -->
    <polygon points="32,6 40,22 58,23 44,35 48,53 32,44 16,53 20,35 6,23 24,22" 
             fill="url(#star-slv-grad)" stroke="#f1f5f9" stroke-width="1" stroke-linejoin="round" />
  </g>

  <!-- 3D Facet Shading on Left Halves -->
  <polygon points="32,6 40,22 32,34" fill="#ffffff" opacity="0.5" />
  <polygon points="58,23 44,35 32,34" fill="#64748b" opacity="0.35" />
  <polygon points="48,53 32,44 32,34" fill="#334155" opacity="0.45" />
  <polygon points="16,53 20,35 32,34" fill="#64748b" opacity="0.35" />
  <polygon points="6,23 24,22 32,34" fill="#ffffff" opacity="0.4" />

  <!-- Specular Sparkle Glint -->
  <circle cx="28" cy="18" r="2.5" fill="#ffffff" />
</svg>
