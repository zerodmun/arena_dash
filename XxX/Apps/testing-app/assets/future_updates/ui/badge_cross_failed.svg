<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Crimson Cross Badge Gradient -->
    <linearGradient id="crs-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="35%" stop-color="#ef4444" />
      <stop offset="80%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>

    <radialGradient id="crs-glow" cx="50%" cy="50%" r="50%">
      <stop offset="30%" stop-color="#ef4444" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#991b1b" stop-opacity="0" />
    </radialGradient>

    <filter id="crs-drop" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#020617" flood-opacity="0.6" />
    </filter>
  </defs>

  <circle cx="32" cy="32" r="30" fill="url(#crs-glow)" />

  <g filter="url(#crs-drop)">
    <!-- Base Rim -->
    <circle cx="32" cy="32" r="26" fill="#450a0a" stroke="#fca5a5" stroke-width="2" />
    <!-- Face -->
    <circle cx="32" cy="32" r="23" fill="url(#crs-bg)" stroke="#991b1b" stroke-width="1.5" />
  </g>

  <!-- Top Glass Sheen -->
  <path d="M 14 30 A 18 18 0 0 1 50 30 A 16 10 0 0 0 14 30 Z" fill="#ffffff" opacity="0.4" />

  <!-- Bold White 'X' -->
  <g transform="translate(32, 32)">
    <!-- Shadow -->
    <g stroke="#450a0a" stroke-width="6" stroke-linecap="round" transform="translate(0, 2)" opacity="0.6">
      <line x1="-10" y1="-10" x2="10" y2="10" />
      <line x1="10" y1="-10" x2="-10" y2="10" />
    </g>
    <!-- White -->
    <g stroke="#ffffff" stroke-width="6" stroke-linecap="round">
      <line x1="-10" y1="-10" x2="10" y2="10" />
      <line x1="10" y1="-10" x2="-10" y2="10" />
    </g>
  </g>
</svg>
