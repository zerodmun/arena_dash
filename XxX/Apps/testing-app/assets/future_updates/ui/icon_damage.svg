<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="ic-dmg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fee2e2" />
      <stop offset="30%" stop-color="#f87171" />
      <stop offset="70%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
  </defs>

  <!-- Shadow -->
  <g stroke="#450a0a" stroke-width="4" stroke-linecap="round" opacity="0.4" transform="translate(0, 2)">
    <line x1="8" y1="8" x2="40" y2="40" />
    <line x1="40" y1="8" x2="8" y2="40" />
  </g>

  <!-- Crossed Blaster Lasers -->
  <line x1="8" y1="8" x2="40" y2="40" stroke="url(#ic-dmg-grad)" stroke-width="4.5" stroke-linecap="round" />
  <line x1="40" y1="8" x2="8" y2="40" stroke="url(#ic-dmg-grad)" stroke-width="4.5" stroke-linecap="round" />

  <!-- Inner Core Glow Beam -->
  <line x1="12" y1="12" x2="36" y2="36" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
  <line x1="36" y1="12" x2="12" y2="36" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />

  <!-- Center Impact Flash Star -->
  <polygon points="24,19 25.5,22.5 29,24 25.5,25.5 24,29 22.5,25.5 19,24 22.5,22.5" fill="#fef08a" />
</svg>
