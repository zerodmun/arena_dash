<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 160" width="512" height="160">
  <defs>
    <!-- Metallic Golden Chrome for ADVENTURE -->
    <linearGradient id="adv-gold-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#facc15" />
      <stop offset="75%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#854d0e" />
    </linearGradient>

    <!-- Cyan Violet Gradient for SPACE -->
    <linearGradient id="adv-space-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0e7ff" />
      <stop offset="30%" stop-color="#a5b4fc" />
      <stop offset="70%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#3730a3" />
    </linearGradient>

    <filter id="adv-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#090514" flood-opacity="0.9" />
    </filter>
  </defs>

  <!-- Winged Sci-Fi Crest Backing -->
  <path d="M 56 70 L 140 30 L 372 30 L 456 70 L 360 84 L 152 84 Z" fill="#1e1b4b" opacity="0.75" />
  <path d="M 140 30 L 372 30 L 350 40 L 162 40 Z" fill="#4338ca" />

  <g filter="url(#adv-shadow)">
    <!-- SPACE Text (Arched small upper) -->
    <text x="256" y="58" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-size="38" 
          font-weight="900" 
          text-anchor="middle" 
          letter-spacing="12"
          stroke="#1e1b4b" 
          stroke-width="8" 
          stroke-linejoin="round"
          fill="#1e1b4b">SPACE</text>
    <text x="256" y="58" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-size="38" 
          font-weight="900" 
          text-anchor="middle" 
          letter-spacing="12"
          fill="url(#adv-space-grad)">SPACE</text>

    <!-- ADVENTURE Text (Bold lower banner) -->
    <text x="256" y="128" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-size="56" 
          font-weight="900" 
          text-anchor="middle" 
          letter-spacing="4"
          stroke="#451a03" 
          stroke-width="12" 
          stroke-linejoin="round"
          fill="#451a03">ADVENTURE</text>
    <text x="256" y="128" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-size="56" 
          font-weight="900" 
          text-anchor="middle" 
          letter-spacing="4"
          fill="url(#adv-gold-grad)">ADVENTURE</text>
  </g>

  <!-- Gold Star Badges on either side -->
  <g transform="translate(48, 110)">
    <polygon points="0,-12 3.5,-3.5 12,0 3.5,3.5 0,12 -3.5,3.5 -12,0 -3.5,-3.5" fill="#facc15" stroke="#78350f" stroke-width="1" />
  </g>
  <g transform="translate(464, 110)">
    <polygon points="0,-12 3.5,-3.5 12,0 3.5,3.5 0,12 -3.5,3.5 -12,0 -3.5,-3.5" fill="#facc15" stroke="#78350f" stroke-width="1" />
  </g>
</svg>
