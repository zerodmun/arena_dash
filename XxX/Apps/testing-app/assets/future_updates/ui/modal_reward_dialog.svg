<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 520" width="420" height="520">
  <defs>
    <!-- Background Card Gradient -->
    <linearGradient id="m-rew-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="35%" stop-color="#0369a1" />
      <stop offset="70%" stop-color="#075985" />
      <stop offset="100%" stop-color="#0c4a6e" />
    </linearGradient>

    <!-- Outer Rim Bevel -->
    <linearGradient id="m-rew-rim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd" />
      <stop offset="30%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- Inner Well / Pedestal Chamber Gradient -->
    <radialGradient id="m-rew-well" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="70%" stop-color="#082f49" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#031d30" stop-opacity="0.9" />
    </radialGradient>

    <filter id="m-rew-drop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#020617" flood-opacity="0.7" />
    </filter>
  </defs>

  <!-- Drop Shadow & Frame Silhouette -->
  <g filter="url(#m-rew-drop)">
    <!-- Outer Card Rim -->
    <rect x="20" y="24" width="380" height="464" rx="28" fill="url(#m-rew-rim)" stroke="#082f49" stroke-width="4" />
    
    <!-- Inner Card Body -->
    <rect x="30" y="34" width="360" height="444" rx="20" fill="url(#m-rew-bg)" stroke="#0284c7" stroke-width="2" />
  </g>

  <!-- Top Header Ribbon / Plaque -->
  <path d="M 50 20 L 370 20 L 350 76 L 70 76 Z" fill="#0369a1" stroke="#38bdf8" stroke-width="2" />
  <rect x="64" y="24" width="292" height="44" rx="10" fill="#0284c7" />

  <!-- Header Text -->
  <text x="210" y="54" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="20" 
        font-weight="900" 
        text-anchor="middle" 
        letter-spacing="2"
        fill="#ffffff">YOU GOT A REWARD!</text>

  <!-- Inner Reward Showcase Chamber -->
  <rect x="52" y="96" width="316" height="260" rx="16" fill="url(#m-rew-well)" stroke="#38bdf8" stroke-width="2" stroke-dasharray="8 6" />

  <!-- Sunburst Rays behind reward inside chamber -->
  <g opacity="0.15" fill="#38bdf8" transform="translate(210, 226)">
    <polygon points="0,0 -30,-120 30,-120" />
    <polygon points="0,0 80,-90 120,-40" />
    <polygon points="0,0 120,30 90,80" />
    <polygon points="0,0 30,120 -30,120" />
    <polygon points="0,0 -90,80 -120,30" />
    <polygon points="0,0 -120,-40 -80,-90" />
  </g>

  <!-- Glowing Pedestal Base in Chamber -->
  <ellipse cx="210" cy="300" rx="90" ry="24" fill="#082f49" stroke="#38bdf8" stroke-width="2" />
  <ellipse cx="210" cy="300" rx="60" ry="14" fill="#38bdf8" opacity="0.4" />

  <!-- Corner Screw / Rivet Tech Accents -->
  <circle cx="44" cy="94" r="4" fill="#bae6fd" stroke="#082f49" stroke-width="1" />
  <circle cx="376" cy="94" r="4" fill="#bae6fd" stroke="#082f49" stroke-width="1" />
  <circle cx="44" cy="454" r="4" fill="#bae6fd" stroke="#082f49" stroke-width="1" />
  <circle cx="376" cy="454" r="4" fill="#bae6fd" stroke="#082f49" stroke-width="1" />

  <!-- Specular Glass Highlight -->
  <path d="M 40 40 L 380 40 C 370 120 180 100 40 180 Z" fill="#ffffff" opacity="0.08" />
</svg>
