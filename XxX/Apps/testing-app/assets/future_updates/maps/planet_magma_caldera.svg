<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Drop Shadow -->
    <filter id="pShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="8" flood-color="#000000" flood-opacity="0.8"/>
    </filter>

    <!-- Dark Basalt Rock Gradient -->
    <radialGradient id="basaltRock" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#71717a"/>
      <stop offset="30%" stop-color="#52525b"/>
      <stop offset="65%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#09090b"/>
    </radialGradient>

    <!-- Impact Crater Depths -->
    <radialGradient id="basaltCrater" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="60%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>

    <filter id="basaltGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Atmospheric Glow Halo -->
  <circle cx="128" cy="128" r="95" fill="#a855f7" opacity="0.25" filter="url(#basaltGlow)"/>

  <!-- Main Sphere -->
  <g filter="url(#pShadow)">
    <circle cx="128" cy="128" r="82" fill="url(#basaltRock)" stroke="#3f3f46" stroke-width="2.5"/>

    <!-- Polygonal Faceted Craters across Basalt Surface -->
    <ellipse cx="100" cy="105" rx="22" ry="18" fill="url(#basaltCrater)" stroke="#18181b" stroke-width="3"/>
    <path d="M 88,96 C 96,90 114,92 118,102" fill="none" stroke="#a1a1aa" stroke-width="2.5"/>

    <ellipse cx="155" cy="115" rx="26" ry="20" fill="url(#basaltCrater)" stroke="#18181b" stroke-width="3"/>
    <path d="M 140,105 C 150,98 170,102 176,112" fill="none" stroke="#a1a1aa" stroke-width="2.5"/>

    <ellipse cx="115" cy="155" rx="28" ry="22" fill="url(#basaltCrater)" stroke="#18181b" stroke-width="3.5"/>
    <path d="M 98,144 C 110,136 132,140 138,150" fill="none" stroke="#a1a1aa" stroke-width="3"/>

    <ellipse cx="165" cy="165" rx="20" ry="16" fill="url(#basaltCrater)" stroke="#18181b" stroke-width="3"/>
    <ellipse cx="75" cy="150" rx="16" ry="14" fill="url(#basaltCrater)" stroke="#18181b" stroke-width="2.5"/>

    <!-- Specular Highlight Crest -->
    <path d="M 75,75 C 95,55 145,55 168,70" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.75"/>
  </g>
</svg>
