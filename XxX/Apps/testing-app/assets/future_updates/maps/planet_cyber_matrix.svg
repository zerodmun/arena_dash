<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Drop Shadow -->
    <filter id="pShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="8" flood-color="#000000" flood-opacity="0.75"/>
    </filter>

    <!-- Solar Golden Base -->
    <radialGradient id="solarGold" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#fef08a"/>
      <stop offset="55%" stop-color="#facc15"/>
      <stop offset="80%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </radialGradient>

    <!-- Molten Crater Depths -->
    <radialGradient id="craterDeep" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#9a3412"/>
      <stop offset="60%" stop-color="#7c2d12"/>
      <stop offset="100%" stop-color="#431407"/>
    </radialGradient>

    <filter id="solarGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Atmospheric Glow Halo -->
  <circle cx="128" cy="128" r="94" fill="#facc15" opacity="0.35" filter="url(#solarGlow)"/>

  <!-- Main Sphere -->
  <g filter="url(#pShadow)">
    <circle cx="128" cy="128" r="88" fill="url(#solarGold)" stroke="#fde047" stroke-width="3"/>

    <!-- Giant Sunken Caldron Crater (Center Left) -->
    <ellipse cx="106" cy="142" rx="42" ry="32" fill="url(#craterDeep)" stroke="#ea580c" stroke-width="4"/>
    <ellipse cx="106" cy="142" rx="34" ry="24" fill="#7c2d12"/>
    <path d="M 80,135 C 85,155 125,160 135,145" fill="none" stroke="#fef08a" stroke-width="3.5" opacity="0.8"/>

    <!-- Minor Surface Craters -->
    <circle cx="158" cy="92" r="14" fill="url(#craterDeep)" stroke="#ea580c" stroke-width="2.5"/>
    <circle cx="158" cy="92" r="10" fill="#7c2d12"/>
    <path d="M 150,90 C 152,98 164,100 168,94" fill="none" stroke="#fef08a" stroke-width="2"/>

    <circle cx="178" cy="150" r="11" fill="url(#craterDeep)" stroke="#ea580c" stroke-width="2"/>
    <circle cx="178" cy="150" r="8" fill="#7c2d12"/>

    <circle cx="82" cy="85" r="9" fill="url(#craterDeep)" stroke="#ea580c" stroke-width="2"/>
    <circle cx="132" cy="62" r="7" fill="url(#craterDeep)"/>

    <!-- Specular Highlight Crest -->
    <path d="M 68,75 C 90,52 140,50 172,68" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.85"/>
  </g>
</svg>
