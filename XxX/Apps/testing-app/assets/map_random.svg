<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="warpCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#38bdf8"/>
      <stop offset="55%" stop-color="#818cf8"/>
      <stop offset="85%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#090526"/>
    </radialGradient>
    <filter id="warpGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Deep Cosmos Base -->
  <rect width="512" height="512" rx="28" fill="#040212"/>

  <!-- Swirling Hyperspace Vortex -->
  <circle cx="256" cy="256" r="200" fill="url(#warpCore)" opacity="0.4" filter="url(#warpGlow)"/>

  <!-- Celestial Astrolabe / Coordinate Rings -->
  <g stroke="#38bdf8" fill="none" opacity="0.75" filter="url(#warpGlow)">
    <circle cx="256" cy="256" r="180" stroke-width="3" stroke-dasharray="24 16"/>
    <circle cx="256" cy="256" r="140" stroke-width="2.5" stroke-dasharray="16 12"/>
    <circle cx="256" cy="256" r="95" stroke-width="2"/>
    <ellipse cx="256" cy="256" rx="180" ry="70" stroke-width="2" transform="rotate(35 256 256)"/>
    <ellipse cx="256" cy="256" rx="180" ry="70" stroke-width="2" transform="rotate(-35 256 256)"/>
  </g>

  <!-- 3D Holographic Quantum Probability Cube / Die in Center -->
  <g transform="translate(256, 256)" filter="url(#warpGlow)">
    <!-- Top Face -->
    <polygon points="0,-65 60,-32 0,0 -60,-32" fill="#60a5fa" stroke="#e0f2fe" stroke-width="3" opacity="0.9"/>
    <!-- Left Face -->
    <polygon points="-60,-32 0,0 0,65 -60,32" fill="#2563eb" stroke="#93c5fd" stroke-width="3" opacity="0.85"/>
    <!-- Right Face -->
    <polygon points="0,0 60,-32 60,32 0,65" fill="#1d4ed8" stroke="#93c5fd" stroke-width="3" opacity="0.85"/>

    <!-- Pips / Quantum Nodes -->
    <circle cx="0" cy="-32" r="6" fill="#ffffff"/>
    <circle cx="-30" cy="16" r="5" fill="#ffffff"/>
    <circle cx="-30" cy="-2" r="5" fill="#ffffff"/>
    <circle cx="30" cy="16" r="5" fill="#ffffff"/>
    <circle cx="30" cy="-2" r="5" fill="#ffffff"/>
    <circle cx="0" cy="32" r="5" fill="#ffffff"/>
  </g>

  <!-- Warp Ray Streaks -->
  <line x1="256" y1="40" x2="256" y2="100" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <line x1="256" y1="472" x2="256" y2="412" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <line x1="40" y1="256" x2="100" y2="256" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <line x1="472" y1="256" x2="412" y2="256" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>

  <!-- Sector HUD Tag -->
  <rect x="18" y="18" width="130" height="24" rx="6" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.5"/>
  <text x="83" y="34" font-family="-apple-system, sans-serif" font-size="10" font-weight="900" letter-spacing="1.5" fill="#c7d2fe" text-anchor="middle">🎲 RANDOM WARP</text>
</svg>