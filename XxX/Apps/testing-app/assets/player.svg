<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- Heavy Elevation Drop Shadow -->
    <filter id="pShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="14" flood-color="#000000" flood-opacity="0.65"/>
    </filter>

    <!-- Metallic Wing Gradient Left -->
    <linearGradient id="pWingL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="35%" stop-color="#0284c7"/>
      <stop offset="75%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#082f49"/>
    </linearGradient>

    <!-- Metallic Wing Gradient Right -->
    <linearGradient id="pWingR" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="35%" stop-color="#0284c7"/>
      <stop offset="75%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#082f49"/>
    </linearGradient>

    <!-- 3D Beveled Fuselage Spine -->
    <linearGradient id="pFuselage" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0c4a6e"/>
      <stop offset="25%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="75%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </linearGradient>

    <!-- Volumetric Cockpit Dome -->
    <radialGradient id="pCockpit" cx="42%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#67e8f9"/>
      <stop offset="60%" stop-color="#06b6d4"/>
      <stop offset="85%" stop-color="#0e7490"/>
      <stop offset="100%" stop-color="#083344"/>
    </radialGradient>

    <!-- Thruster Plasma Core -->
    <radialGradient id="pThruster" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#38bdf8"/>
      <stop offset="75%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g filter="url(#pShadow)">
    <!-- Plasma Exhaust Flames -->
    <ellipse cx="204" cy="420" rx="20" ry="42" fill="url(#pThruster)"/>
    <ellipse cx="308" cy="420" rx="20" ry="42" fill="url(#pThruster)"/>
    <ellipse cx="204" cy="415" rx="10" ry="24" fill="#ffffff"/>
    <ellipse cx="308" cy="415" rx="10" ry="24" fill="#ffffff"/>

    <!-- Left Main Wing -->
    <polygon points="256,48 256,360 84,410 112,284 196,192" fill="url(#pWingL)" stroke="#0c4a6e" stroke-width="6" stroke-linejoin="round"/>
    <!-- Left Wing Under-Armor Chamfer -->
    <polygon points="112,284 84,410 168,380 208,304" fill="#034b75" opacity="0.85"/>

    <!-- Right Main Wing -->
    <polygon points="256,48 256,360 428,410 400,284 316,192" fill="url(#pWingR)" stroke="#0c4a6e" stroke-width="6" stroke-linejoin="round"/>
    <!-- Right Wing Under-Armor Chamfer -->
    <polygon points="400,284 428,410 344,380 304,304" fill="#034b75" opacity="0.85"/>

    <!-- Left Wingtip Heavy Blaster Cannon -->
    <rect x="74" y="260" width="16" height="120" rx="8" fill="#1e293b" stroke="#0284c7" stroke-width="4"/>
    <rect x="78" y="270" width="8" height="60" rx="4" fill="#38bdf8"/>
    <circle cx="82" cy="260" r="10" fill="#38bdf8"/>
    <circle cx="82" cy="260" r="4" fill="#ffffff"/>

    <!-- Right Wingtip Heavy Blaster Cannon -->
    <rect x="422" y="260" width="16" height="120" rx="8" fill="#1e293b" stroke="#0284c7" stroke-width="4"/>
    <rect x="426" y="270" width="8" height="60" rx="4" fill="#38bdf8"/>
    <circle cx="430" cy="260" r="10" fill="#38bdf8"/>
    <circle cx="430" cy="260" r="4" fill="#ffffff"/>

    <!-- Central 3D Fuselage -->
    <polygon points="256,36 296,192 296,396 256,432 216,396 216,192" fill="url(#pFuselage)" stroke="#082f49" stroke-width="6" stroke-linejoin="round"/>

    <!-- Nose Armor Bevel Plate -->
    <polygon points="256,36 288,180 256,204 224,180" fill="#bae6fd" stroke="#0284c7" stroke-width="3"/>

    <!-- 3D Cockpit Canopy Glass Dome -->
    <ellipse cx="256" cy="246" rx="34" ry="72" fill="url(#pCockpit)" stroke="#083344" stroke-width="6"/>
    <!-- Specular Highlight Arc -->
    <path d="M242,196 Q264,206 264,248" stroke="#ffffff" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.9"/>
    <circle cx="260" cy="220" r="5" fill="#ffffff"/>

    <!-- Twin Thruster Nozzles -->
    <rect x="188" y="396" width="32" height="24" rx="6" fill="#1e293b" stroke="#0284c7" stroke-width="4"/>
    <rect x="292" y="396" width="32" height="24" rx="6" fill="#1e293b" stroke="#0284c7" stroke-width="4"/>

    <!-- Center Spine Luminescent Indicator -->
    <line x1="256" y1="56" x2="256" y2="172" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.85"/>
    <circle cx="256" cy="356" r="10" fill="#38bdf8" stroke="#ffffff" stroke-width="3"/>
  </g>
</svg>
