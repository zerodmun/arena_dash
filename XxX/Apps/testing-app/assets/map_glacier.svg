<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Arctic Sky Gradient -->
    <linearGradient id="glacierSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="35%" stop-color="#082f49"/>
      <stop offset="70%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Aurora Borealis Ribbon -->
    <linearGradient id="auroraGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.1"/>
      <stop offset="25%" stop-color="#34d399" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#22d3ee" stop-opacity="0.9"/>
      <stop offset="75%" stop-color="#818cf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Glacial Sapphire Ice -->
    <linearGradient id="iceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#e0f2fe"/>
      <stop offset="55%" stop-color="#7dd3fc"/>
      <stop offset="85%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <!-- Deep Crevasse Abyss -->
    <linearGradient id="crevasseAbyss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#082f49"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Frost Bloom Filter -->
    <filter id="iceBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Arctic Sky Background -->
  <rect width="512" height="512" rx="28" fill="url(#glacierSky)"/>

  <!-- Polar Aurora Ribbons -->
  <path d="M-20,90 Q120,40 260,110 T530,60 L530,140 Q380,80 240,150 T-20,130 Z" fill="url(#auroraGlow)" filter="url(#iceBloom)"/>
  <path d="M-20,130 Q160,80 320,150 T530,110 L530,170 Q340,120 180,180 T-20,160 Z" fill="url(#auroraGlow)" opacity="0.6"/>

  <!-- Distant Glacial Horns & Jagged Ice Peaks -->
  <polygon points="50,210 110,130 170,220" fill="#bae6fd" stroke="#0284c7" stroke-width="2"/>
  <polygon points="150,225 240,110 330,230" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <polygon points="310,215 390,135 470,220" fill="#bae6fd" stroke="#0284c7" stroke-width="2"/>

  <!-- Background Ice Shelf -->
  <path d="M-20,240 Q130,190 280,240 T530,210 L530,530 L-20,530 Z" fill="#7dd3fc"/>
  <path d="M-20,240 Q130,190 280,240 T530,210" fill="none" stroke="#ffffff" stroke-width="3" filter="url(#iceBloom)"/>

  <!-- Deep Blue Glacial Crevasses -->
  <path d="M120,260 Q180,310 150,380 L180,390 Q220,320 150,260 Z" fill="url(#crevasseAbyss)"/>
  <path d="M340,250 Q280,320 330,390 L360,380 Q320,310 370,250 Z" fill="url(#crevasseAbyss)"/>

  <!-- Midground Ice Shelf Plates (Layered Frost Sheen) -->
  <path d="M-20,320 Q160,250 340,320 T530,280 L530,530 L-20,530 Z" fill="url(#iceGrad)"/>
  <path d="M-20,320 Q160,250 340,320 T530,280" fill="none" stroke="#ffffff" stroke-width="4.5" filter="url(#iceBloom)"/>

  <!-- Central Chasm / Glacial River Crevasse -->
  <path d="M-20,430 Q160,360 270,410 T530,370 L530,440 Q380,470 240,460 T-20,470 Z" fill="url(#crevasseAbyss)"/>
  <path d="M-10,435 Q160,370 270,415 T520,385" fill="none" stroke="#38bdf8" stroke-width="8" filter="url(#iceBloom)"/>
  <path d="M-10,435 Q160,370 270,415 T520,385" fill="none" stroke="#e0f2fe" stroke-width="3"/>

  <!-- Foreground Pack Ice Blocks & Pressure Ridges -->
  <polygon points="60,370 140,350 170,410 90,430" fill="#f0f9ff" stroke="#38bdf8" stroke-width="3"/>
  <polygon points="360,360 440,340 470,400 390,420" fill="#f0f9ff" stroke="#38bdf8" stroke-width="3"/>
  <polygon points="210,460 290,440 310,495 230,510" fill="#f0f9ff" stroke="#38bdf8" stroke-width="3"/>

  <!-- Cryo Monolith Obelisks -->
  <g transform="translate(190, 240)">
    <polygon points="12,0 0,65 24,65" fill="#38bdf8" stroke="#ffffff" stroke-width="2"/>
    <circle cx="12" cy="0" r="5" fill="#ffffff" filter="url(#iceBloom)"/>
  </g>
  <g transform="translate(300, 260)">
    <polygon points="14,0 0,75 28,75" fill="#38bdf8" stroke="#ffffff" stroke-width="2"/>
    <circle cx="14" cy="0" r="6" fill="#ffffff" filter="url(#iceBloom)"/>
  </g>

  <!-- Drifting Ice Crystals & Snow Glints -->
  <g fill="#ffffff" opacity="0.9">
    <circle cx="80" cy="180" r="2" filter="url(#iceBloom)"/>
    <circle cx="160" cy="150" r="2.5" filter="url(#iceBloom)"/>
    <circle cx="280" cy="190" r="2" filter="url(#iceBloom)"/>
    <circle cx="420" cy="170" r="2.5" filter="url(#iceBloom)"/>
    <circle cx="360" cy="220" r="2" filter="url(#iceBloom)"/>
  </g>

  <!-- Perimeter Frame -->
  <rect x="2" y="2" width="508" height="508" rx="26" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.4"/>
</svg>
