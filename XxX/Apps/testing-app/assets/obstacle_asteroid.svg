<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="meteorGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#b066ff" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#551a8b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#050014" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rockGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#807599"/>
      <stop offset="40%" stop-color="#544c66"/>
      <stop offset="80%" stop-color="#302a3d"/>
      <stop offset="100%" stop-color="#171321"/>
    </linearGradient>
    <filter id="rockShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000000" flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- Deep Space Drop Shadow -->
  <ellipse cx="256" cy="460" rx="190" ry="34" fill="#000000" opacity="0.75" filter="blur(10px)"/>

  <!-- Cosmic Mineral Aura -->
  <circle cx="256" cy="256" r="220" fill="url(#meteorGlow)"/>

  <!-- Main Asteroid Body -->
  <g filter="url(#rockShadow)">
    <polygon points="170,70 290,50 410,110 460,230 440,360 360,450 220,470 110,410 60,290 80,160" 
             fill="url(#rockGrad)" stroke="#110d1a" stroke-width="10" stroke-linejoin="round"/>

    <!-- Facet Chisel Shading -->
    <polygon points="170,70 290,50 270,180 160,190" fill="#998eb3" opacity="0.6"/>
    <polygon points="290,50 410,110 360,220 270,180" fill="#6d6382" opacity="0.7"/>
    <polygon points="410,110 460,230 380,290 360,220" fill="#443c54"/>
    <polygon points="460,230 440,360 330,340 380,290" fill="#251f30"/>
    <polygon points="440,360 360,450 260,370 330,340" fill="#1b1524"/>
    <polygon points="360,450 220,470 200,360 260,370" fill="#221b2e"/>
    <polygon points="220,470 110,410 140,310 200,360" fill="#322a40"/>
    <polygon points="110,410 60,290 150,260 140,310" fill="#4b425c"/>
    <polygon points="60,290 80,160 160,190 150,260" fill="#635878"/>

    <!-- Impact Craters -->
    <!-- Crater 1 -->
    <ellipse cx="220" cy="140" rx="34" ry="24" fill="#1a1424" stroke="#7a6e94" stroke-width="4"/>
    <ellipse cx="222" cy="142" rx="26" ry="17" fill="#0d0914"/>
    
    <!-- Crater 2 -->
    <ellipse cx="340" cy="270" rx="44" ry="30" fill="#140f1c" stroke="#5c5273" stroke-width="5"/>
    <ellipse cx="342" cy="272" rx="32" ry="20" fill="#09060d"/>

    <!-- Crater 3 -->
    <ellipse cx="180" cy="340" rx="28" ry="20" fill="#161121" stroke="#504666" stroke-width="4"/>
    <ellipse cx="181" cy="341" rx="20" ry="13" fill="#0a0710"/>

    <!-- Glowing Violet Mineral Veins -->
    <path d="M260 180 L290 230 L270 300 L320 330" stroke="#d580ff" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M290 230 L340 210 L370 240" stroke="#bb44ff" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M160 190 L180 240 L150 280" stroke="#e6b3ff" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>
</svg>