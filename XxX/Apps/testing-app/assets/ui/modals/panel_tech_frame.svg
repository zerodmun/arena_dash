<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 320" width="512" height="320">
  <defs>
    <!-- Translucent tech glass fill -->
    <linearGradient id="tf-glass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.12" />
      <stop offset="50%" stop-color="#082f49" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#031d30" stop-opacity="0.35" />
    </linearGradient>

    <!-- Neon cyber border -->
    <linearGradient id="tf-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <filter id="tf-drop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#020617" flood-opacity="0.6" />
    </filter>
  </defs>

  <g filter="url(#tf-drop)">
    <!-- Chamfered Outer Tech Frame -->
    <polygon points="36,16 476,16 496,36 496,284 476,304 36,304 16,284 16,36" 
             fill="url(#tf-glass)" stroke="url(#tf-rim)" stroke-width="2" />
  </g>

  <!-- Heavy 90-Degree Tech Corner Brackets -->
  <path d="M 12 48 L 12 24 L 36 24" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 500 48 L 500 24 L 476 24" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 12 272 L 12 296 L 36 296" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 500 272 L 500 296 L 476 296" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Horizontal Tech Marker Bars -->
  <line x1="48" y1="16" x2="100" y2="16" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
  <line x1="412" y1="16" x2="464" y2="16" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
  <line x1="48" y1="304" x2="100" y2="304" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
  <line x1="412" y1="304" x2="464" y2="304" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />

  <!-- Subtle Interior Reticle Guides -->
  <line x1="32" y1="64" x2="480" y2="64" stroke="#0284c7" stroke-width="1" stroke-dasharray="8 6" opacity="0.4" />
  <line x1="32" y1="256" x2="480" y2="256" stroke="#0284c7" stroke-width="1" stroke-dasharray="8 6" opacity="0.4" />

  <!-- Center Crosshairs on Edges -->
  <circle cx="256" cy="16" r="3" fill="#38bdf8" />
  <circle cx="256" cy="304" r="3" fill="#38bdf8" />
  <circle cx="16" cy="160" r="3" fill="#38bdf8" />
  <circle cx="496" cy="160" r="3" fill="#38bdf8" />
</svg>
