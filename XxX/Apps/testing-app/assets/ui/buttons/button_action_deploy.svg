<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 68" width="200" height="68">
  <defs>
    <linearGradient id="btn-dep-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" />
      <stop offset="30%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#0284c7" />
      <stop offset="95%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>

    <filter id="btn-dep-drop" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="3" flood-color="#020617" flood-opacity="0.5" />
    </filter>
  </defs>

  <g filter="url(#btn-dep-drop)">
    <!-- Base Rim -->
    <rect x="6" y="6" width="188" height="56" rx="28" fill="#082f49" stroke="#0284c7" stroke-width="2.5" />
    <!-- Face -->
    <rect x="8" y="8" width="184" height="48" rx="24" fill="url(#btn-dep-grad)" stroke="#bae6fd" stroke-width="1.2" />
  </g>

  <!-- Top Sheen -->
  <path d="M 24 10 Q 100 16 176 10 Q 160 22 100 22 Q 40 22 24 10 Z" fill="#ffffff" opacity="0.45" />

  <!-- DEPLOY Text -->
  <text x="100" y="42" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="28" 
        font-weight="900" 
        letter-spacing="4"
        text-anchor="middle" 
        fill="#082f49" 
        opacity="0.6"
        transform="translate(0, 2)">DEPLOY</text>
  <text x="100" y="42" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="28" 
        font-weight="900" 
        letter-spacing="4"
        text-anchor="middle" 
        fill="#ffffff" 
        stroke="#082f49" 
        stroke-width="1.2">DEPLOY</text>
</svg>
