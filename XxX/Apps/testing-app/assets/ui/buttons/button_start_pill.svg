<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 84" width="280" height="84">
  <defs>
    <!-- Golden gloss gradient -->
    <linearGradient id="btn-gold-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef9c3" />
      <stop offset="25%" stop-color="#facc15" />
      <stop offset="65%" stop-color="#eab308" />
      <stop offset="90%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#854d0e" />
    </linearGradient>

    <!-- Outer rim bevel -->
    <linearGradient id="btn-gold-rim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#713f12" />
    </linearGradient>

    <filter id="btn-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#020617" flood-opacity="0.6" />
    </filter>
  </defs>

  <g filter="url(#btn-shadow)">
    <!-- Base Border -->
    <rect x="8" y="6" width="264" height="68" rx="34" fill="url(#btn-gold-rim)" stroke="#78350f" stroke-width="2.5" />
    
    <!-- Main Button Face -->
    <rect x="12" y="10" width="256" height="60" rx="30" fill="url(#btn-gold-grad)" stroke="#fef08a" stroke-width="1.5" />
  </g>

  <!-- Top Glass Highlight Sheen -->
  <path d="M 38 12 Q 140 20 242 12 Q 220 30 140 30 Q 60 30 38 12 Z" fill="#ffffff" opacity="0.45" />

  <!-- Play Chevron Icon & Text "START" -->
  <g transform="translate(130, 48)">
    <!-- Play Triangle -->
    <polygon points="-65,-14 -65,14 -40,0" fill="#78350f" transform="translate(0, 2)" opacity="0.5" />
    <polygon points="-65,-14 -65,14 -40,0" fill="#ffffff" stroke="#78350f" stroke-width="1.5" />

    <!-- Text START with 3D drop shadow -->
    <text x="15" y="8" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-size="34" 
          font-weight="900" 
          letter-spacing="4"
          text-anchor="middle" 
          fill="#78350f" 
          opacity="0.6"
          transform="translate(0, 2)">START</text>
    <text x="15" y="8" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-size="34" 
          font-weight="900" 
          letter-spacing="4"
          text-anchor="middle" 
          fill="#ffffff" 
          stroke="#78350f" 
          stroke-width="1.2">START</text>
  </g>

  <!-- Sparkle Accent -->
  <polygon points="40,20 42,24 46,25 42,26 40,30 38,26 34,25 38,24" fill="#ffffff" />
</svg>
