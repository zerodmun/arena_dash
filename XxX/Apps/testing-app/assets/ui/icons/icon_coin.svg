<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="ic-coin-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#facc15" />
      <stop offset="80%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#854d0e" />
    </linearGradient>

    <radialGradient id="ic-coin-face" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#fef9c3" />
      <stop offset="40%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#ca8a04" />
    </radialGradient>
  </defs>

  <!-- Shadow -->
  <circle cx="24" cy="26" r="20" fill="#78350f" opacity="0.4" />

  <!-- Coin Rim & Face -->
  <circle cx="24" cy="24" r="20" fill="url(#ic-coin-rim)" stroke="#78350f" stroke-width="1.5" />
  <circle cx="24" cy="24" r="16" fill="url(#ic-coin-face)" stroke="#ca8a04" stroke-width="1" />

  <!-- Star Insignia -->
  <polygon points="24,14 26.8,20 33,21 28.5,25.5 30,32 24,28.5 18,32 19.5,25.5 15,21 21.2,20" fill="#ffffff" stroke="#eab308" stroke-width="0.8" />
  <circle cx="20" cy="18" r="1.5" fill="#ffffff" />
</svg>
