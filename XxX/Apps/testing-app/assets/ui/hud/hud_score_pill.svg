<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 56" width="240" height="56">
  <defs>
    <!-- Capsule border gradient -->
    <linearGradient id="score-rim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>

    <!-- Translucent capsule body -->
    <linearGradient id="score-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0.95" />
    </linearGradient>

    <!-- Socket gold gradient -->
    <linearGradient id="score-socket" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#854d0e" />
    </linearGradient>

    <filter id="score-drop" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#020617" flood-opacity="0.6" />
    </filter>
  </defs>

  <g filter="url(#score-drop)">
    <!-- Capsule Pill Frame -->
    <rect x="24" y="8" width="206" height="40" rx="20" fill="url(#score-bg)" stroke="url(#score-rim)" stroke-width="2" />
  </g>

  <!-- Score Counter Text -->
  <text x="135" y="34" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="20" 
        font-weight="900" 
        letter-spacing="2"
        text-anchor="middle" 
        fill="#fef08a">854,200</text>

  <!-- Circular Star Trophy Socket on Left -->
  <g transform="translate(28, 28)" filter="url(#score-drop)">
    <!-- Outer gold bevel ring -->
    <circle cx="0" cy="0" r="24" fill="url(#score-socket)" stroke="#78350f" stroke-width="2" />
    <!-- Inner dark socket -->
    <circle cx="0" cy="0" r="19" fill="#082f49" />

    <!-- Mini Star Insignia -->
    <polygon points="0,-12 3.5,-3.5 12,0 3.5,3.5 0,12 -3.5,3.5 -12,0 -3.5,-3.5" fill="#facc15" stroke="#ca8a04" stroke-width="1" />
    <circle cx="0" cy="0" r="3" fill="#ffffff" />
  </g>

  <!-- Multiplier Indicator Pill on Right -->
  <g transform="translate(205, 28)">
    <rect x="-18" y="-10" width="36" height="20" rx="10" fill="#ea580c" stroke="#fed7aa" stroke-width="1" />
    <text x="0" y="4" font-family="system-ui, sans-serif" font-size="11" font-weight="900" text-anchor="middle" fill="#ffffff">x3</text>
  </g>
</svg>
