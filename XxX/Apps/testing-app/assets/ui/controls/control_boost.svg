<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- Heavy Drop Shadow for 3D Bevel -->
    <filter id="bShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="16" flood-color="#000000" flood-opacity="0.75"/>
    </filter>

    <!-- Outer Chrome Bezel (Exact match to fire_button) -->
    <linearGradient id="bBezel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="30%" stop-color="#94a3b8"/>
      <stop offset="65%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- 3D Amber Boost Trigger Dome -->
    <radialGradient id="bTrigger" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="20%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="80%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </radialGradient>
  </defs>

  <g filter="url(#bShadow)">
    <!-- Heavy Bezel Outer Ring -->
    <circle cx="256" cy="256" r="236" fill="url(#bBezel)" stroke="#0f172a" stroke-width="8"/>

    <!-- Dark Recessed Well -->
    <circle cx="256" cy="256" r="206" fill="#090d16" stroke="#f59e0b" stroke-width="4"/>

    <!-- Raised 3D Trigger Button -->
    <circle cx="256" cy="256" r="192" fill="url(#bTrigger)" stroke="#d97706" stroke-width="8"/>

    <!-- Tactile Non-Slip Outer Groove -->
    <circle cx="256" cy="256" r="162" fill="none" stroke="#fde68a" stroke-width="5" stroke-dasharray="28 20" opacity="0.6"/>

    <!-- Dual Aerodynamic Boost Flame / Lightning Glyph -->
    <g transform="translate(256, 256)">
      <!-- Outer Flame / Arrow Shell -->
      <path d="M 0 -95 L 68 0 L 32 0 L 52 85 L -52 85 L -32 0 L -68 0 Z" 
            fill="#ffffff" stroke="#b45309" stroke-width="6" stroke-linejoin="round" opacity="0.95"/>
      
      <!-- Inner Core Energy Bolt -->
      <path d="M 0 -70 L 44 4 L 18 4 L 32 65 L -32 65 L -18 4 L -44 4 Z" 
            fill="#fbbf24"/>
      
      <polygon points="0,-45 20,12 0,12 10,48 -10,48 0,20 -16,20" fill="#ffffff"/>
    </g>

    <!-- Specular Highlight Curve (Exact match to fire_button) -->
    <path d="M140,165 A165,165 0 0,1 372,165" stroke="#ffffff" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.75"/>
  </g>
</svg>
