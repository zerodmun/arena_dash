<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- Heavy Holographic Disc Fill -->
    <radialGradient id="jDisc" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.12"/>
      <stop offset="55%" stop-color="#0369a1" stop-opacity="0.25"/>
      <stop offset="85%" stop-color="#38bdf8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.75"/>
    </radialGradient>

    <!-- Metallic Rim Bezel -->
    <linearGradient id="jRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#082f49"/>
    </linearGradient>
  </defs>

  <g>
    <!-- Outer Glass Disc -->
    <circle cx="256" cy="256" r="236" fill="url(#jDisc)" stroke="url(#jRim)" stroke-width="8"/>

    <!-- Concentric Cyber Rings -->
    <circle cx="256" cy="256" r="196" fill="none" stroke="#38bdf8" stroke-width="5" stroke-dasharray="40 24" opacity="0.8"/>
    <circle cx="256" cy="256" r="138" fill="none" stroke="#0ea5e9" stroke-width="4" stroke-dasharray="20 20" opacity="0.6"/>
    <circle cx="256" cy="256" r="70" fill="none" stroke="#38bdf8" stroke-width="4" opacity="0.45"/>

    <!-- 4 Cardinal Direction Notches -->
    <line x1="256" y1="28" x2="256" y2="60" stroke="#38bdf8" stroke-width="10" stroke-linecap="round"/>
    <line x1="256" y1="452" x2="256" y2="484" stroke="#38bdf8" stroke-width="10" stroke-linecap="round"/>
    <line x1="28" y1="256" x2="60" y2="256" stroke="#38bdf8" stroke-width="10" stroke-linecap="round"/>
    <line x1="452" y1="256" x2="484" y2="256" stroke="#38bdf8" stroke-width="10" stroke-linecap="round"/>
  </g>
</svg>
