<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <filter id="cShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="8" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
    <linearGradient id="cryoIce" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#bae6fd"/>
      <stop offset="70%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="cryoGlow">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#cShadow)">
    <polygon points="128,18 204,74 214,166 166,228 88,228 42,166 52,74" fill="url(#cryoIce)" stroke="#0284c7" stroke-width="4" stroke-linejoin="round"/>
    <!-- Crystal Facets -->
    <polygon points="128,18 128,124 52,74" fill="#e0f2fe" opacity="0.8"/>
    <polygon points="128,18 204,74 128,124" fill="#ffffff" opacity="0.9"/>
    <polygon points="204,74 214,166 128,124" fill="#38bdf8" opacity="0.7"/>
    <polygon points="214,166 166,228 128,124" fill="#0284c7" opacity="0.8"/>
    <polygon points="166,228 88,228 128,124" fill="#0369a1" opacity="0.85"/>
    <polygon points="88,228 42,166 128,124" fill="#0284c7" opacity="0.8"/>
    <polygon points="42,166 52,74 128,124" fill="#7dd3fc" opacity="0.75"/>
    <!-- Crystalline Core Pulse -->
    <circle cx="128" cy="124" r="14" fill="#ffffff" filter="url(#cryoGlow)"/>
    <circle cx="128" cy="124" r="6" fill="#38bdf8"/>
  </g>
</svg>
