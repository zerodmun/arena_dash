<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <filter id="bShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="8" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
    <linearGradient id="basaltRock" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#52525b"/>
      <stop offset="35%" stop-color="#3f3f46"/>
      <stop offset="70%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
    <filter id="magmaGlow">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#bShadow)">
    <polygon points="128,24 196,68 220,150 188,218 84,226 38,154 56,76" fill="url(#basaltRock)" stroke="#09090b" stroke-width="4" stroke-linejoin="round"/>
    <!-- Internal Rock Facets -->
    <polygon points="128,24 136,120 56,76" fill="#3f3f46"/>
    <polygon points="128,24 196,68 136,120" fill="#71717a" opacity="0.6"/>
    <polygon points="196,68 220,150 136,120" fill="#27272a"/>
    <polygon points="220,150 188,218 136,120" fill="#18181b"/>
    <polygon points="188,218 84,226 136,120" fill="#27272a"/>
    <polygon points="84,226 38,154 136,120" fill="#3f3f46"/>
    <!-- Glowing Magma Veins -->
    <path d="M128,24 L136,120 L84,226" fill="none" stroke="#f97316" stroke-width="4" filter="url(#magmaGlow)"/>
    <path d="M136,120 L220,150" fill="none" stroke="#ef4444" stroke-width="3.5" filter="url(#magmaGlow)"/>
    <path d="M136,120 L56,76" fill="none" stroke="#facc15" stroke-width="2.5" filter="url(#magmaGlow)"/>
    <circle cx="136" cy="120" r="6" fill="#fef08a" filter="url(#magmaGlow)"/>
  </g>
</svg>
