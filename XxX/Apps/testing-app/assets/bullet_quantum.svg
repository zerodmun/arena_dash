<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="qSingularity" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#d8b4fe"/>
      <stop offset="60%" stop-color="#a855f7"/>
      <stop offset="90%" stop-color="#6b21a8"/>
      <stop offset="100%" stop-color="#3b0764"/>
    </radialGradient>
    <filter id="qGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Gravitational Lensing Halo -->
  <circle cx="128" cy="128" r="105" fill="#c084fc" opacity="0.25" filter="url(#qGlow)"/>
  
  <!-- 3-Way Dimensional Orbit Rings -->
  <ellipse cx="128" cy="128" rx="90" ry="32" fill="none" stroke="#e9d5ff" stroke-width="3" transform="rotate(-30 128 128)" opacity="0.85"/>
  <ellipse cx="128" cy="128" rx="90" ry="32" fill="none" stroke="#c084fc" stroke-width="3" transform="rotate(30 128 128)" opacity="0.85"/>
  <ellipse cx="128" cy="128" rx="90" ry="32" fill="none" stroke="#a855f7" stroke-width="2.5" opacity="0.7"/>

  <!-- Micro Orbiting Energy Nodes -->
  <circle cx="56" cy="92" r="8" fill="#ffffff" filter="url(#qGlow)"/>
  <circle cx="200" cy="164" r="8" fill="#ffffff" filter="url(#qGlow)"/>
  <circle cx="128" cy="40" r="7" fill="#e9d5ff" filter="url(#qGlow)"/>

  <!-- High-Density Quantum Singularity Core -->
  <circle cx="128" cy="128" r="48" fill="url(#qSingularity)" stroke="#ffffff" stroke-width="5"/>
  <circle cx="118" cy="116" r="12" fill="#ffffff"/>
</svg>