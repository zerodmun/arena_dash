<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="fgtShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="16" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
    <linearGradient id="fgtArmor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="30%" stop-color="#475569"/>
      <stop offset="70%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="fgtPlate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="50%" stop-color="#991b1b"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </linearGradient>
    <radialGradient id="fgtCore" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#fca5a5"/>
      <stop offset="60%" stop-color="#ef4444"/>
      <stop offset="90%" stop-color="#991b1b"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </radialGradient>
    <radialGradient id="fgtFlame" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#fef08a"/>
      <stop offset="70%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#dc2626" stop-opacity="0"/>
    </radialGradient>
    <filter id="fgtBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#fgtShadow)">
    <!-- Heavy Center Thruster Exhaust -->
    <ellipse cx="256" cy="435" rx="20" ry="40" fill="url(#fgtFlame)" filter="url(#fgtBloom)"/>
    <ellipse cx="256" cy="425" rx="10" ry="20" fill="#ffffff"/>

    <!-- Heavy Shoulder Armor Pods -->
    <polygon points="170,180 120,240 140,360 200,340" fill="#334155" stroke="#0f172a" stroke-width="3"/>
    <polygon points="342,180 392,240 372,360 312,340" fill="#334155" stroke="#0f172a" stroke-width="3"/>

    <!-- Main Angular Wings -->
    <polygon points="256,90 190,200 68,310 98,375 220,350 220,415" 
             fill="url(#fgtArmor)" stroke="#0f172a" stroke-width="4" stroke-linejoin="round"/>
    <polygon points="256,90 322,200 444,310 414,375 292,350 292,415" 
             fill="url(#fgtArmor)" stroke="#0f172a" stroke-width="4" stroke-linejoin="round"/>

    <!-- Dual Heavy Wingtip Pulse Cannons -->
    <rect x="62" y="260" width="12" height="110" rx="4" fill="#0f172a" stroke="#dc2626" stroke-width="2"/>
    <circle cx="68" cy="255" r="5" fill="#fef08a" filter="url(#fgtBloom)"/>
    <rect x="438" y="260" width="12" height="110" rx="4" fill="#0f172a" stroke="#dc2626" stroke-width="2"/>
    <circle cx="444" cy="255" r="5" fill="#fef08a" filter="url(#fgtBloom)"/>

    <!-- Reinforced Red Armor Plates -->
    <polygon points="180,220 110,295 130,340 195,290" fill="url(#fgtPlate)" stroke="#450a0a" stroke-width="2"/>
    <polygon points="332,220 402,295 382,340 317,290" fill="url(#fgtPlate)" stroke="#450a0a" stroke-width="2"/>

    <!-- Heavy Triangular Center Hull -->
    <polygon points="256,50 210,180 206,390 256,420 306,390 302,180" 
             fill="url(#fgtArmor)" stroke="#0f172a" stroke-width="4" stroke-linejoin="round"/>

    <!-- Chiseled Cockpit Visor Brow -->
    <polygon points="256,150 220,210 256,230 292,210" fill="#0f172a" stroke="#dc2626" stroke-width="2"/>
    <polygon points="256,165 228,210 256,224 284,210" fill="url(#fgtCore)" filter="url(#fgtBloom)"/>

    <!-- Chiseled Armor Chest Crest -->
    <polygon points="256,240 226,290 256,350 286,290" fill="url(#fgtPlate)" stroke="#450a0a" stroke-width="2.5"/>
    <polygon points="256,260 236,295 256,335 276,295" fill="#ffffff" opacity="0.3"/>

    <!-- Specular Highlight Ridge -->
    <line x1="256" y1="55" x2="215" y2="175" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  </g>
</svg>