<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <filter id="spkBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Electrical hull breach sparks -->
  <g stroke="#fef08a" stroke-width="3" fill="none" filter="url(#spkBloom)">
    <path d="M 128,128 L 90,70 L 110,50"/>
    <path d="M 128,128 L 180,80 L 170,50 L 210,40"/>
    <path d="M 128,128 L 200,150 L 230,140"/>
    <path d="M 128,128 L 160,200 L 190,220"/>
    <path d="M 128,128 L 80,180 L 50,210"/>
    <path d="M 128,128 L 60,110 L 30,100"/>
  </g>
  <circle cx="128" cy="128" r="24" fill="#ffffff" filter="url(#spkBloom)"/>
  <circle cx="128" cy="128" r="12" fill="#facc15"/>
</svg>