<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="scoutShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="16" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
    <linearGradient id="scoutArmor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="30%" stop-color="#475569"/>
      <stop offset="70%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="scoutRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e11d48"/>
      <stop offset="50%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#9f1239"/>
    </linearGradient>
    <radialGradient id="scoutEye" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#f97316"/>
      <stop offset="90%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </radialGradient>
    <radialGradient id="thrusterCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#67e8f9"/>
      <stop offset="75%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0891b2" stop-opacity="0"/>
    </radialGradient>
    <filter id="scoutBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#scoutShadow)">
    <!-- Engine Exhaust Jet -->
    <ellipse cx="256" cy="425" rx="16" ry="32" fill="url(#thrusterCyan)" filter="url(#scoutBloom)"/>
    <ellipse cx="256" cy="415" rx="8" ry="16" fill="#ffffff"/>

    <!-- Dual Forward Sensor Antennae -->
    <line x1="220" y1="120" x2="200" y2="45" stroke="#f43f5e" stroke-width="4" stroke-linecap="round"/>
    <circle cx="200" cy="45" r="5" fill="#fef08a" filter="url(#scoutBloom)"/>
    <line x1="292" y1="120" x2="312" y2="45" stroke="#f43f5e" stroke-width="4" stroke-linecap="round"/>
    <circle cx="312" cy="45" r="5" fill="#fef08a" filter="url(#scoutBloom)"/>

    <!-- Sleek Delta Wings -->
    <!-- Left Wing -->
    <polygon points="256,90 220,160 110,340 145,370 230,320 230,400" 
             fill="url(#scoutArmor)" stroke="#0f172a" stroke-width="4" stroke-linejoin="round"/>
    <!-- Right Wing -->
    <polygon points="256,90 292,160 402,340 367,370 282,320 282,400" 
             fill="url(#scoutArmor)" stroke="#0f172a" stroke-width="4" stroke-linejoin="round"/>

    <!-- Wingtip Kinetic Cannons -->
    <rect x="104" y="270" width="8" height="85" rx="3" fill="#0f172a" stroke="#f43f5e" stroke-width="1.5"/>
    <polygon points="108,260 102,272 114,272" fill="#f43f5e"/>
    <rect x="400" y="270" width="8" height="85" rx="3" fill="#0f172a" stroke="#f43f5e" stroke-width="1.5"/>
    <polygon points="404,260 398,272 410,272" fill="#f43f5e"/>

    <!-- Red Wing Edge Trims -->
    <polygon points="256,90 220,160 135,320 150,335 228,175" fill="url(#scoutRed)"/>
    <polygon points="256,90 292,160 377,320 362,335 284,175" fill="url(#scoutRed)"/>

    <!-- Central Chassis / Body -->
    <polygon points="256,70 226,170 226,380 256,410 286,380 286,170" 
             fill="url(#scoutArmor)" stroke="#0f172a" stroke-width="4" stroke-linejoin="round"/>

    <!-- Raised Spine -->
    <polygon points="256,85 240,180 240,360 256,385 272,360 272,180" 
             fill="#334155" stroke="#0f172a" stroke-width="2"/>

    <!-- Menacing Optical Sensor Eye (Cockpit) -->
    <ellipse cx="256" cy="205" rx="22" ry="16" fill="url(#scoutEye)" stroke="#450a0a" stroke-width="3" filter="url(#scoutBloom)"/>
    <ellipse cx="252" cy="201" rx="6" ry="4" fill="#ffffff" opacity="0.9"/>

    <!-- Auxiliary Engine Cowling Vents -->
    <rect x="238" y="380" width="36" height="18" rx="4" fill="#0f172a" stroke="#f43f5e" stroke-width="2"/>

    <!-- Specular Highlight Sheen -->
    <path d="M 256,75 L 230,170 L 230,300" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.7"/>
  </g>
</svg>