<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="bmShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="26" stdDeviation="18" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
    <linearGradient id="bmArmor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="35%" stop-color="#334155"/>
      <stop offset="70%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="bmHazard" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <radialGradient id="bmEye" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#f97316"/>
      <stop offset="90%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </radialGradient>
    <radialGradient id="bmFlame" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#fde047"/>
      <stop offset="70%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#991b1b" stop-opacity="0"/>
    </radialGradient>
    <filter id="bmBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#bmShadow)">
    <!-- Heavy Quad Engine Exhausts -->
    <ellipse cx="190" cy="430" rx="14" ry="34" fill="url(#bmFlame)" filter="url(#bmBloom)"/>
    <ellipse cx="230" cy="435" rx="14" ry="38" fill="url(#bmFlame)" filter="url(#bmBloom)"/>
    <ellipse cx="282" cy="435" rx="14" ry="38" fill="url(#bmFlame)" filter="url(#bmBloom)"/>
    <ellipse cx="322" cy="430" rx="14" ry="34" fill="url(#bmFlame)" filter="url(#bmBloom)"/>

    <!-- Massive Broad Flying-Wing Silhouette -->
    <polygon points="256,110 180,160 40,240 50,370 170,390 256,410 342,390 462,370 472,240 332,160" 
             fill="url(#bmArmor)" stroke="#090d16" stroke-width="5" stroke-linejoin="round"/>

    <!-- Wingtip Armored Shield Bastions -->
    <polygon points="40,240 75,250 85,360 50,370" fill="#1e293b" stroke="#090d16" stroke-width="2"/>
    <polygon points="472,240 437,250 427,360 462,370" fill="#1e293b" stroke="#090d16" stroke-width="2"/>

    <!-- Heavy Payload Bay Doors (Left & Right) -->
    <rect x="110" y="270" width="55" height="90" rx="6" fill="#0f172a" stroke="#ea580c" stroke-width="2.5"/>
    <line x1="137" y1="270" x2="137" y2="360" stroke="#f59e0b" stroke-width="2"/>
    <rect x="347" y="270" width="55" height="90" rx="6" fill="#0f172a" stroke="#ea580c" stroke-width="2.5"/>
    <line x1="374" y1="270" x2="374" y2="360" stroke="#f59e0b" stroke-width="2"/>

    <!-- High-Threat Hazard Chevrons on Wings -->
    <polygon points="80,260 100,260 115,290 95,290" fill="url(#bmHazard)"/>
    <polygon points="100,260 120,260 135,290 115,290" fill="#0f172a"/>
    <polygon points="432,260 412,260 397,290 417,290" fill="url(#bmHazard)"/>
    <polygon points="412,260 392,260 377,290 397,290" fill="#0f172a"/>

    <!-- Central Superstructure / Fortress Cockpit Citadel -->
    <polygon points="256,70 216,140 210,380 256,410 302,380 296,140" 
             fill="url(#bmArmor)" stroke="#090d16" stroke-width="4" stroke-linejoin="round"/>

    <!-- Armored Sensor Cupola Visor -->
    <ellipse cx="256" cy="180" rx="30" ry="18" fill="url(#bmEye)" stroke="#450a0a" stroke-width="3" filter="url(#bmBloom)"/>
    <ellipse cx="252" cy="176" rx="9" ry="5" fill="#ffffff" opacity="0.9"/>

    <!-- Heavy Heat Dissipation Vents -->
    <rect x="228" y="250" width="56" height="6" rx="2" fill="#090d16" stroke="#ea580c" stroke-width="1.5"/>
    <rect x="228" y="265" width="56" height="6" rx="2" fill="#090d16" stroke="#ea580c" stroke-width="1.5"/>
    <rect x="228" y="280" width="56" height="6" rx="2" fill="#090d16" stroke="#ea580c" stroke-width="1.5"/>
    <rect x="228" y="295" width="56" height="6" rx="2" fill="#090d16" stroke="#ea580c" stroke-width="1.5"/>

    <!-- Specular Highlight Ridge -->
    <line x1="256" y1="75" x2="220" y2="145" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  </g>
</svg>