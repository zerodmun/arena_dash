<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="desShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="28" stdDeviation="20" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
    <linearGradient id="desArmor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="35%" stop-color="#334155"/>
      <stop offset="70%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="desCrimson" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#991b1b"/>
      <stop offset="50%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
    <radialGradient id="desCore" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#f97316"/>
      <stop offset="90%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </radialGradient>
    <radialGradient id="desFlame" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#fef08a"/>
      <stop offset="70%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0"/>
    </radialGradient>
    <filter id="desBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#desShadow)">
    <!-- Triple Heavy Capital Thrusters -->
    <ellipse cx="210" cy="445" rx="15" ry="38" fill="url(#desFlame)" filter="url(#desBloom)"/>
    <ellipse cx="256" cy="450" rx="18" ry="44" fill="url(#desFlame)" filter="url(#desBloom)"/>
    <ellipse cx="302" cy="445" rx="15" ry="38" fill="url(#desFlame)" filter="url(#desBloom)"/>

    <!-- Dual Heavy Forward Railgun Prongs -->
    <!-- Left Railgun Prong -->
    <rect x="184" y="30" width="18" height="150" rx="4" fill="#090d16" stroke="#dc2626" stroke-width="2"/>
    <rect x="180" y="50" width="26" height="8" rx="2" fill="#f97316"/>
    <rect x="180" y="80" width="26" height="8" rx="2" fill="#f97316"/>
    <circle cx="193" cy="25" r="5" fill="#fef08a" filter="url(#desBloom)"/>

    <!-- Right Railgun Prong -->
    <rect x="310" y="30" width="18" height="150" rx="4" fill="#090d16" stroke="#dc2626" stroke-width="2"/>
    <rect x="306" y="50" width="26" height="8" rx="2" fill="#f97316"/>
    <rect x="306" y="80" width="26" height="8" rx="2" fill="#f97316"/>
    <circle cx="319" cy="25" r="5" fill="#fef08a" filter="url(#desBloom)"/>

    <!-- Railgun Energy Arc Between Prongs -->
    <line x1="193" y1="25" x2="319" y2="25" stroke="#fef08a" stroke-width="2" filter="url(#desBloom)"/>

    <!-- Heavy Layered Armor Wings / Sponsons -->
    <polygon points="256,160 170,220 80,310 95,395 210,380 200,430" 
             fill="url(#desArmor)" stroke="#090d16" stroke-width="4" stroke-linejoin="round"/>
    <polygon points="256,160 342,220 432,310 417,395 302,380 312,430" 
             fill="url(#desArmor)" stroke="#090d16" stroke-width="4" stroke-linejoin="round"/>

    <!-- Auxiliary Point-Defense Turrets on Wings -->
    <circle cx="130" cy="330" r="14" fill="#1e293b" stroke="#dc2626" stroke-width="2"/>
    <line x1="130" y1="330" x2="110" y2="290" stroke="#090d16" stroke-width="4" stroke-linecap="round"/>
    <circle cx="382" cy="330" r="14" fill="#1e293b" stroke="#dc2626" stroke-width="2"/>
    <line x1="382" y1="330" x2="402" y2="290" stroke="#090d16" stroke-width="4" stroke-linecap="round"/>

    <!-- Main Elongated Battleship Hull Spine -->
    <polygon points="256,120 220,180 216,420 256,435 296,420 292,180" 
             fill="url(#desArmor)" stroke="#090d16" stroke-width="4" stroke-linejoin="round"/>

    <!-- Crimson Command Bridge Superstructure -->
    <polygon points="256,200 226,250 256,310 286,250" fill="url(#desCrimson)" stroke="#450a0a" stroke-width="3"/>
    
    <!-- Bridge Sensor Visor Dome -->
    <ellipse cx="256" cy="245" rx="18" ry="10" fill="url(#desCore)" filter="url(#desBloom)"/>
    <ellipse cx="254" cy="243" rx="5" ry="3" fill="#ffffff"/>

    <!-- Multi-tier Hull Armor Slabs -->
    <rect x="226" y="325" width="60" height="20" rx="4" fill="#090d16" stroke="#475569" stroke-width="2"/>
    <rect x="232" y="355" width="48" height="20" rx="4" fill="#090d16" stroke="#475569" stroke-width="2"/>

    <!-- Specular Highlight Line -->
    <line x1="256" y1="125" x2="225" y2="185" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  </g>
</svg>