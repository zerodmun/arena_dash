<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="shieldGrad" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="85%" stop-color="#0284c7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.8"/>
    </radialGradient>
    <filter id="sBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Forcefield Outer Glow Bubble -->
  <circle cx="256" cy="256" r="236" fill="url(#shieldGrad)" filter="url(#sBloom)"/>
  <circle cx="256" cy="256" r="236" fill="none" stroke="#38bdf8" stroke-width="4" filter="url(#sBloom)"/>
  <circle cx="256" cy="256" r="236" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="24 16"/>
  <!-- Hexagonal Pattern Lattice -->
  <polygon points="256,50 346,102 346,206 256,258 166,206 166,102" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.6"/>
  <polygon points="256,258 346,310 346,414 256,466 166,414 166,310" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.6"/>
</svg>