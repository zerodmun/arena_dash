<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="bossShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="32" stdDeviation="24" flood-color="#000000" flood-opacity="0.95"/>
    </filter>
    <linearGradient id="bossArmor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="25%" stop-color="#334155"/>
      <stop offset="60%" stop-color="#1e293b"/>
      <stop offset="85%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="bossCrimson" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#991b1b"/>
      <stop offset="30%" stop-color="#dc2626"/>
      <stop offset="70%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
    <radialGradient id="titanCannonCore" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="20%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="80%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </radialGradient>
    <radialGradient id="bossFlame" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#fef08a"/>
      <stop offset="65%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#dc2626" stop-opacity="0"/>
    </radialGradient>
    <filter id="bossBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#bossShadow)">
    <!-- 6 Heavy Titan Class Thrusters -->
    <ellipse cx="160" cy="445" rx="12" ry="32" fill="url(#bossFlame)" filter="url(#bossBloom)"/>
    <ellipse cx="195" cy="450" rx="14" ry="38" fill="url(#bossFlame)" filter="url(#bossBloom)"/>
    <ellipse cx="235" cy="455" rx="16" ry="44" fill="url(#bossFlame)" filter="url(#bossBloom)"/>
    <ellipse cx="277" cy="455" rx="16" ry="44" fill="url(#bossFlame)" filter="url(#bossBloom)"/>
    <ellipse cx="317" cy="450" rx="14" ry="38" fill="url(#bossFlame)" filter="url(#bossBloom)"/>
    <ellipse cx="352" cy="445" rx="12" ry="32" fill="url(#bossFlame)" filter="url(#bossBloom)"/>

    <!-- Massive Broad Heavy Dreadnought Wings / Citadel Bastions -->
    <polygon points="256,120 180,180 30,220 40,380 150,420 256,440 362,420 472,380 482,220 332,180" 
             fill="url(#bossArmor)" stroke="#020617" stroke-width="6" stroke-linejoin="round"/>

    <!-- Outer Forward Strike Claws (Left & Right) -->
    <polygon points="30,220 20,130 55,200 30,220" fill="url(#bossCrimson)" stroke="#020617" stroke-width="2"/>
    <polygon points="482,220 492,130 457,200 482,220" fill="url(#bossCrimson)" stroke="#020617" stroke-width="2"/>

    <!-- Flank Heavy Torpedo Silos (Left & Right) -->
    <g fill="#020617" stroke="#dc2626" stroke-width="2">
      <circle cx="85" cy="270" r="10"/>
      <circle cx="85" cy="300" r="10"/>
      <circle cx="85" cy="330" r="10"/>
      <circle cx="427" cy="270" r="10"/>
      <circle cx="427" cy="300" r="10"/>
      <circle cx="427" cy="330" r="10"/>
    </g>

    <!-- Armored Flank Bastion Shields -->
    <polygon points="120,240 70,360 140,380 170,260" fill="#1e293b" stroke="#020617" stroke-width="3"/>
    <polygon points="392,240 442,360 372,380 342,260" fill="#1e293b" stroke="#020617" stroke-width="3"/>

    <!-- Central Colossal Fuselage Fortress -->
    <polygon points="256,40 200,140 190,430 256,450 322,430 312,140" 
             fill="url(#bossArmor)" stroke="#020617" stroke-width="5" stroke-linejoin="round"/>

    <!-- Colossal Titan Super-Laser Cannon Bore (Central Nose Weapon) -->
    <circle cx="256" cy="110" r="38" fill="#020617" stroke="#dc2626" stroke-width="4"/>
    <circle cx="256" cy="110" r="28" fill="url(#titanCannonCore)" filter="url(#bossBloom)"/>
    <circle cx="256" cy="110" r="12" fill="#ffffff"/>
    <!-- Laser Focusing Prongs -->
    <polygon points="256,50 250,75 262,75" fill="#fef08a"/>
    <polygon points="210,110 235,104 235,116" fill="#fef08a"/>
    <polygon points="302,110 277,104 277,116" fill="#fef08a"/>

    <!-- Multi-deck Grand Command Citadel -->
    <polygon points="256,180 216,240 216,350 256,380 296,350 296,240" 
             fill="url(#bossCrimson)" stroke="#450a0a" stroke-width="4"/>

    <!-- Boss Super-Visor Bridge Eyes -->
    <ellipse cx="256" cy="230" rx="34" ry="14" fill="#020617" stroke="#fef08a" stroke-width="2"/>
    <ellipse cx="256" cy="230" rx="26" ry="8" fill="url(#titanCannonCore)" filter="url(#bossBloom)"/>
    <circle cx="256" cy="230" r="4" fill="#ffffff"/>

    <!-- Subsystem Reactor Core Cells (4 Symmetrical Power Conduits) -->
    <circle cx="230" cy="300" r="10" fill="url(#titanCannonCore)" stroke="#020617" stroke-width="2" filter="url(#bossBloom)"/>
    <circle cx="282" cy="300" r="10" fill="url(#titanCannonCore)" stroke="#020617" stroke-width="2" filter="url(#bossBloom)"/>
    <circle cx="230" cy="335" r="10" fill="url(#titanCannonCore)" stroke="#020617" stroke-width="2" filter="url(#bossBloom)"/>
    <circle cx="282" cy="335" r="10" fill="url(#titanCannonCore)" stroke="#020617" stroke-width="2" filter="url(#bossBloom)"/>

    <!-- Specular Highlight Glints -->
    <line x1="256" y1="45" x2="205" y2="140" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" opacity="0.8"/>
  </g>
</svg>