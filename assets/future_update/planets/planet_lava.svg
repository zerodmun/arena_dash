<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="lavaShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="28" stdDeviation="20" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
    <radialGradient id="lavaAtmosphere" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffedd5" stop-opacity="0"/>
      <stop offset="65%" stop-color="#ea580c" stop-opacity="0.2"/>
      <stop offset="88%" stop-color="#c2410c" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#7c2d12" stop-opacity="0.95"/>
    </radialGradient>
    <radialGradient id="basaltMantle" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#52525b"/>
      <stop offset="25%" stop-color="#3f3f46"/>
      <stop offset="55%" stop-color="#27272a"/>
      <stop offset="85%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </radialGradient>
    <radialGradient id="magmaGlow" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="20%" stop-color="#fef08a"/>
      <stop offset="45%" stop-color="#f97316"/>
      <stop offset="75%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </radialGradient>
    <filter id="magmaBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="crustPlate1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3f3f46"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
    <linearGradient id="crustPlate2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#52525b"/>
      <stop offset="100%" stop-color="#1c1917"/>
    </linearGradient>
  </defs>

  <!-- Ambient Planetary Fire Corona -->
  <circle cx="256" cy="256" r="236" fill="#f97316" opacity="0.18" filter="url(#magmaBloom)"/>
  <circle cx="256" cy="256" r="218" fill="#ef4444" opacity="0.25" filter="url(#magmaBloom)"/>

  <g filter="url(#lavaShadow)">
    <!-- Planet Base Sphere -->
    <circle cx="256" cy="256" r="190" fill="url(#basaltMantle)" stroke="#451a03" stroke-width="4"/>

    <!-- Glowing Magma Sea Under-layer -->
    <path d="M 110,220 Q 180,180 260,240 T 410,210 Q 430,300 370,360 T 170,370 Q 100,320 110,220 Z" 
          fill="url(#magmaGlow)" filter="url(#magmaBloom)"/>
    <path d="M 180,120 Q 280,110 330,160 Q 270,180 200,150 Z" 
          fill="url(#magmaGlow)" filter="url(#magmaBloom)"/>

    <!-- Tectonic Basalt Plates -->
    <path d="M 120,170 Q 190,130 260,150 L 250,210 Q 180,190 130,220 Z" fill="url(#crustPlate1)" stroke="#09090b" stroke-width="3"/>
    <path d="M 280,140 Q 360,130 420,180 L 380,230 Q 310,190 270,200 Z" fill="url(#crustPlate2)" stroke="#09090b" stroke-width="3"/>
    <path d="M 100,260 Q 180,240 220,290 L 190,360 Q 130,340 90,290 Z" fill="url(#crustPlate1)" stroke="#09090b" stroke-width="3"/>
    <path d="M 240,280 Q 320,260 380,290 L 360,370 Q 280,390 230,350 Z" fill="url(#crustPlate2)" stroke="#09090b" stroke-width="3"/>
    <path d="M 170,380 Q 260,420 330,390 L 310,430 Q 240,440 180,420 Z" fill="#18181b" stroke="#09090b" stroke-width="3"/>

    <!-- Molten Magma River Fissures (Glowing White/Amber) -->
    <path d="M 120,170 Q 190,200 250,210 T 360,250 T 440,290" fill="none" stroke="#fef08a" stroke-width="4" filter="url(#magmaBloom)"/>
    <path d="M 120,170 Q 190,200 250,210 T 360,250 T 440,290" fill="none" stroke="#ffffff" stroke-width="1.8"/>
    
    <path d="M 260,150 Q 250,230 220,290 T 260,390" fill="none" stroke="#f97316" stroke-width="5" filter="url(#magmaBloom)"/>
    <path d="M 260,150 Q 250,230 220,290 T 260,390" fill="none" stroke="#fef08a" stroke-width="2"/>

    <path d="M 190,270 Q 150,310 120,330" fill="none" stroke="#f97316" stroke-width="3.5" filter="url(#magmaBloom)"/>
    <path d="M 330,240 Q 370,280 400,320" fill="none" stroke="#f97316" stroke-width="3.5" filter="url(#magmaBloom)"/>

    <!-- Active Calderas (Volcanic Craters with Lava Lake) -->
    <ellipse cx="190" cy="190" rx="28" ry="18" fill="#18181b" stroke="#f97316" stroke-width="3"/>
    <ellipse cx="190" cy="190" rx="16" ry="10" fill="url(#magmaGlow)"/>
    <circle cx="190" cy="190" r="5" fill="#ffffff" filter="url(#magmaBloom)"/>

    <ellipse cx="320" cy="320" rx="34" ry="22" fill="#18181b" stroke="#f97316" stroke-width="3.5"/>
    <ellipse cx="320" cy="320" rx="20" ry="12" fill="url(#magmaGlow)"/>
    <circle cx="320" cy="320" r="6" fill="#ffffff" filter="url(#magmaBloom)"/>

    <ellipse cx="330" cy="180" rx="20" ry="13" fill="#18181b" stroke="#ea580c" stroke-width="2.5"/>
    <ellipse cx="330" cy="180" rx="11" ry="7" fill="url(#magmaGlow)"/>

    <!-- Atmospheric Shading & Shadow Rim -->
    <circle cx="256" cy="256" r="190" fill="url(#lavaAtmosphere)"/>

    <!-- Planet Limb Specular Crescent -->
    <path d="M 125,125 A 190,190 0 0,1 385,125 A 184,184 0 0,0 125,125 Z" fill="#fed7aa" opacity="0.65"/>
  </g>
</svg>