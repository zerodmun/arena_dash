<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="lavaFloor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f0705"/>
      <stop offset="50%" stop-color="#1c0b07"/>
      <stop offset="100%" stop-color="#090302"/>
    </linearGradient>
    <radialGradient id="calderaGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#dc2626" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#7f1d1d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="magmaRiver" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7f1d1d"/>
      <stop offset="25%" stop-color="#ea580c"/>
      <stop offset="50%" stop-color="#fef08a"/>
      <stop offset="75%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
    <filter id="lBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Deep Obsidian Basalt Bedrock -->
  <rect width="1280" height="720" fill="url(#lavaFloor)"/>

  <!-- Subtle Sci-Fi Arena Tactile Grid (High Readability) -->
  <g stroke="#ea580c" stroke-width="1" opacity="0.12">
    <line x1="160" y1="0" x2="160" y2="720"/><line x1="320" y1="0" x2="320" y2="720"/>
    <line x1="480" y1="0" x2="480" y2="720"/><line x1="640" y1="0" x2="640" y2="720"/>
    <line x1="800" y1="0" x2="800" y2="720"/><line x1="960" y1="0" x2="960" y2="720"/>
    <line x1="1120" y1="0" x2="1120" y2="720"/>
    <line x1="0" y1="120" x2="1280" y2="120"/><line x1="0" y1="240" x2="1280" y2="240"/>
    <line x1="0" y1="360" x2="1280" y2="360"/><line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="0" y1="600" x2="1280" y2="600"/>
  </g>

  <!-- Ambient Caldera Core Glow -->
  <circle cx="640" cy="360" r="420" fill="url(#calderaGlow)"/>

  <!-- Molten Magma River Channels (Crossing below arena plates) -->
  <path d="M -50,180 Q 240,260 520,190 T 1050,280 Q 1180,310 1330,220" 
        fill="none" stroke="url(#magmaRiver)" stroke-width="26" filter="url(#lBloom)" opacity="0.75"/>
  <path d="M -50,180 Q 240,260 520,190 T 1050,280 Q 1180,310 1330,220" 
        fill="none" stroke="#ffffff" stroke-width="4" opacity="0.8"/>

  <path d="M 280,750 Q 420,520 640,540 T 1080,680" 
        fill="none" stroke="url(#magmaRiver)" stroke-width="20" filter="url(#lBloom)" opacity="0.7"/>
  <path d="M 280,750 Q 420,520 640,540 T 1080,680" 
        fill="none" stroke="#ffffff" stroke-width="3" opacity="0.75"/>

  <!-- Basalt Tectonic Crust Plates (Hexagonal Arena Slabs) -->
  <g fill="#18181b" stroke="#27272a" stroke-width="2.5" opacity="0.9">
    <polygon points="120,80 180,80 210,132 180,184 120,184 90,132"/>
    <polygon points="1060,80 1120,80 1150,132 1120,184 1060,184 1030,132"/>
    <polygon points="80,520 140,520 170,572 140,624 80,624 50,572"/>
    <polygon points="1120,500 1180,500 1210,552 1180,604 1120,604 1090,552"/>
  </g>

  <!-- Distant Volcanic Smoke & Vignette -->
  <rect width="1280" height="720" fill="none" stroke="#451a03" stroke-width="20" opacity="0.6"/>
</svg>