<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="geyserCore" cx="50%" cy="60%" r="55%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#f97316"/>
      <stop offset="85%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </radialGradient>
    <filter id="hBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Magma Geyser Vent / Basalt Obelisk Hazard -->
  <polygon points="256,40 180,440 332,440" fill="#18181b" stroke="#7f1d1d" stroke-width="6"/>
  <!-- Magma Internal Fissures -->
  <polygon points="256,80 210,420 302,420" fill="url(#geyserCore)" filter="url(#hBloom)"/>
  <circle cx="256" cy="180" r="28" fill="#ffffff" filter="url(#hBloom)"/>
  <!-- Magma Plume Venting out of Apex -->
  <ellipse cx="256" cy="40" rx="35" ry="18" fill="#fef08a" filter="url(#hBloom)"/>
</svg>