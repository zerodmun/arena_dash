<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="stormFloor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f0728"/>
      <stop offset="50%" stop-color="#1e103a"/>
      <stop offset="100%" stop-color="#0b041e"/>
    </linearGradient>
    <radialGradient id="stormCoreGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.32"/>
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#1e103a" stop-opacity="0"/>
    </radialGradient>
    <filter id="sBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="url(#stormFloor)"/>
  <!-- Arena Grid -->
  <g stroke="#38bdf8" stroke-width="1" opacity="0.16">
    <line x1="160" y1="0" x2="160" y2="720"/><line x1="320" y1="0" x2="320" y2="720"/>
    <line x1="480" y1="0" x2="480" y2="720"/><line x1="640" y1="0" x2="640" y2="720"/>
    <line x1="800" y1="0" x2="800" y2="720"/><line x1="960" y1="0" x2="960" y2="720"/>
    <line x1="1120" y1="0" x2="1120" y2="720"/>
    <line x1="0" y1="120" x2="1280" y2="120"/><line x1="0" y1="240" x2="1280" y2="240"/>
    <line x1="0" y1="360" x2="1280" y2="360"/><line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="0" y1="600" x2="1280" y2="600"/>
  </g>
  <circle cx="640" cy="360" r="420" fill="url(#stormCoreGlow)"/>
  <!-- Lightning Discharges -->
  <path d="M 120,40 L 260,180 L 220,240 L 380,390" fill="none" stroke="#38bdf8" stroke-width="4" filter="url(#sBloom)"/>
  <path d="M 1160,50 L 980,210 L 1040,290 L 880,440" fill="none" stroke="#c084fc" stroke-width="4" filter="url(#sBloom)"/>
</svg>