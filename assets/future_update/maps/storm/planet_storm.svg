<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="stormShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="28" stdDeviation="20" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
    <radialGradient id="stormMantle" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="25%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#6d28d9"/>
      <stop offset="75%" stop-color="#4c1d95"/>
      <stop offset="90%" stop-color="#2e1065"/>
      <stop offset="100%" stop-color="#0f0728"/>
    </radialGradient>
    <radialGradient id="stormAtmosphere" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="65%" stop-color="#a855f7" stop-opacity="0.2"/>
      <stop offset="88%" stop-color="#6d28d9" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#1e103a" stop-opacity="0.95"/>
    </radialGradient>
    <filter id="lightningGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Ionized Plasma Atmosphere Halo -->
  <circle cx="256" cy="256" r="236" fill="#38bdf8" opacity="0.22" filter="url(#lightningGlow)"/>
  <circle cx="256" cy="256" r="216" fill="#c084fc" opacity="0.25" filter="url(#lightningGlow)"/>

  <g filter="url(#stormShadow)">
    <!-- Base Storm Sphere -->
    <circle cx="256" cy="256" r="190" fill="url(#stormMantle)" stroke="#4c1d95" stroke-width="4"/>

    <!-- Violent Swirling Cyclonic Cloud Bands (Spiral Vortex) -->
    <path d="M 100,180 Q 200,130 300,170 T 430,210 Q 380,260 260,230 T 90,210 Z" fill="#7c3aed" opacity="0.75"/>
    <path d="M 80,240 Q 180,200 320,240 T 440,290 Q 360,340 230,300 T 70,270 Z" fill="#6d28d9" opacity="0.8"/>
    <path d="M 110,310 Q 220,280 340,320 T 420,380 Q 330,420 200,370 T 100,340 Z" fill="#5b21b6" opacity="0.85"/>

    <!-- Central Supercell Cyclone Eye (Great Tempest Storm) -->
    <ellipse cx="260" cy="250" rx="55" ry="32" fill="#2e1065" stroke="#38bdf8" stroke-width="3" transform="rotate(-15 260 250)"/>
    <ellipse cx="260" cy="250" rx="35" ry="18" fill="#0f0728" stroke="#a855f7" stroke-width="2.5" transform="rotate(-15 260 250)"/>
    <circle cx="260" cy="250" r="10" fill="#38bdf8" filter="url(#lightningGlow)"/>
    <circle cx="260" cy="250" r="5" fill="#ffffff"/>

    <!-- Branching Electrical Lightning Arcs (Fractal Discharges) -->
    <!-- Arc 1 (North-East) -->
    <path d="M 260,250 L 290,210 L 280,180 L 320,150 L 360,110" fill="none" stroke="#38bdf8" stroke-width="3.5" filter="url(#lightningGlow)"/>
    <path d="M 260,250 L 290,210 L 280,180 L 320,150 L 360,110" fill="none" stroke="#ffffff" stroke-width="1.6"/>
    <path d="M 290,210 L 330,220 L 350,190" fill="none" stroke="#67e8f9" stroke-width="2" filter="url(#lightningGlow)"/>

    <!-- Arc 2 (West-South) -->
    <path d="M 260,250 L 210,270 L 190,310 L 150,330 L 120,370" fill="none" stroke="#38bdf8" stroke-width="3.5" filter="url(#lightningGlow)"/>
    <path d="M 260,250 L 210,270 L 190,310 L 150,330 L 120,370" fill="none" stroke="#ffffff" stroke-width="1.6"/>
    <path d="M 210,270 L 170,260 L 140,290" fill="none" stroke="#67e8f9" stroke-width="2" filter="url(#lightningGlow)"/>

    <!-- Arc 3 (East-South) -->
    <path d="M 260,250 L 310,280 L 340,270 L 380,320 L 410,340" fill="none" stroke="#a855f7" stroke-width="3" filter="url(#lightningGlow)"/>
    <path d="M 260,250 L 310,280 L 340,270 L 380,320 L 410,340" fill="none" stroke="#ffffff" stroke-width="1.4"/>

    <!-- Arc 4 (North-West) -->
    <path d="M 260,250 L 220,220 L 200,170 L 160,150" fill="none" stroke="#38bdf8" stroke-width="3" filter="url(#lightningGlow)"/>
    <path d="M 260,250 L 220,220 L 200,170 L 160,150" fill="none" stroke="#ffffff" stroke-width="1.4"/>

    <!-- Swirling Jet Streams -->
    <path d="M 120,160 Q 220,120 320,150 T 420,130" fill="none" stroke="#c084fc" stroke-width="2.5" opacity="0.7"/>
    <path d="M 90,360 Q 200,330 310,370 T 400,350" fill="none" stroke="#c084fc" stroke-width="2.5" opacity="0.7"/>

    <!-- Atmospheric Shading Veil -->
    <circle cx="256" cy="256" r="190" fill="url(#stormAtmosphere)"/>

    <!-- Specular Highlight Sheen -->
    <path d="M 120,120 A 190,190 0 0,1 392,120 A 184,184 0 0,0 120,120 Z" fill="#e9d5ff" opacity="0.8"/>
  </g>
</svg>