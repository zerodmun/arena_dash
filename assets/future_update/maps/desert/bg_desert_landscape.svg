      <stop offset="0%" stop-color="#2a1408"/>
      <stop offset="50%" stop-color="#451a03"/>
      <stop offset="100%" stop-color="#1e0c04"/>
    </linearGradient>
    <radialGradient id="sunDuneGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#b45309" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#451a03" stop-opacity="0"/>
