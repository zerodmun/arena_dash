  <path d="M -50,200 Q 320,280 640,210 T 1330,240" fill="none" stroke="#fde68a" stroke-width="12" opacity="0.3"/>
  <path d="M -50,520 Q 380,460 760,540 T 1330,490" fill="none" stroke="#fde68a" stroke-width="14" opacity="0.25"/>
