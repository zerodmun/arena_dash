<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="voidShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="28" stdDeviation="20" flood-color="#000000" flood-opacity="0.95"/>
    </filter>
    <radialGradient id="voidMantle" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#3b0764"/>
      <stop offset="25%" stop-color="#2e1065"/>
      <stop offset="50%" stop-color="#1e103a"/>
      <stop offset="75%" stop-color="#0f0728"/>
      <stop offset="90%" stop-color="#05020e"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <radialGradient id="voidAtmosphere" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="65%" stop-color="#c084fc" stop-opacity="0.15"/>
      <stop offset="85%" stop-color="#7e22ce" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0.95"/>
    </radialGradient>
    <filter id="voidGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="accretionDisk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.1"/>
      <stop offset="30%" stop-color="#c084fc" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <!-- Gravitational Accretion Disk Ring (Tilted Orbital Belt) -->
  <g transform="rotate(-25 256 256)">
    <ellipse cx="256" cy="256" rx="245" ry="55" fill="none" stroke="url(#accretionDisk)" stroke-width="16" filter="url(#voidGlow)" opacity="0.85"/>
    <ellipse cx="256" cy="256" rx="245" ry="55" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="16 12" opacity="0.6"/>
  </g>

  <!-- Deep Cosmic Void Corona -->
  <circle cx="256" cy="256" r="236" fill="#c084fc" opacity="0.18" filter="url(#voidGlow)"/>
  <circle cx="256" cy="256" r="216" fill="#f43f5e" opacity="0.15" filter="url(#voidGlow)"/>

  <g filter="url(#voidShadow)">
    <!-- Base Obsidian Black Hole Sphere -->
    <circle cx="256" cy="256" r="190" fill="url(#voidMantle)" stroke="#581c87" stroke-width="4"/>

    <!-- Pulsing Singularity Rifts (Dimensional Fractures) -->
    <path d="M 120,180 Q 200,150 260,200 T 400,180" fill="none" stroke="#c084fc" stroke-width="4" filter="url(#voidGlow)"/>
    <path d="M 120,180 Q 200,150 260,200 T 400,180" fill="none" stroke="#ffffff" stroke-width="1.8"/>

    <path d="M 100,260 Q 210,220 280,280 T 420,250" fill="none" stroke="#f43f5e" stroke-width="4" filter="url(#voidGlow)"/>
    <path d="M 100,260 Q 210,220 280,280 T 420,250" fill="none" stroke="#fbcfe8" stroke-width="1.8"/>

    <path d="M 140,330 Q 230,300 320,340 T 410,320" fill="none" stroke="#38bdf8" stroke-width="3.5" filter="url(#voidGlow)"/>
    <path d="M 140,330 Q 230,300 320,340 T 410,320" fill="none" stroke="#ffffff" stroke-width="1.5"/>

    <!-- Central Event Horizon Singularity Eye -->
    <circle cx="256" cy="256" r="42" fill="#000000" stroke="#f43f5e" stroke-width="3" filter="url(#voidGlow)"/>
    <circle cx="256" cy="256" r="32" fill="#000000" stroke="#c084fc" stroke-width="2"/>
    <circle cx="256" cy="256" r="12" fill="#ffffff" filter="url(#voidGlow)"/>

    <!-- Gravitational Distortion Tendril Paths -->
    <path d="M 256,214 Q 210,170 170,160" fill="none" stroke="#c084fc" stroke-width="2.5" opacity="0.8"/>
    <path d="M 298,256 Q 350,220 370,180" fill="none" stroke="#f43f5e" stroke-width="2.5" opacity="0.8"/>
    <path d="M 256,298 Q 280,350 310,370" fill="none" stroke="#38bdf8" stroke-width="2.5" opacity="0.8"/>
    <path d="M 214,256 Q 160,280 130,310" fill="none" stroke="#c084fc" stroke-width="2.5" opacity="0.8"/>

    <!-- Accretion Disk Foreground Arc Crossing -->
    <g transform="rotate(-25 256 256)">
      <path d="M 50,256 A 245,55 0 0,0 462,256" fill="none" stroke="url(#accretionDisk)" stroke-width="18" filter="url(#voidGlow)" opacity="0.95"/>
      <path d="M 50,256 A 245,55 0 0,0 462,256" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-dasharray="16 12"/>
    </g>

    <!-- Atmospheric Shading Veil -->
    <circle cx="256" cy="256" r="190" fill="url(#voidAtmosphere)"/>

    <!-- Rim Specular Crescent -->
    <path d="M 120,120 A 190,190 0 0,1 392,120 A 184,184 0 0,0 120,120 Z" fill="#e879f9" opacity="0.6"/>
  </g>
</svg>