<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <radialGradient id="voidCoreGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="40%" stop-color="#1e1b4b"/>
      <stop offset="75%" stop-color="#581c87" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#020008"/>
    </radialGradient>
    <filter id="vBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="#020008"/>
  <circle cx="640" cy="360" r="460" fill="url(#voidCoreGlow)"/>
  <!-- Arena Grid -->
  <g stroke="#c084fc" stroke-width="1" opacity="0.12">
    <line x1="160" y1="0" x2="160" y2="720"/><line x1="320" y1="0" x2="320" y2="720"/>
    <line x1="480" y1="0" x2="480" y2="720"/><line x1="640" y1="0" x2="640" y2="720"/>
    <line x1="800" y1="0" x2="800" y2="720"/><line x1="960" y1="0" x2="960" y2="720"/>
    <line x1="1120" y1="0" x2="1120" y2="720"/>
    <line x1="0" y1="120" x2="1280" y2="120"/><line x1="0" y1="240" x2="1280" y2="240"/>
    <line x1="0" y1="360" x2="1280" y2="360"/><line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="0" y1="600" x2="1280" y2="600"/>
  </g>
  <!-- Void Rift Fractures -->
  <path d="M 180,180 Q 420,380 640,360 T 1120,480" fill="none" stroke="#f43f5e" stroke-width="3" filter="url(#vBloom)"/>
  <path d="M 260,520 Q 580,320 860,390" fill="none" stroke="#38bdf8" stroke-width="3" filter="url(#vBloom)"/>
</svg>