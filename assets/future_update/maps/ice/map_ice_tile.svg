  </defs>
  <rect width="512" height="512" rx="36" fill="url(#tileIce)" stroke="#38bdf8" stroke-width="6"/>
  <circle cx="256" cy="256" r="180" fill="url(#iceCore)"/>
  <!-- Glacial Spires Silhouette -->
  <polygon points="256,110 200,380 312,380" fill="#e0f2fe" stroke="#0284c7" stroke-width="4"/>
