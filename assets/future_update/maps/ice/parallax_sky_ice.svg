<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="skyIceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="40%" stop-color="#082f49"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </linearGradient>
    <linearGradient id="auroraRibbon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.1"/>
      <stop offset="30%" stop-color="#34d399" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#818cf8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="aBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="url(#skyIceGrad)"/>
  <!-- Aurora Borealis Curtains -->
  <path d="M -50,140 Q 320,60 640,160 T 1330,90 L 1330,220 Q 980,140 640,240 T -50,190 Z" 
        fill="url(#auroraRibbon)" filter="url(#aBloom)"/>
  <!-- Polar Stars -->
  <g fill="#ffffff" opacity="0.8">
    <circle cx="120" cy="60" r="2"/><circle cx="410" cy="80" r="1.5"/><circle cx="780" cy="50" r="2.2"/>
    <circle cx="980" cy="95" r="1.8"/><circle cx="1160" cy="65" r="2"/>
  </g>
</svg>