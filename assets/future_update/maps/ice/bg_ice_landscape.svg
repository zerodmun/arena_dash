<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="iceFloor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#082f49"/>
      <stop offset="100%" stop-color="#031926"/>
    </linearGradient>
    <radialGradient id="frostCoreGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#082f49" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="crevasseLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <filter id="iBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#iceFloor)"/>

  <!-- High-Readability Sci-Fi Ice Grid Lines -->
  <g stroke="#38bdf8" stroke-width="1" opacity="0.14">
    <line x1="160" y1="0" x2="160" y2="720"/><line x1="320" y1="0" x2="320" y2="720"/>
    <line x1="480" y1="0" x2="480" y2="720"/><line x1="640" y1="0" x2="640" y2="720"/>
    <line x1="800" y1="0" x2="800" y2="720"/><line x1="960" y1="0" x2="960" y2="720"/>
    <line x1="1120" y1="0" x2="1120" y2="720"/>
    <line x1="0" y1="120" x2="1280" y2="120"/><line x1="0" y1="240" x2="1280" y2="240"/>
    <line x1="0" y1="360" x2="1280" y2="360"/><line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="0" y1="600" x2="1280" y2="600"/>
  </g>

  <!-- Ambient Blue Core Lighting -->
  <circle cx="640" cy="360" r="420" fill="url(#frostCoreGlow)"/>

  <!-- Glowing Glacial Crevasses Subsurface -->
  <path d="M -50,220 Q 280,180 560,260 T 1100,200 Q 1200,240 1330,190" 
        fill="none" stroke="url(#crevasseLight)" stroke-width="22" filter="url(#iBloom)" opacity="0.7"/>
  <path d="M -50,220 Q 280,180 560,260 T 1100,200 Q 1200,240 1330,190" 
        fill="none" stroke="#ffffff" stroke-width="3" opacity="0.85"/>

  <path d="M 220,740 Q 480,560 720,580 T 1140,710" 
        fill="none" stroke="url(#crevasseLight)" stroke-width="18" filter="url(#iBloom)" opacity="0.65"/>

  <!-- Glacial Plate Hexagons -->
  <g fill="#0c4a6e" stroke="#38bdf8" stroke-width="2" opacity="0.6">
    <polygon points="140,100 200,100 230,152 200,204 140,204 110,152"/>
    <polygon points="1040,100 1100,100 1130,152 1100,204 1040,204 1010,152"/>
    <polygon points="100,500 160,500 190,552 160,604 100,604 70,552"/>
    <polygon points="1100,480 1160,480 1190,532 1160,584 1100,584 1070,532"/>
  </g>
</svg>