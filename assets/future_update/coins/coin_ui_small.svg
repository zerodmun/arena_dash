<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Punchy Rim Gradient for Small UI -->
    <linearGradient id="uiRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <!-- Vibrant Center Core -->
    <radialGradient id="uiCore" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="35%" stop-color="#facc15"/>
      <stop offset="80%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </radialGradient>
  </defs>

  <!-- Clear Mobile Drop Shadow -->
  <circle cx="32" cy="35" r="26" fill="#000000" opacity="0.6"/>

  <!-- High-Contrast Outer Border (Chiseled Dark Gold) -->
  <circle cx="32" cy="32" r="27" fill="#451a03"/>
  <circle cx="32" cy="32" r="25.5" fill="url(#uiRim)"/>

  <!-- Recessed Inner Bezel -->
  <circle cx="32" cy="32" r="20" fill="#78350f"/>
  <circle cx="32" cy="32" r="18.5" fill="url(#uiCore)"/>

  <!-- High-Readability Center Emblem (Sharpened 4-Point Star) -->
  <polygon points="32,17 35.5,27 47,32 35.5,37 32,47 28.5,37 17,32 28.5,27" fill="#78350f" transform="translate(0.5, 1)"/>
  <polygon points="32,17 35.5,27 47,32 35.5,37 32,47 28.5,37 17,32 28.5,27" fill="#ffffff"/>
  <polygon points="32,20 34.5,28 44,32 34.5,36 32,44 29.5,36 20,32 29.5,28" fill="#fef08a"/>
  <circle cx="32" cy="32" r="3.5" fill="#ffffff"/>

  <!-- Specular Crescent -->
  <path d="M 15,30 A 18.5,18.5 0 0,1 49,30 A 17,12 0 0,0 15,30 Z" fill="#ffffff" opacity="0.45"/>
  <circle cx="21" cy="20" r="1.8" fill="#ffffff"/>
</svg>