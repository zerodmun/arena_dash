<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Drop Shadow for Float Elevation -->
    <filter id="coinShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="10" flood-color="#000000" flood-opacity="0.75"/>
    </filter>

    <!-- Outer Beveled Chiseled Rim -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="15%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#facc15"/>
      <stop offset="70%" stop-color="#ca8a04"/>
      <stop offset="90%" stop-color="#854d0e"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>

    <!-- Inner Metallic Core Bowl -->
    <radialGradient id="faceGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="25%" stop-color="#fde047"/>
      <stop offset="55%" stop-color="#eab308"/>
      <stop offset="85%" stop-color="#a16207"/>
      <stop offset="100%" stop-color="#713f12"/>
    </radialGradient>

    <!-- Sci-Fi Energy Circuit Core -->
    <radialGradient id="cyberCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#fef08a"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>

    <!-- Bloom filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Gold Core Aura -->
  <circle cx="128" cy="128" r="115" fill="#facc15" opacity="0.2" filter="url(#goldGlow)"/>

  <g filter="url(#coinShadow)">
    <!-- Outer Heavy Beveled Hexagonal/Circular Base -->
    <circle cx="128" cy="128" r="105" fill="url(#rimGrad)" stroke="#78350f" stroke-width="4"/>

    <!-- Concentric Tech Grooves / Flange Notches -->
    <circle cx="128" cy="128" r="92" fill="none" stroke="#ca8a04" stroke-width="2.5" stroke-dasharray="14 8"/>
    <circle cx="128" cy="128" r="86" fill="url(#rimGrad)" stroke="#78350f" stroke-width="2"/>

    <!-- Inner Recessed Face -->
    <circle cx="128" cy="128" r="76" fill="url(#faceGrad)" stroke="#a16207" stroke-width="2"/>

    <!-- 6 Radial Tech Inlay Notches -->
    <circle cx="128" cy="42" r="3.5" fill="#fef08a" stroke="#78350f" stroke-width="1.5"/>
    <circle cx="128" cy="214" r="3.5" fill="#fef08a" stroke="#78350f" stroke-width="1.5"/>
    <circle cx="42" cy="128" r="3.5" fill="#fef08a" stroke="#78350f" stroke-width="1.5"/>
    <circle cx="214" cy="128" r="3.5" fill="#fef08a" stroke="#78350f" stroke-width="1.5"/>

    <!-- Central Sci-Fi Emblem: Geometric Hyper-Diamond / Delta Star -->
    <!-- Base Shadow Offset -->
    <polygon points="128,68 145,108 188,128 145,148 128,188 111,148 68,128 111,108" 
             fill="#713f12" opacity="0.6" transform="translate(1, 3)"/>
    
    <!-- Main Star Facet 1 (Top Left) -->
    <polygon points="128,68 128,128 111,108" fill="#ffffff"/>
    <!-- Main Star Facet 2 (Top Right) -->
    <polygon points="128,68 145,108 128,128" fill="#fef08a"/>
    <!-- Main Star Facet 3 (Right Top) -->
    <polygon points="188,128 128,128 145,108" fill="#facc15"/>
    <!-- Main Star Facet 4 (Right Bottom) -->
    <polygon points="188,128 145,148 128,128" fill="#ca8a04"/>
    <!-- Main Star Facet 5 (Bottom Right) -->
    <polygon points="128,188 128,128 145,148" fill="#a16207"/>
    <!-- Main Star Facet 6 (Bottom Left) -->
    <polygon points="128,188 111,148 128,128" fill="#854d0e"/>
    <!-- Main Star Facet 7 (Left Bottom) -->
    <polygon points="68,128 128,128 111,148" fill="#ca8a04"/>
    <!-- Main Star Facet 8 (Left Top) -->
    <polygon points="68,128 111,108 128,128" fill="#fde047"/>

    <!-- Central Micro Hex Core -->
    <polygon points="128,116 138,122 138,134 128,140 118,134 118,122" 
             fill="#ffffff" stroke="#eab308" stroke-width="1.5" filter="url(#goldGlow)"/>

    <!-- Upper Specular Glass Sheen Crescent -->
    <path d="M 52,120 A 76,76 0 0,1 204,120 A 72,50 0 0,0 52,120 Z" fill="#ffffff" opacity="0.42"/>

    <!-- Edge High-Gloss Specular Glints -->
    <polygon points="76,64 80,72 88,74 80,76 76,84 72,76 64,74 72,72" fill="#ffffff" filter="url(#goldGlow)"/>
    <circle cx="184" cy="74" r="3" fill="#ffffff"/>
  </g>
</svg>