<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Heavy Elevation Drop Shadow -->
    <filter id="bigShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="32" stdDeviation="22" flood-color="#000000" flood-opacity="0.85"/>
    </filter>

    <!-- Multi-Stop Ultra-Detailed Rim Gradient -->
    <linearGradient id="bigRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="12%" stop-color="#fef08a"/>
      <stop offset="30%" stop-color="#fde047"/>
      <stop offset="55%" stop-color="#eab308"/>
      <stop offset="78%" stop-color="#ca8a04"/>
      <stop offset="90%" stop-color="#854d0e"/>
      <stop offset="100%" stop-color="#3b1502"/>
    </linearGradient>

    <!-- Metallic Face Bowl -->
    <radialGradient id="bigFace" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="20%" stop-color="#fef9c3"/>
      <stop offset="45%" stop-color="#fde047"/>
      <stop offset="70%" stop-color="#eab308"/>
      <stop offset="90%" stop-color="#a16207"/>
      <stop offset="100%" stop-color="#5a2707"/>
    </radialGradient>

    <!-- Glowing Cyber Core Plasma -->
    <radialGradient id="bigCoreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#fef08a"/>
      <stop offset="65%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>

    <filter id="bigBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Golden Radiance -->
  <circle cx="256" cy="256" r="236" fill="#facc15" opacity="0.18" filter="url(#bigBloom)"/>

  <g filter="url(#bigShadow)">
    <!-- Outer Heavy Armor Rim -->
    <circle cx="256" cy="256" r="215" fill="url(#bigRim)" stroke="#451a03" stroke-width="8"/>

    <!-- Faceted Cog/Notch Bevel Ring (12 Sci-Fi Precision Tabs) -->
    <circle cx="256" cy="256" r="192" fill="none" stroke="#ca8a04" stroke-width="5" stroke-dasharray="24 16"/>
    <circle cx="256" cy="256" r="182" fill="url(#bigRim)" stroke="#78350f" stroke-width="3"/>

    <!-- Concentric Micro-Circuits Inlay Ring -->
    <circle cx="256" cy="256" r="168" fill="none" stroke="#eab308" stroke-width="2.5"/>
    <circle cx="256" cy="256" r="162" fill="none" stroke="#78350f" stroke-width="1.5"/>

    <!-- Recessed Inner Coin Deck -->
    <circle cx="256" cy="256" r="154" fill="url(#bigFace)" stroke="#713f12" stroke-width="4"/>

    <!-- 12 Cardinal Micro-Rivets -->
    <g stroke="#78350f" stroke-width="2" fill="#fef08a">
      <circle cx="256" cy="116" r="6"/>
      <circle cx="256" cy="396" r="6"/>
      <circle cx="116" cy="256" r="6"/>
      <circle cx="396" cy="256" r="6"/>
      <circle cx="157" cy="157" r="5"/>
      <circle cx="355" cy="157" r="5"/>
      <circle cx="157" cy="355" r="5"/>
      <circle cx="355" cy="355" r="5"/>
    </g>

    <!-- Luminous Energy Circuit Traces -->
    <path d="M 180,256 L 210,256 L 225,241 L 245,241 L 256,252 L 267,241 L 287,241 L 302,256 L 332,256" 
          fill="none" stroke="#fef08a" stroke-width="3" filter="url(#bigBloom)"/>
    <path d="M 256,180 L 256,210 L 241,225 L 241,245 L 252,256 L 241,267 L 241,287 L 256,302 L 256,332" 
          fill="none" stroke="#fef08a" stroke-width="3" filter="url(#bigBloom)"/>

    <!-- Grand Sci-Fi Emblem (Multifaceted 8-Point Hyper-Star) -->
    <!-- Base Shadow Drop -->
    <polygon points="256,130 286,216 382,256 286,296 256,382 226,296 130,256 226,216" 
             fill="#451a03" opacity="0.6" transform="translate(2, 6)"/>

    <!-- Facet Group 1: Cardinal Rays -->
    <polygon points="256,130 256,256 226,216" fill="#ffffff"/>
    <polygon points="256,130 286,216 256,256" fill="#fef08a"/>
    <polygon points="382,256 256,256 286,216" fill="#fde047"/>
    <polygon points="382,256 286,296 256,256" fill="#eab308"/>
    <polygon points="256,382 256,256 286,296" fill="#ca8a04"/>
    <polygon points="256,382 226,296 256,256" fill="#a16207"/>
    <polygon points="130,256 256,256 226,296" fill="#ca8a04"/>
    <polygon points="130,256 226,216 256,256" fill="#fde047"/>

    <!-- Facet Group 2: Inter-cardinal Diamond Wings -->
    <polygon points="256,256 226,216 206,206 216,226" fill="#fef9c3" opacity="0.9"/>
    <polygon points="256,256 286,216 306,206 296,226" fill="#facc15" opacity="0.9"/>
    <polygon points="256,256 286,296 306,306 296,286" fill="#a16207" opacity="0.9"/>
    <polygon points="256,256 226,296 206,306 216,286" fill="#854d0e" opacity="0.9"/>

    <!-- Core Hyper-Hexagon -->
    <polygon points="256,226 282,241 282,271 256,286 230,271 230,241" 
             fill="#ffffff" stroke="#f59e0b" stroke-width="3" filter="url(#bigBloom)"/>
    <circle cx="256" cy="256" r="14" fill="url(#bigCoreGlow)"/>
    <circle cx="256" cy="256" r="7" fill="#ffffff"/>

    <!-- High-Sheen Glass Specular Crescent -->
    <path d="M 104,240 A 154,154 0 0,1 408,240 A 148,100 0 0,0 104,240 Z" fill="#ffffff" opacity="0.45"/>

    <!-- Prismatic Sparkle Glints -->
    <polygon points="160,140 166,155 182,158 168,168 172,184 160,174 148,184 152,168 138,158 154,155" 
             fill="#ffffff" filter="url(#bigBloom)"/>
    <polygon points="340,160 344,170 355,172 346,179 349,190 340,183 331,190 334,179 325,172 336,170" 
             fill="#ffffff" opacity="0.9"/>
    <circle cx="360" cy="340" r="5" fill="#ffffff" opacity="0.8"/>
  </g>
</svg>