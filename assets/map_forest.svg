<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="forestPlanet" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="35%" stop-color="#15803d"/>
      <stop offset="65%" stop-color="#14532d"/>
      <stop offset="90%" stop-color="#052e16"/>
      <stop offset="100%" stop-color="#02150b"/>
    </radialGradient>
    <linearGradient id="atmoGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86efac" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#10b981" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#064e3b" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fossilBone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="45%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <filter id="fossilShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#000000" flood-opacity="0.95"/>
    </filter>
  </defs>

  <!-- Deep Space Backdrop with Green Nebula Tints -->
  <rect width="512" height="512" rx="28" fill="#020d06"/>
  <circle cx="380" cy="120" r="160" fill="#047857" opacity="0.15" filter="blur(30px)"/>

  <!-- Realistic Primordial Exoplanet Globe -->
  <circle cx="256" cy="256" r="195" fill="url(#forestPlanet)"/>

  <!-- Continental Landmasses & Volcanic Green Belts -->
  <path d="M120 180 Q160 140 220 150 Q280 160 300 210 Q320 270 270 310 Q210 350 160 320 Q100 280 120 180 Z" 
        fill="#166534" opacity="0.75"/>
  <path d="M260 220 Q330 180 390 220 Q440 270 410 340 Q370 390 310 380 Q270 360 250 300 Z" 
        fill="#15803d" opacity="0.85"/>
  <path d="M180 340 Q220 320 280 350 Q300 410 250 430 Q190 440 160 390 Z" 
        fill="#14532d" opacity="0.9"/>

  <!-- Atmospheric Cloud Swirls -->
  <path d="M100 230 Q180 200 260 220 Q340 240 420 210" stroke="#f0fdf4" stroke-width="12" fill="none" opacity="0.35" stroke-linecap="round"/>
  <path d="M140 290 Q220 270 300 300 Q380 320 430 280" stroke="#ffffff" stroke-width="8" fill="none" opacity="0.3" stroke-linecap="round"/>
  <path d="M180 160 Q260 140 340 170" stroke="#f0fdf4" stroke-width="10" fill="none" opacity="0.3" stroke-linecap="round"/>

  <!-- Atmosphere Rim Illumination -->
  <circle cx="256" cy="256" r="195" fill="none" stroke="url(#atmoGlow)" stroke-width="8"/>
  <circle cx="256" cy="256" r="198" fill="none" stroke="#4ade80" stroke-width="2" opacity="0.7"/>

  <!-- Realistic Ancient Predatory Dinosaur Skull Relic in Foreground -->
  <g transform="translate(256, 275) scale(0.68)" filter="url(#fossilShadow)">
    <!-- Skull Base -->
    <path d="M-150,40 C-180,-30 -140,-130 -30,-150 C90,-170 160,-100 180,-20 C190,30 160,70 120,80 C70,90 30,50 -10,50 C-50,50 -80,80 -130,80 Z" 
          fill="url(#fossilBone)" stroke="#2b1302" stroke-width="12" stroke-linejoin="round"/>

    <!-- Orbital Eye Socket (Glowing Prehistoric Core) -->
    <ellipse cx="-40" cy="-40" rx="36" ry="46" fill="#150a00" stroke="#4a2408" stroke-width="8"/>
    <ellipse cx="-40" cy="-40" rx="20" ry="26" fill="#f59e0b"/>
    <ellipse cx="-40" cy="-40" rx="10" ry="14" fill="#fef08a"/>
    <circle cx="-38" cy="-42" r="4" fill="#ffffff"/>

    <!-- Upper Serrated Teeth -->
    <polygon points="-10,50 5,100 20,50" fill="#fffbeb" stroke="#3d1d06" stroke-width="5"/>
    <polygon points="25,50 42,108 60,50" fill="#fffbeb" stroke="#3d1d06" stroke-width="5"/>
    <polygon points="65,50 85,112 105,50" fill="#fffbeb" stroke="#3d1d06" stroke-width="5"/>
    <polygon points="110,50 130,102 148,50" fill="#fffbeb" stroke="#3d1d06" stroke-width="5"/>
    <polygon points="150,45 165,85 178,35" fill="#fffbeb" stroke="#3d1d06" stroke-width="5"/>

    <!-- Lower Jaw -->
    <path d="M-130,95 C-90,100 -50,135 0,140 C90,150 170,110 175,80 C150,120 80,170 -10,170 C-80,170 -140,135 -160,110 Z" 
          fill="url(#fossilBone)" stroke="#2b1302" stroke-width="10" stroke-linejoin="round"/>
    
    <!-- Lower Teeth -->
    <polygon points="10,140 25,90 40,140" fill="#fffbeb" stroke="#3d1d06" stroke-width="5"/>
    <polygon points="50,140 70,85 85,140" fill="#fffbeb" stroke="#3d1d06" stroke-width="5"/>
    <polygon points="95,135 115,80 130,130" fill="#fffbeb" stroke="#3d1d06" stroke-width="5"/>
  </g>

  <!-- Sector HUD Tag -->
  <rect x="18" y="18" width="110" height="24" rx="6" fill="#052e16" stroke="#22c55e" stroke-width="1.5"/>
  <text x="73" y="34" font-family="-apple-system, sans-serif" font-size="10" font-weight="900" letter-spacing="1.5" fill="#86efac" text-anchor="middle">SECTOR 02</text>
</svg>