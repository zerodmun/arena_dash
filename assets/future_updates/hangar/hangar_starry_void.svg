<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <!-- Dark deep void gradient -->
    <linearGradient id="void-bg" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#050716" />
      <stop offset="35%" stop-color="#0a0c24" />
      <stop offset="65%" stop-color="#120d2e" />
      <stop offset="100%" stop-color="#03040c" />
    </linearGradient>

    <!-- Deep atmospheric hangar spotlight / nebula halo -->
    <radialGradient id="void-spot" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.22" />
      <stop offset="40%" stop-color="#6366f1" stop-opacity="0.14" />
      <stop offset="75%" stop-color="#a855f7" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Subtle sci-fi perspective floor grid -->
    <linearGradient id="void-floor-fade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="40%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.3" />
    </linearGradient>
  </defs>

  <!-- Void Background -->
  <rect width="1080" height="1920" fill="url(#void-bg)" />

  <!-- Center Nebula Halo Lighting (highlights the displayed ship) -->
  <rect width="1080" height="1920" fill="url(#void-spot)" />

  <!-- Star Field Particles -->
  <g fill="#ffffff">
    <circle cx="140" cy="220" r="1.5" opacity="0.6" />
    <circle cx="280" cy="140" r="2.2" opacity="0.8" />
    <circle cx="420" cy="310" r="1.2" opacity="0.5" />
    <circle cx="680" cy="180" r="2" opacity="0.75" />
    <circle cx="890" cy="260" r="2.8" opacity="0.9" />
    <circle cx="980" cy="420" r="1.4" opacity="0.5" />

    <circle cx="110" cy="560" r="1.8" opacity="0.7" />
    <circle cx="950" cy="620" r="1.5" opacity="0.65" />
    <circle cx="80" cy="880" r="2.2" opacity="0.8" />
    <circle cx="1020" cy="910" r="1.6" opacity="0.6" />
    <circle cx="160" cy="1150" r="1.5" opacity="0.5" />
    <circle cx="930" cy="1190" r="2.4" opacity="0.85" />
    <circle cx="120" cy="1420" r="1.8" opacity="0.7" />
    <circle cx="960" cy="1480" r="2" opacity="0.75" />
  </g>

  <!-- Perspective Cyber Space Floor Lines (Low opacity for futuristic depth) -->
  <g stroke="url(#void-floor-fade)" stroke-width="1.5">
    <!-- Perspective radial lines originating from vanishing point (540, 950) -->
    <line x1="540" y1="950" x2="-200" y2="1920" />
    <line x1="540" y1="950" x2="60" y2="1920" />
    <line x1="540" y1="950" x2="260" y2="1920" />
    <line x1="540" y1="950" x2="420" y2="1920" />
    <line x1="540" y1="950" x2="540" y2="1920" />
    <line x1="540" y1="950" x2="660" y2="1920" />
    <line x1="540" y1="950" x2="820" y2="1920" />
    <line x1="540" y1="950" x2="1020" y2="1920" />
    <line x1="540" y1="950" x2="1280" y2="1920" />

    <!-- Horizontal floor depth bars -->
    <line x1="380" y1="1200" x2="700" y2="1200" stroke-opacity="0.3" />
    <line x1="300" y1="1350" x2="780" y2="1350" stroke-opacity="0.4" />
    <line x1="200" y1="1520" x2="880" y2="1520" stroke-opacity="0.6" />
    <line x1="80" y1="1710" x2="1000" y2="1710" stroke-opacity="0.8" />
    <line x1="-50" y1="1910" x2="1130" y2="1910" stroke-opacity="1.0" />
  </g>
</svg>
