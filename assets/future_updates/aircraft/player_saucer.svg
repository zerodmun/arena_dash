<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Drop Shadow -->
    <filter id="ufoShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="16" flood-color="#000000" flood-opacity="0.75"/>
    </filter>

    <!-- Metallic Hull Gradient -->
    <linearGradient id="saucerHull" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="20%" stop-color="#e0e7ff"/>
      <stop offset="50%" stop-color="#a5b4fc"/>
      <stop offset="80%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>

    <!-- Under-Rim Metal -->
    <linearGradient id="saucerRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4338ca"/>
      <stop offset="40%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- Glowing Glass Cockpit Dome -->
    <radialGradient id="glassDome" cx="38%" cy="28%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#67e8f9"/>
      <stop offset="60%" stop-color="#06b6d4"/>
      <stop offset="85%" stop-color="#0e7490"/>
      <stop offset="100%" stop-color="#164e63"/>
    </radialGradient>

    <!-- Radiant Reactor Core Glow -->
    <radialGradient id="reactorGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#fef08a"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </radialGradient>

    <filter id="glowBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g filter="url(#ufoShadow)">
    <!-- Lower Propulsion Reactor Flare -->
    <ellipse cx="256" cy="380" rx="90" ry="32" fill="url(#reactorGlow)" filter="url(#glowBloom)"/>
    <ellipse cx="256" cy="380" rx="45" ry="16" fill="#ffffff"/>

    <!-- Bottom Saucer Base Plating -->
    <ellipse cx="256" cy="340" rx="210" ry="75" fill="url(#saucerRim)"/>
    
    <!-- Ventral Ring Propulsion Port -->
    <ellipse cx="256" cy="348" rx="140" ry="46" fill="#1e1b4b" stroke="#f59e0b" stroke-width="4"/>
    <ellipse cx="256" cy="350" rx="100" ry="30" fill="url(#reactorGlow)"/>

    <!-- Main Aerodynamic Saucer Disc Hull -->
    <ellipse cx="256" cy="310" rx="230" ry="85" fill="url(#saucerHull)" stroke="#818cf8" stroke-width="3"/>

    <!-- Perimeter Beveled Hull Ridge -->
    <ellipse cx="256" cy="302" rx="205" ry="70" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.65"/>
    <ellipse cx="256" cy="316" rx="215" ry="72" fill="none" stroke="#312e81" stroke-width="3" opacity="0.5"/>

    <!-- Hull Navigation Strobe Lights -->
    <g>
      <circle cx="70" cy="315" r="7" fill="#fef08a" filter="url(#glowBloom)"/>
      <circle cx="120" cy="345" r="8" fill="#fef08a" filter="url(#glowBloom)"/>
      <circle cx="185" cy="365" r="9" fill="#fef08a" filter="url(#glowBloom)"/>
      <circle cx="256" cy="372" r="10" fill="#fef08a" filter="url(#glowBloom)"/>
      <circle cx="327" cy="365" r="9" fill="#fef08a" filter="url(#glowBloom)"/>
      <circle cx="392" cy="345" r="8" fill="#fef08a" filter="url(#glowBloom)"/>
      <circle cx="442" cy="315" r="7" fill="#fef08a" filter="url(#glowBloom)"/>
    </g>

    <!-- Raised Cockpit Pedestal Ring -->
    <ellipse cx="256" cy="245" rx="120" ry="50" fill="#4338ca" stroke="#c7d2fe" stroke-width="3"/>

    <!-- Transparent Volumetric Cockpit Dome -->
    <path d="M145,240 C145,130 367,130 367,240 C367,270 145,270 145,240 Z" fill="url(#glassDome)" stroke="#a5f3fc" stroke-width="3.5"/>

    <!-- Dome Specular Highlight Reflection -->
    <ellipse cx="225" cy="180" rx="35" ry="16" fill="#ffffff" opacity="0.85" transform="rotate(-20 225 180)"/>
    <ellipse cx="270" cy="195" rx="12" ry="6" fill="#ffffff" opacity="0.7"/>

    <!-- Alien Pilot Silhouette inside Cockpit -->
    <ellipse cx="256" cy="220" rx="20" ry="24" fill="#065f46" opacity="0.85"/>
    <circle cx="248" cy="216" r="5" fill="#34d399"/>
    <circle cx="264" cy="216" r="5" fill="#34d399"/>
  </g>
</svg>
