<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Drop Shadow -->
    <filter id="spShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="16" flood-color="#000000" flood-opacity="0.8"/>
    </filter>

    <!-- White/Silver Ceramic Hull -->
    <linearGradient id="speedHull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#f1f5f9"/>
      <stop offset="70%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <!-- Slate Lavender Wing Metal -->
    <linearGradient id="speedWing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="40%" stop-color="#94a3b8"/>
      <stop offset="80%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Vibrant Red/Magenta Canopy Visor -->
    <linearGradient id="rubyCanopy" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fda4af"/>
      <stop offset="30%" stop-color="#f43f5e"/>
      <stop offset="70%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>

    <!-- Magenta Plasma Thruster -->
    <radialGradient id="speedFlame" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#f472b6"/>
      <stop offset="70%" stop-color="#db2777"/>
      <stop offset="100%" stop-color="#db2777" stop-opacity="0"/>
    </radialGradient>

    <filter id="rubyGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g filter="url(#spShadow)">
    <!-- Rear Thruster Plasma Flare -->
    <ellipse cx="256" cy="455" rx="36" ry="48" fill="url(#speedFlame)" filter="url(#rubyGlow)"/>
    <ellipse cx="256" cy="445" rx="16" ry="24" fill="#ffffff"/>

    <!-- Swept Curving Outer Wings (Left & Right) -->
    <!-- Left Wing -->
    <path d="M220,240 C170,260 110,320 80,420 C140,430 200,380 220,350 Z" fill="url(#speedWing)" stroke="#1e293b" stroke-width="3.5"/>
    <!-- Right Wing -->
    <path d="M292,240 C342,260 402,320 432,420 C372,430 312,380 292,350 Z" fill="url(#speedWing)" stroke="#1e293b" stroke-width="3.5"/>

    <!-- Main Aerodynamic Bullet/Speeder Body -->
    <path d="M256,60 C210,120 195,280 205,430 L307,430 C317,280 302,120 256,60 Z" fill="url(#speedHull)" stroke="#334155" stroke-width="4"/>

    <!-- Wing Surface Light Reflections -->
    <path d="M100,410 C125,350 170,300 215,265" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.75"/>
    <path d="M412,410 C387,350 342,300 297,265" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.75"/>

    <!-- Wide Curved Ruby Cockpit Visor -->
    <path d="M214,140 C230,125 282,125 298,140 C312,185 306,230 298,245 C282,230 230,230 214,245 C206,230 200,185 214,140 Z" fill="url(#rubyCanopy)" stroke="#be123c" stroke-width="3.5" filter="url(#rubyGlow)"/>

    <!-- Visor Specular Reflection -->
    <path d="M225,150 C240,140 272,140 287,150" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round"/>
    <ellipse cx="256" cy="158" rx="8" ry="4" fill="#ffffff" opacity="0.9"/>

    <!-- Center Forward Air Intake / Sensor Pod -->
    <rect x="240" y="270" width="32" height="70" rx="16" fill="#1e293b" stroke="#cbd5e1" stroke-width="3"/>
    <circle cx="256" cy="305" r="10" fill="#f43f5e" filter="url(#rubyGlow)"/>
    <circle cx="256" cy="305" r="4" fill="#ffffff"/>

    <!-- Lateral Aerodynamic Inset Stripes -->
    <line x1="216" y1="290" x2="216" y2="390" stroke="#f43f5e" stroke-width="3.5"/>
    <line x1="296" y1="290" x2="296" y2="390" stroke="#f43f5e" stroke-width="3.5"/>

    <!-- Engine Exhaust Cowl -->
    <polygon points="215,425 205,445 307,445 297,425" fill="#1e293b" stroke="#64748b" stroke-width="2.5"/>
    <ellipse cx="256" cy="445" rx="46" ry="10" fill="#0f172a" stroke="#f43f5e" stroke-width="2"/>
  </g>
</svg>
