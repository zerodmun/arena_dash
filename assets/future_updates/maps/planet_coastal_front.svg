<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Drop Shadow -->
    <filter id="pShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="8" flood-color="#000000" flood-opacity="0.75"/>
    </filter>

    <!-- Terracotta / Canyon Rock -->
    <radialGradient id="canyonRock" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fdba74"/>
      <stop offset="30%" stop-color="#fb923c"/>
      <stop offset="65%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#431407"/>
    </radialGradient>

    <!-- Amber Crystal Gradient -->
    <linearGradient id="amberCrystal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <filter id="amberGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Atmospheric Glow Halo -->
  <circle cx="128" cy="128" r="95" fill="#f97316" opacity="0.3" filter="url(#amberGlow)"/>

  <!-- Main Sphere -->
  <g filter="url(#pShadow)">
    <circle cx="128" cy="128" r="82" fill="url(#canyonRock)" stroke="#ea580c" stroke-width="2.5"/>

    <!-- Canyon Stratification & Surface Fault Lines -->
    <path d="M 52,110 C 85,90 170,95 204,115" fill="none" stroke="#7c2d12" stroke-width="7" opacity="0.7"/>
    <path d="M 50,140 C 90,125 165,135 206,145" fill="none" stroke="#431407" stroke-width="9" opacity="0.8"/>
    <path d="M 65,170 C 100,160 155,165 195,175" fill="none" stroke="#431407" stroke-width="6" opacity="0.85"/>

    <!-- Blue Oasis / Coastal Shimmer Spots -->
    <ellipse cx="140" cy="85" rx="14" ry="8" fill="#38bdf8" stroke="#0284c7" stroke-width="2"/>
    <ellipse cx="178" cy="115" rx="10" ry="6" fill="#38bdf8" stroke="#0284c7" stroke-width="1.5"/>
    <ellipse cx="90" cy="130" rx="12" ry="7" fill="#38bdf8" stroke="#0284c7" stroke-width="1.5"/>

    <!-- Protruding Amber Crystals (Bottom Left Clusters) -->
    <!-- Crystal 1 -->
    <polygon points="68,180 50,210 65,225 82,195" fill="url(#amberCrystal)" stroke="#78350f" stroke-width="2.5"/>
    <!-- Crystal 2 -->
    <polygon points="85,190 75,235 95,245 105,200" fill="url(#amberCrystal)" stroke="#78350f" stroke-width="2.5"/>
    <!-- Crystal 3 -->
    <polygon points="105,200 110,248 130,245 125,205" fill="url(#amberCrystal)" stroke="#78350f" stroke-width="2.5"/>

    <!-- Protruding Amber Crystals (Bottom Right Clusters) -->
    <!-- Crystal 4 -->
    <polygon points="175,195 195,225 210,210 188,180" fill="url(#amberCrystal)" stroke="#78350f" stroke-width="2.5"/>
    <!-- Crystal 5 -->
    <polygon points="155,205 165,245 185,235 172,195" fill="url(#amberCrystal)" stroke="#78350f" stroke-width="2.5"/>

    <!-- Specular Highlight Crest -->
    <path d="M 75,80 C 95,60 145,60 165,75" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.85"/>
  </g>
</svg>
