<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <!-- Deep Space Background Gradient -->
    <radialGradient id="spaceDeep" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#3b0764"/>
      <stop offset="35%" stop-color="#1e1b4b"/>
      <stop offset="70%" stop-color="#0f0e26"/>
      <stop offset="100%" stop-color="#050314"/>
    </radialGradient>

    <!-- Glowing Galaxy Core -->
    <radialGradient id="galaxyCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="20%" stop-color="#f472b6"/>
      <stop offset="50%" stop-color="#d946ef"/>
      <stop offset="75%" stop-color="#7e22ce" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b0764" stop-opacity="0"/>
    </radialGradient>

    <!-- Spiral Arm Gradient -->
    <linearGradient id="spiralArm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e879f9" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#3b0764" stop-opacity="0"/>
    </linearGradient>

    <!-- Star Glow -->
    <filter id="starBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Deep Cosmic Space Backdrop -->
  <rect width="1920" height="1080" fill="url(#spaceDeep)"/>

  <!-- Distant Background Starfield -->
  <g fill="#ffffff" opacity="0.65">
    <circle cx="120" cy="80" r="1.5"/>
    <circle cx="340" cy="190" r="2.5" filter="url(#starBloom)"/>
    <circle cx="680" cy="90" r="1.2"/>
    <circle cx="890" cy="140" r="2.0"/>
    <circle cx="1200" cy="70" r="1.8"/>
    <circle cx="1500" cy="160" r="2.8" filter="url(#starBloom)"/>
    <circle cx="1780" cy="100" r="1.5"/>
    <circle cx="210" cy="450" r="1.5"/>
    <circle cx="180" cy="820" r="2.2"/>
    <circle cx="520" cy="940" r="1.5"/>
    <circle cx="880" cy="990" r="2.0"/>
    <circle cx="1400" cy="920" r="1.8"/>
    <circle cx="1740" cy="880" r="2.5" filter="url(#starBloom)"/>
    <circle cx="1840" cy="620" r="1.5"/>
    <circle cx="1600" cy="420" r="2.0"/>
  </g>

  <!-- Major Twinkling Cross Stars -->
  <g stroke="#ffffff" stroke-width="1.5" opacity="0.8" filter="url(#starBloom)">
    <line x1="380" y1="540" x2="380" y2="560"/>
    <line x1="370" y1="550" x2="390" y2="550"/>
    <line x1="1260" y1="240" x2="1260" y2="260"/>
    <line x1="1250" y1="250" x2="1270" y2="250"/>
    <line x1="680" y1="280" x2="680" y2="296"/>
    <line x1="672" y1="288" x2="688" y2="288"/>
  </g>

  <!-- Center Spiral Galaxy Core -->
  <ellipse cx="1060" cy="580" rx="480" ry="240" fill="url(#galaxyCore)" filter="url(#starBloom)" transform="rotate(-12 1060 580)"/>
  <ellipse cx="1060" cy="580" rx="260" ry="120" fill="#ffffff" opacity="0.35" filter="url(#starBloom)" transform="rotate(-12 1060 580)"/>

  <!-- Swirling Galaxy Arms (Elliptical Dust Ribbons) -->
  <ellipse cx="1060" cy="580" rx="720" ry="340" fill="none" stroke="url(#spiralArm)" stroke-width="85" transform="rotate(-15 1060 580)"/>
  <ellipse cx="1060" cy="580" rx="540" ry="240" fill="none" stroke="#f472b6" stroke-width="40" opacity="0.25" transform="rotate(-10 1060 580)"/>

  <!-- Golden Dotted Flight Path connecting all 8 Sector Nodes -->
  <path d="M 280,360 C 440,260 520,250 560,250 C 720,240 920,180 1020,190 C 1240,200 1480,260 1520,340 C 1580,480 1560,660 1480,720 C 1380,820 1120,850 1020,830 C 820,800 580,780 520,700 C 440,600 680,480 840,460 C 1020,440 1220,480 1240,540" 
        fill="none" stroke="#facc15" stroke-width="7" stroke-dasharray="14,16" stroke-linecap="round" filter="url(#starBloom)"/>
  <path d="M 280,360 C 440,260 520,250 560,250 C 720,240 920,180 1020,190 C 1240,200 1480,260 1520,340 C 1580,480 1560,660 1480,720 C 1380,820 1120,850 1020,830 C 820,800 580,780 520,700 C 440,600 680,480 840,460 C 1020,440 1220,480 1240,540" 
        fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="14,16" stroke-linecap="round"/>

  <!-- Orbital Node Target Halo Rings -->
  <!-- Node 1: Cyber Matrix (560, 250) -->
  <circle cx="560" cy="250" r="85" fill="none" stroke="#38bdf8" stroke-width="3" opacity="0.6"/>
  <circle cx="560" cy="250" r="105" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.3"/>

  <!-- Node 2: Primal Jungle (1020, 190) -->
  <circle cx="1020" cy="190" r="95" fill="none" stroke="#38bdf8" stroke-width="3" opacity="0.6"/>
  <circle cx="1020" cy="190" r="115" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.3"/>

  <!-- Node 3: Void Horizon (1520, 340) -->
  <circle cx="1520" cy="340" r="90" fill="none" stroke="#38bdf8" stroke-width="3" opacity="0.6"/>

  <!-- Node 4: Coastal Front (1480, 720) -->
  <circle cx="1480" cy="720" r="88" fill="none" stroke="#38bdf8" stroke-width="3" opacity="0.6"/>

  <!-- Node 5: Dune Outpost (1020, 830) -->
  <circle cx="1020" cy="830" r="85" fill="none" stroke="#38bdf8" stroke-width="3" opacity="0.6"/>

  <!-- Node 6: Magma Caldera (520, 700) -->
  <circle cx="520" cy="700" r="82" fill="none" stroke="#c084fc" stroke-width="3" opacity="0.6"/>

  <!-- Node 7: Glacial Tundra (840, 460) -->
  <circle cx="840" cy="460" r="80" fill="none" stroke="#c084fc" stroke-width="3" opacity="0.6"/>

  <!-- Node 8: Toxic Citadel (1240, 540) -->
  <circle cx="1240" cy="540" r="82" fill="none" stroke="#c084fc" stroke-width="3" opacity="0.6"/>

  <!-- Player UFO Flying Along Trajectory Route -->
  <g transform="translate(240, 340) rotate(-22)">
    <ellipse cx="0" cy="15" rx="55" ry="18" fill="#4338ca" stroke="#818cf8" stroke-width="2.5"/>
    <ellipse cx="0" cy="22" rx="25" ry="8" fill="#facc15" filter="url(#starBloom)"/>
    <path d="M -30,12 C -30,-15 30,-15 30,12 Z" fill="#06b6d4" stroke="#a5f3fc" stroke-width="2"/>
    <ellipse cx="-12" cy="0" rx="8" ry="4" fill="#ffffff" opacity="0.8"/>
  </g>
</svg>
