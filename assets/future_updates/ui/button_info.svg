<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72" width="72" height="72">
  <defs>
    <linearGradient id="btn-cyan-sq" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#0284c7" />
      <stop offset="85%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>

    <filter id="btn-inf-drop" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#020617" flood-opacity="0.5" />
    </filter>
  </defs>

  <g filter="url(#btn-inf-drop)">
    <!-- Base Rim -->
    <rect x="4" y="4" width="64" height="64" rx="18" fill="#082f49" stroke="#0284c7" stroke-width="2" />
    <!-- Face -->
    <rect x="6" y="6" width="60" height="60" rx="16" fill="url(#btn-cyan-sq)" stroke="#bae6fd" stroke-width="1.5" />
  </g>

  <!-- Top Sheen -->
  <path d="M 12 8 Q 36 14 60 8 Q 54 22 36 22 Q 18 22 12 8 Z" fill="#ffffff" opacity="0.4" />

  <!-- Info 'i' Icon -->
  <g transform="translate(36, 36)">
    <!-- Shadow -->
    <g fill="#082f49" opacity="0.5" transform="translate(0, 2)">
      <circle cx="0" cy="-11" r="3.5" />
      <rect x="-3" y="-3" width="6" height="17" rx="3" />
      <rect x="-6" y="-3" width="6" height="4" rx="1.5" />
      <rect x="-6" y="11" width="12" height="4" rx="2" />
    </g>
    <!-- White Foreground -->
    <circle cx="0" cy="-11" r="3.5" fill="#ffffff" />
    <rect x="-3" y="-3" width="6" height="17" rx="3" fill="#ffffff" />
    <rect x="-6" y="-3" width="6" height="4" rx="1.5" fill="#ffffff" />
    <rect x="-6" y="11" width="12" height="4" rx="2" fill="#ffffff" />
  </g>
</svg>
