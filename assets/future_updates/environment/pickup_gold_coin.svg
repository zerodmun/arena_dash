<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Outer rim metallic gold -->
    <linearGradient id="coin-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="25%" stop-color="#facc15" />
      <stop offset="60%" stop-color="#eab308" />
      <stop offset="90%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#854d0e" />
    </linearGradient>

    <!-- Inner face glossy bowl -->
    <linearGradient id="coin-face" x1="20%" y1="15%" x2="80%" y2="85%">
      <stop offset="0%" stop-color="#fef9c3" />
      <stop offset="30%" stop-color="#fde047" />
      <stop offset="70%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#a16207" />
    </linearGradient>

    <!-- Star emboss gradient -->
    <linearGradient id="coin-star" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#fef08a" />
      <stop offset="80%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>

    <radialGradient id="coin-glow" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#facc15" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ca8a04" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="32" cy="32" r="30" fill="url(#coin-glow)" />

  <!-- Shadow Under Coin -->
  <circle cx="32" cy="35" r="26" fill="#78350f" opacity="0.45" />

  <!-- Outer Bevel Rim -->
  <circle cx="32" cy="32" r="26" fill="url(#coin-rim)" stroke="#78350f" stroke-width="2" />

  <!-- Inner Recessed Ridge -->
  <circle cx="32" cy="32" r="21" fill="none" stroke="#ca8a04" stroke-width="1.5" />

  <!-- Coin Inner Face -->
  <circle cx="32" cy="32" r="20" fill="url(#coin-face)" />

  <!-- Star Insignia (Embossed) -->
  <!-- Shadow offset star -->
  <polygon points="32,18 35.8,26.5 45,27.5 38.2,33.8 40.2,43 32,38.2 23.8,43 25.8,33.8 19,27.5 28.2,26.5" 
           fill="#854d0e" opacity="0.6" transform="translate(0.5, 1.2)" />
  <!-- Main star -->
  <polygon points="32,18 35.8,26.5 45,27.5 38.2,33.8 40.2,43 32,38.2 23.8,43 25.8,33.8 19,27.5 28.2,26.5" 
           fill="url(#coin-star)" stroke="#eab308" stroke-width="0.75" />

  <!-- Top Glass Sheen / Reflection Crescent -->
  <path d="M 14 30 A 20 20 0 0 1 50 30 A 18 13 0 0 0 14 30 Z" fill="#ffffff" opacity="0.4" />
  
  <!-- Tiny Sparkle Glint -->
  <polygon points="21,19 22,22 25,23 22,24 21,27 20,24 17,23 20,22" fill="#ffffff" opacity="0.9" />
</svg>
