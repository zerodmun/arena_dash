<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- Heavy Elevation Drop Shadow -->
    <filter id="vorShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="26" stdDeviation="16" flood-color="#000000" flood-opacity="0.85"/>
    </filter>

    <!-- Obsidian Stealth Wing Left -->
    <linearGradient id="vorWingL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="25%" stop-color="#0284c7"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Obsidian Stealth Wing Right -->
    <linearGradient id="vorWingR" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="25%" stop-color="#0284c7"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Quantum Cyan Violet Fuselage Spine -->
    <linearGradient id="vorSpine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="25%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="75%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Singularity Vortex Canopy -->
    <radialGradient id="vorCockpit" cx="45%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#38bdf8"/>
      <stop offset="65%" stop-color="#8b5cf6"/>
      <stop offset="90%" stop-color="#4c1d95"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>

    <!-- Antimatter Warp Exhaust Flame -->
    <radialGradient id="vorFlame" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#38bdf8"/>
      <stop offset="70%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#581c87" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g filter="url(#vorShadow)">
    <!-- Dual Warp Distortion Thrusters -->
    <ellipse cx="196" cy="426" rx="20" ry="46" fill="url(#vorFlame)"/>
    <ellipse cx="316" cy="426" rx="20" ry="46" fill="url(#vorFlame)"/>
    <ellipse cx="196" cy="418" rx="10" ry="24" fill="#ffffff"/>
    <ellipse cx="316" cy="418" rx="10" ry="24" fill="#ffffff"/>

    <!-- Left Forward-Swept Inverted Delta Wing -->
    <polygon points="256,54 256,360 64,390 98,240 196,170" fill="url(#vorWingL)" stroke="#0f172a" stroke-width="6" stroke-linejoin="round"/>
    <!-- Left Wing Under-Armor Facet -->
    <polygon points="98,240 64,390 152,364 198,290" fill="#0284c7" opacity="0.4"/>
    <!-- Neon Quantum Energy Lines -->
    <line x1="154" y1="200" x2="88" y2="340" stroke="#00f0ff" stroke-width="4" stroke-linecap="round"/>
    <line x1="192" y1="250" x2="132" y2="356" stroke="#c084fc" stroke-width="3" stroke-linecap="round"/>

    <!-- Right Forward-Swept Inverted Delta Wing -->
    <polygon points="256,54 256,360 448,390 414,240 316,170" fill="url(#vorWingR)" stroke="#0f172a" stroke-width="6" stroke-linejoin="round"/>
    <!-- Right Wing Under-Armor Facet -->
    <polygon points="414,240 448,390 360,364 314,290" fill="#0284c7" opacity="0.4"/>
    <!-- Neon Quantum Energy Lines -->
    <line x1="358" y1="200" x2="424" y2="340" stroke="#00f0ff" stroke-width="4" stroke-linecap="round"/>
    <line x1="320" y1="250" x2="380" y2="356" stroke="#c084fc" stroke-width="3" stroke-linecap="round"/>

    <!-- Floating Outrigger Winglet Nodes -->
    <polygon points="56,220 72,270 52,350 42,280" fill="#0284c7" stroke="#00f0ff" stroke-width="3"/>
    <circle cx="60" cy="224" r="6" fill="#ffffff"/>
    <polygon points="456,220 440,270 460,350 470,280" fill="#0284c7" stroke="#00f0ff" stroke-width="3"/>
    <circle cx="452" cy="224" r="6" fill="#ffffff"/>

    <!-- Central Sculpted Obsidian Fuselage -->
    <polygon points="256,32 302,188 302,400 256,436 210,400 210,188" fill="url(#vorSpine)" stroke="#020617" stroke-width="6" stroke-linejoin="round"/>

    <!-- Beveled Nose Shroud -->
    <polygon points="256,32 292,176 256,202 220,176" fill="#38bdf8" stroke="#0284c7" stroke-width="3"/>

    <!-- Singularity Core Canopy -->
    <ellipse cx="256" cy="242" rx="35" ry="76" fill="url(#vorCockpit)" stroke="#020617" stroke-width="6"/>
    <!-- Specular Arc -->
    <path d="M242,192 Q264,204 264,248" stroke="#ffffff" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.95"/>
    <circle cx="260" cy="216" r="5" fill="#ffffff"/>

    <!-- Heavy Twin Thruster Mounts -->
    <rect x="180" y="400" width="34" height="26" rx="6" fill="#0f172a" stroke="#00f0ff" stroke-width="4"/>
    <rect x="298" y="400" width="34" height="26" rx="6" fill="#0f172a" stroke="#00f0ff" stroke-width="4"/>

    <!-- Quantum Singularity Ring in Core -->
    <circle cx="256" cy="356" r="14" fill="#020617" stroke="#00f0ff" stroke-width="4"/>
    <circle cx="256" cy="356" r="6" fill="#c084fc"/>
    <line x1="256" y1="52" x2="256" y2="168" stroke="#c084fc" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
