<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <!-- Deep Cosmic Horizon Gradient -->
    <linearGradient id="horizonSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#100839"/>
      <stop offset="30%" stop-color="#201064"/>
      <stop offset="65%" stop-color="#3823c4"/>
      <stop offset="85%" stop-color="#184ee8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Mountain Silhouette -->
    <linearGradient id="mountainDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#020408"/>
    </linearGradient>

    <filter id="bloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="1920" height="1080" fill="url(#horizonSky)"/>

  <!-- Atmospheric ribbons extend the existing horizon into the reference's cosmic theme. -->
  <g fill="none" stroke="#487bff" opacity="0.12">
    <path d="M -160 210 C 440 80 670 600 1340 300 S 1770 80 2160 280" stroke-width="46"/>
    <path d="M -120 260 C 520 100 760 610 1420 360 S 1820 160 2140 320" stroke-width="12"/>
    <path d="M 140 -120 C 80 210 1130 60 890 480 S 470 650 1800 780" stroke-width="28"/>
  </g>

  <!-- Stars -->
  <g fill="#ffffff" opacity="0.75">
    <circle cx="150" cy="90" r="1.5"/>
    <circle cx="380" cy="140" r="2.2" filter="url(#bloom)"/>
    <circle cx="650" cy="80" r="1.2"/>
    <circle cx="890" cy="180" r="2.5" filter="url(#bloom)"/>
    <circle cx="1120" cy="100" r="1.5"/>
    <circle cx="1450" cy="150" r="2.0"/>
    <circle cx="1720" cy="80" r="2.5" filter="url(#bloom)"/>
    <circle cx="280" cy="380" r="1.5"/>
    <circle cx="560" cy="320" r="2.0"/>
    <circle cx="940" cy="340" r="1.2"/>
    <circle cx="1320" cy="280" r="2.2"/>
    <circle cx="1680" cy="360" r="1.5"/>
  </g>

  <!-- Shooting Stars / Meteor Trails -->
  <line x1="220" y1="620" x2="310" y2="700" stroke="#67e8f9" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="1620" y1="720" x2="1750" y2="820" stroke="#f472b6" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>

  <!-- Alien Mountain Range Foreground Silhouette -->
  <polygon points="0,960 120,900 240,940 380,880 520,930 710,870 890,920 1060,860 1240,910 1440,850 1620,900 1780,840 1920,890 1920,1080 0,1080" fill="url(#mountainDark)"/>
  <polygon points="0,990 180,950 340,990 560,940 780,980 980,930 1180,970 1380,920 1580,960 1820,920 1920,950 1920,1080 0,1080" fill="#020408"/>
</svg>
