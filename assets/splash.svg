<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <!-- Background Deep Cosmic Gradient -->
    <radialGradient id="splashBg" cx="50%" cy="46%" r="70%">
      <stop offset="0%" stop-color="#0a1832"/>
      <stop offset="45%" stop-color="#040914"/>
      <stop offset="85%" stop-color="#020408"/>
      <stop offset="100%" stop-color="#000204"/>
    </radialGradient>

    <!-- Hyperspace Center Bloom -->
    <radialGradient id="hyperBloom" cx="50%" cy="45%" r="35%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="25%" stop-color="#00e5ff" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Metallic Hull Gradient -->
    <linearGradient id="hullGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="20%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#f0f9ff"/>
      <stop offset="80%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <!-- Wing Left Gradient -->
    <linearGradient id="wingLeftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="60%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#082f49"/>
    </linearGradient>

    <!-- Wing Right Gradient -->
    <linearGradient id="wingRightGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="60%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#082f49"/>
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#e0f2fe"/>
      <stop offset="75%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Thruster Fire Gradient -->
    <radialGradient id="thrusterPlume" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#00f0ff"/>
      <stop offset="70%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#034b75" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="bigShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="28" stdDeviation="24" flood-color="#000000" flood-opacity="0.95"/>
    </filter>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 1. Deep Space Canvas Backdrop -->
  <rect width="1920" height="1080" fill="url(#splashBg)"/>

  <!-- 2. Hyperspace Perspective Grid Lines -->
  <g opacity="0.32">
    <!-- Perspective Floor Grid Converging to Horizon (960, 480) -->
    <line x1="960" y1="480" x2="-200" y2="1080" stroke="#00d0ff" stroke-width="2.5"/>
    <line x1="960" y1="480" x2="100" y2="1080" stroke="#00d0ff" stroke-width="2"/>
    <line x1="960" y1="480" x2="400" y2="1080" stroke="#00d0ff" stroke-width="1.8"/>
    <line x1="960" y1="480" x2="700" y2="1080" stroke="#00d0ff" stroke-width="1.8"/>
    <line x1="960" y1="480" x2="960" y2="1080" stroke="#00f0ff" stroke-width="2.5"/>
    <line x1="960" y1="480" x2="1220" y2="1080" stroke="#00d0ff" stroke-width="1.8"/>
    <line x1="960" y1="480" x2="1520" y2="1080" stroke="#00d0ff" stroke-width="1.8"/>
    <line x1="960" y1="480" x2="1820" y2="1080" stroke="#00d0ff" stroke-width="2"/>
    <line x1="960" y1="480" x2="2120" y2="1080" stroke="#00d0ff" stroke-width="2.5"/>

    <!-- Transverse Grid Rings -->
    <ellipse cx="960" cy="780" rx="900" ry="120" fill="none" stroke="#0284c7" stroke-width="1.5"/>
    <ellipse cx="960" cy="650" rx="650" ry="85" fill="none" stroke="#0284c7" stroke-width="1.5"/>
    <ellipse cx="960" cy="560" rx="420" ry="55" fill="none" stroke="#0284c7" stroke-width="1.5"/>
    <ellipse cx="960" cy="510" rx="220" ry="28" fill="none" stroke="#00e5ff" stroke-width="2"/>

    <!-- Star Streaks / Speed Lines -->
    <line x1="200" y1="200" x2="450" y2="350" stroke="#00f0ff" stroke-width="2.5" stroke-linecap="round" opacity="0.4"/>
    <line x1="1720" y1="200" x2="1470" y2="350" stroke="#00f0ff" stroke-width="2.5" stroke-linecap="round" opacity="0.4"/>
    <line x1="150" y1="500" x2="380" y2="540" stroke="#00f0ff" stroke-width="1.5" stroke-linecap="round" opacity="0.3"/>
    <line x1="1770" y1="500" x2="1540" y2="540" stroke="#00f0ff" stroke-width="1.5" stroke-linecap="round" opacity="0.3"/>
  </g>

  <!-- 3. Hyperspace Central Flare Core -->
  <circle cx="960" cy="380" r="420" fill="url(#hyperBloom)"/>

  <!-- 4. Valkyrie Fighter Main Hero Ship (Scaled & Centered at 960, 360) -->
  <g transform="translate(960, 340)" filter="url(#bigShadow)">
    <!-- Thruster Fire Jets Plumes -->
    <polygon points="-42,90 -22,90 -32,230" fill="url(#thrusterPlume)"/>
    <ellipse cx="-32" cy="115" rx="15" ry="55" fill="#00e5ff" filter="url(#glow)"/>
    <ellipse cx="-32" cy="105" rx="8" ry="30" fill="#ffffff"/>

    <polygon points="22,90 42,90 32,230" fill="url(#thrusterPlume)"/>
    <ellipse cx="32" cy="115" rx="15" ry="55" fill="#00e5ff" filter="url(#glow)"/>
    <ellipse cx="32" cy="105" rx="8" ry="30" fill="#ffffff"/>

    <!-- Left Wing -->
    <polygon points="0,-160 0,60 -195,120 -160,-10 -70,-90" 
             fill="url(#wingLeftGrad)" stroke="#011b33" stroke-width="9" stroke-linejoin="round"/>
    <!-- Left Wing Bevel Edge & Decals -->
    <polygon points="-160,-10 -195,120 -115,95 -65,30" fill="#026aa3" opacity="0.8"/>
    <line x1="-110" y1="-50" x2="-165" y2="70" stroke="#00f0ff" stroke-width="5" stroke-linecap="round"/>
    <line x1="-70" y1="0" x2="-125" y2="90" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <!-- Wingtip Cannon -->
    <rect x="-202" y="60" width="14" height="75" rx="5" fill="#091b2e" stroke="#00f0ff" stroke-width="3"/>
    <circle cx="-195" cy="60" r="6" fill="#ffffff" filter="url(#glow)"/>

    <!-- Right Wing -->
    <polygon points="0,-160 0,60 195,120 160,-10 70,-90" 
             fill="url(#wingRightGrad)" stroke="#011b33" stroke-width="9" stroke-linejoin="round"/>
    <!-- Right Wing Bevel Edge & Decals -->
    <polygon points="160,-10 195,120 115,95 65,30" fill="#026aa3" opacity="0.8"/>
    <line x1="110" y1="-50" x2="165" y2="70" stroke="#00f0ff" stroke-width="5" stroke-linecap="round"/>
    <line x1="70" y1="0" x2="125" y2="90" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <!-- Wingtip Cannon -->
    <rect x="188" y="60" width="14" height="75" rx="5" fill="#091b2e" stroke="#00f0ff" stroke-width="3"/>
    <circle cx="195" cy="60" r="6" fill="#ffffff" filter="url(#glow)"/>

    <!-- Fuselage Body -->
    <polygon points="0,-185 45,-60 45,85 0,110 -45,85 -45,-60" 
             fill="url(#hullGrad)" stroke="#01192e" stroke-width="9" stroke-linejoin="round"/>
    
    <!-- Central Titanium Spine Ridge -->
    <polygon points="0,-182 12,-60 12,100 0,108 -12,100 -12,-60" fill="#ffffff" opacity="0.9"/>

    <!-- Cockpit Canopy -->
    <polygon points="0,-75 26,0 20,45 0,55 -20,45 -26,0" 
             fill="#022138" stroke="#00f0ff" stroke-width="5" stroke-linejoin="round"/>
    <polygon points="0,-68 20,-2 14,40 0,48 -14,40 -20,-2" fill="#0284c7"/>
    <path d="M-10,-45 Q0,-40 0,25" stroke="#ffffff" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.95"/>
    <circle cx="-5" cy="-45" r="3.5" fill="#ffffff"/>

    <!-- Nose Tip Plasma Cannon Node -->
    <circle cx="0" cy="-185" r="8" fill="#ffffff" filter="url(#glow)"/>
  </g>

  <!-- 5. Epic Typography: ARENA DASH -->
  <g transform="translate(960, 680)">
    <!-- Cyan Shadow / Bloom Layer -->
    <text x="0" y="8" font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif" 
          font-size="96" font-weight="900" letter-spacing="16" fill="#00d0ff" text-anchor="middle" opacity="0.8" filter="url(#glow)">ARENA DASH</text>
    
    <!-- Deep Drop Shadow -->
    <text x="0" y="6" font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif" 
          font-size="96" font-weight="900" letter-spacing="16" fill="#000000" text-anchor="middle" opacity="0.95">ARENA DASH</text>

    <!-- Main Front Face with Metallic Gradient -->
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif" 
          font-size="96" font-weight="900" letter-spacing="16" fill="url(#titleGrad)" stroke="#012340" stroke-width="4" text-anchor="middle">ARENA DASH</text>

    <!-- Subtitle Banner -->
    <text x="0" y="60" font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif" 
          font-size="22" font-weight="700" letter-spacing="12" fill="#38bdf8" text-anchor="middle">SEMI-3D HYPERSPACE SHOOTER</text>

    <!-- Sleek Tech Chevron Divider -->
    <path d="M-220,85 L0,98 L220,85" stroke="#00f0ff" stroke-width="3" fill="none" opacity="0.75" filter="url(#glow)"/>
    <circle cx="0" cy="98" r="5" fill="#ffffff"/>
  </g>

  <!-- 6. Bottom System Status Bar -->
  <g transform="translate(960, 990)">
    <rect x="-240" y="-16" width="480" height="32" rx="16" fill="#050d1a" stroke="#0284c7" stroke-width="2"/>
    <rect x="-234" y="-10" width="300" height="20" rx="10" fill="#00e5ff" opacity="0.85" filter="url(#glow)"/>
    <text x="0" y="42" font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif" 
          font-size="14" font-weight="600" letter-spacing="4" fill="#7dd3fc" text-anchor="middle">INITIALIZING QUANTUM SYSTEMS...</text>
  </g>
</svg>