<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background Radial Deep Space Void -->
    <radialGradient id="bgSpace" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#0e234a"/>
      <stop offset="45%" stop-color="#061024"/>
      <stop offset="80%" stop-color="#030712"/>
      <stop offset="100%" stop-color="#010308"/>
    </radialGradient>

    <!-- Outer Squircle Metallic Frame Gradient -->
    <linearGradient id="frameBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="25%" stop-color="#0284c7"/>
      <stop offset="60%" stop-color="#075985"/>
      <stop offset="85%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Inner Glow Gradient -->
    <linearGradient id="innerGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Hyperspace Warp Rays -->
    <radialGradient id="warpBloom" cx="50%" cy="45%" r="40%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Aircraft: Wing Gradient Left (From player.svg) -->
    <linearGradient id="pWingL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="35%" stop-color="#0284c7"/>
      <stop offset="75%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#082f49"/>
    </linearGradient>

    <!-- Aircraft: Wing Gradient Right (From player.svg) -->
    <linearGradient id="pWingR" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="35%" stop-color="#0284c7"/>
      <stop offset="75%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#082f49"/>
    </linearGradient>

    <!-- Aircraft: 3D Fuselage Spine (From player.svg) -->
    <linearGradient id="pFuselage" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0c4a6e"/>
      <stop offset="25%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="75%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </linearGradient>

    <!-- Aircraft: Volumetric Cockpit Dome (From player.svg) -->
    <radialGradient id="pCockpit" cx="42%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#67e8f9"/>
      <stop offset="60%" stop-color="#06b6d4"/>
      <stop offset="85%" stop-color="#0e7490"/>
      <stop offset="100%" stop-color="#083344"/>
    </radialGradient>

    <!-- Aircraft: Thruster Plasma Core (From player.svg) -->
    <radialGradient id="pThruster" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#67e8f9"/>
      <stop offset="65%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>

    <!-- Powerful Jet Plume Extended Gradient -->
    <linearGradient id="plumeExtended" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="20%" stop-color="#00f0ff"/>
      <stop offset="60%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </linearGradient>

    <!-- Badge Metallic Plate Gradient -->
    <linearGradient id="badgePlate" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#051329"/>
      <stop offset="30%" stop-color="#0c254d"/>
      <stop offset="50%" stop-color="#13386e"/>
      <stop offset="70%" stop-color="#0c254d"/>
      <stop offset="100%" stop-color="#051329"/>
    </linearGradient>

    <!-- Title Metallic Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#e0f2fe"/>
      <stop offset="75%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Deep Drop Shadow -->
    <filter id="heroShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="36" stdDeviation="28" flood-color="#000000" flood-opacity="0.9"/>
    </filter>

    <!-- Subtle Badge Shadow -->
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- 1. Master Squircle App Icon Base -->
  <rect x="40" y="40" width="944" height="944" rx="216" ry="216" fill="url(#bgSpace)" stroke="url(#frameBorder)" stroke-width="24"/>
  <rect x="62" y="62" width="900" height="900" rx="196" ry="196" fill="none" stroke="url(#innerGlow)" stroke-width="4"/>

  <!-- 2. Hyperspace Central Glow & Warp Radial Rays -->
  <circle cx="512" cy="450" r="380" fill="url(#warpBloom)"/>

  <g opacity="0.3">
    <!-- Warp Lines Accelerating from Center -->
    <line x1="512" y1="450" x2="160" y2="160" stroke="#38bdf8" stroke-width="3" stroke-dasharray="24 16"/>
    <line x1="512" y1="450" x2="864" y2="160" stroke="#38bdf8" stroke-width="3" stroke-dasharray="24 16"/>
    <line x1="512" y1="450" x2="120" y2="520" stroke="#00f0ff" stroke-width="2.5" stroke-dasharray="20 14"/>
    <line x1="512" y1="450" x2="904" y2="520" stroke="#00f0ff" stroke-width="2.5" stroke-dasharray="20 14"/>
    <line x1="512" y1="450" x2="200" y2="820" stroke="#0284c7" stroke-width="3" stroke-dasharray="28 18"/>
    <line x1="512" y1="450" x2="824" y2="820" stroke="#0284c7" stroke-width="3" stroke-dasharray="28 18"/>
    <line x1="512" y1="450" x2="512" y2="80" stroke="#00f0ff" stroke-width="2" stroke-dasharray="16 12"/>
  </g>

  <!-- 3. Tactical Cyber HUD & Concentric Targeting Rings -->
  <g opacity="0.45">
    <!-- Outer Concentric Reticle -->
    <circle cx="512" cy="450" r="360" fill="none" stroke="#0284c7" stroke-width="4" stroke-dasharray="32 20"/>
    <circle cx="512" cy="450" r="270" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="20 14"/>
    <circle cx="512" cy="450" r="160" fill="none" stroke="#00f0ff" stroke-width="3.5"/>

    <!-- Reticle Crosshairs with Center Notch -->
    <line x1="512" y1="90" x2="512" y2="220" stroke="#00f0ff" stroke-width="4"/>
    <line x1="140" y1="450" x2="240" y2="450" stroke="#00f0ff" stroke-width="4"/>
    <line x1="784" y1="450" x2="884" y2="450" stroke="#00f0ff" stroke-width="4"/>

    <!-- Corner Radar Ticks -->
    <path d="M260 200 L200 200 L200 260" fill="none" stroke="#00f0ff" stroke-width="5" stroke-linecap="round"/>
    <path d="M764 200 L824 200 L824 260" fill="none" stroke="#00f0ff" stroke-width="5" stroke-linecap="round"/>
    <path d="M200 680 L200 740 L260 740" fill="none" stroke="#00f0ff" stroke-width="5" stroke-linecap="round"/>
    <path d="M824 680 L824 740 L764 740" fill="none" stroke="#00f0ff" stroke-width="5" stroke-linecap="round"/>

    <!-- Cyber Hex Data Dots -->
    <circle cx="512" cy="90" r="7" fill="#ffffff"/>
    <circle cx="200" cy="450" r="6" fill="#00f0ff"/>
    <circle cx="824" cy="450" r="6" fill="#00f0ff"/>
  </g>

  <!-- 4. Blue Aircraft (The Signature Player Jet from player.svg) -->
  <g transform="translate(512, 452) scale(1.42) translate(-256, -240)" filter="url(#heroShadow)">

    <!-- Extended Dual Plasma Exhaust Thruster Plumes -->
    <g>
      <!-- Left Thruster Plume Long -->
      <polygon points="190,420 218,420 204,520" fill="url(#plumeExtended)"/>
      <ellipse cx="204" cy="435" rx="22" ry="52" fill="url(#pThruster)"/>
      <ellipse cx="204" cy="425" rx="10" ry="26" fill="#ffffff" filter="url(#neonGlow)"/>

      <!-- Right Thruster Plume Long -->
      <polygon points="294,420 322,420 308,520" fill="url(#plumeExtended)"/>
      <ellipse cx="308" cy="435" rx="22" ry="52" fill="url(#pThruster)"/>
      <ellipse cx="308" cy="425" rx="10" ry="26" fill="#ffffff" filter="url(#neonGlow)"/>

      <!-- Thrust Glow Aura -->
      <circle cx="204" cy="425" r="30" fill="#00f0ff" opacity="0.4" filter="url(#neonGlow)"/>
      <circle cx="308" cy="425" r="30" fill="#00f0ff" opacity="0.4" filter="url(#neonGlow)"/>

      <!-- Particle Sparks Flowing Backward -->
      <circle cx="192" cy="485" r="4.5" fill="#00f0ff"/>
      <circle cx="216" cy="515" r="3.5" fill="#ffffff"/>
      <circle cx="296" cy="510" r="3.5" fill="#ffffff"/>
      <circle cx="320" cy="485" r="4.5" fill="#00f0ff"/>
    </g>

    <!-- Left Main Wing (Exact geometry & palette from player.svg) -->
    <polygon points="256,48 256,360 84,410 112,284 196,192" fill="url(#pWingL)" stroke="#0c4a6e" stroke-width="6" stroke-linejoin="round"/>
    <!-- Left Wing Under-Armor Chamfer -->
    <polygon points="112,284 84,410 168,380 208,304" fill="#034b75" opacity="0.9"/>
    <!-- Left Wing High-Tech Cyber Accent Stripe -->
    <line x1="168" y1="230" x2="114" y2="350" stroke="#00f0ff" stroke-width="4" stroke-linecap="round"/>
    <line x1="202" y1="270" x2="152" y2="370" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>

    <!-- Right Main Wing (Exact geometry & palette from player.svg) -->
    <polygon points="256,48 256,360 428,410 400,284 316,192" fill="url(#pWingR)" stroke="#0c4a6e" stroke-width="6" stroke-linejoin="round"/>
    <!-- Right Wing Under-Armor Chamfer -->
    <polygon points="400,284 428,410 344,380 304,304" fill="#034b75" opacity="0.9"/>
    <!-- Right Wing High-Tech Cyber Accent Stripe -->
    <line x1="344" y1="230" x2="398" y2="350" stroke="#00f0ff" stroke-width="4" stroke-linecap="round"/>
    <line x1="310" y1="270" x2="360" y2="370" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>

    <!-- Left Wingtip Heavy Blaster Cannon (From player.svg) -->
    <rect x="74" y="260" width="16" height="120" rx="8" fill="#1e293b" stroke="#0284c7" stroke-width="4"/>
    <rect x="78" y="270" width="8" height="60" rx="4" fill="#38bdf8"/>
    <circle cx="82" cy="260" r="10" fill="#38bdf8"/>
    <circle cx="82" cy="260" r="5" fill="#ffffff" filter="url(#neonGlow)"/>

    <!-- Right Wingtip Heavy Blaster Cannon (From player.svg) -->
    <rect x="422" y="260" width="16" height="120" rx="8" fill="#1e293b" stroke="#0284c7" stroke-width="4"/>
    <rect x="426" y="270" width="8" height="60" rx="4" fill="#38bdf8"/>
    <circle cx="430" cy="260" r="10" fill="#38bdf8"/>
    <circle cx="430" cy="260" r="5" fill="#ffffff" filter="url(#neonGlow)"/>

    <!-- Central 3D Fuselage (From player.svg) -->
    <polygon points="256,36 296,192 296,396 256,432 216,396 216,192" fill="url(#pFuselage)" stroke="#082f49" stroke-width="6" stroke-linejoin="round"/>

    <!-- Nose Armor Bevel Plate (From player.svg) -->
    <polygon points="256,36 288,180 256,204 224,180" fill="#bae6fd" stroke="#0284c7" stroke-width="3"/>

    <!-- 3D Cockpit Canopy Glass Dome (From player.svg) -->
    <ellipse cx="256" cy="246" rx="34" ry="72" fill="url(#pCockpit)" stroke="#083344" stroke-width="6"/>
    <!-- Specular Highlight Arc -->
    <path d="M242,196 Q264,206 264,248" stroke="#ffffff" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.95"/>
    <circle cx="260" cy="220" r="5" fill="#ffffff"/>

    <!-- Twin Thruster Nozzles (From player.svg) -->
    <rect x="188" y="396" width="32" height="24" rx="6" fill="#1e293b" stroke="#0284c7" stroke-width="4"/>
    <rect x="292" y="396" width="32" height="24" rx="6" fill="#1e293b" stroke="#0284c7" stroke-width="4"/>

    <!-- Center Spine Luminescent Indicator (From player.svg) -->
    <line x1="256" y1="56" x2="256" y2="172" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.9"/>
    <circle cx="256" cy="356" r="10" fill="#38bdf8" stroke="#ffffff" stroke-width="3"/>

    <!-- Nose Tip Plasma Cannon Spark -->
    <circle cx="256" cy="36" r="7" fill="#ffffff" filter="url(#neonGlow)"/>
  </g>

  <!-- 5. Bottom Cyber Emblem Badge & Typography -->
  <g transform="translate(512, 856)" filter="url(#badgeShadow)">
    <!-- Metallic Base Plaque with Cut Corners -->
    <path d="M-360,-48 L360,-48 L390,44 L350,56 L-350,56 L-390,44 Z" 
          fill="url(#badgePlate)" stroke="#00f0ff" stroke-width="4" stroke-linejoin="round"/>
    
    <!-- Top Cyan Horizon Glow Line -->
    <line x1="-340" y1="-48" x2="340" y2="-48" stroke="#00f0ff" stroke-width="5" stroke-linecap="round" filter="url(#neonGlow)"/>

    <!-- Left Wing Chevrons -->
    <path d="M-330,-12 L-300,-12 L-280,12 L-310,12 Z" fill="#00f0ff" opacity="0.85"/>
    <path d="M-270,-12 L-240,-12 L-220,12 L-250,12 Z" fill="#38bdf8" opacity="0.9"/>

    <!-- Right Wing Chevrons -->
    <path d="M330,-12 L300,-12 L280,12 L310,12 Z" fill="#00f0ff" opacity="0.85"/>
    <path d="M270,-12 L240,-12 L220,12 L250,12 Z" fill="#38bdf8" opacity="0.9"/>

    <!-- Main Title: ARENA DASH -->
    <!-- Shadow / Bloom Layer -->
    <text x="0" y="16" font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif" 
          font-size="62" font-weight="900" letter-spacing="10" fill="#00f0ff" text-anchor="middle" opacity="0.75" filter="url(#neonGlow)">ARENA DASH</text>
    
    <!-- Front Face Metallic Gradient -->
    <text x="0" y="14" font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif" 
          font-size="62" font-weight="900" letter-spacing="10" fill="url(#textGrad)" stroke="#021c38" stroke-width="3" text-anchor="middle">ARENA DASH</text>

    <!-- Subtitle Pill / Accent Indicator -->
    <polygon points="-80,48 0,40 80,48 0,44" fill="#00f0ff" filter="url(#neonGlow)"/>
  </g>
</svg>