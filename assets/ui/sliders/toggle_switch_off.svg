<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 40" width="80" height="40">
  <defs>
    <!-- OFF inactive track gradient (dark slate) -->
    <linearGradient id="tgl-off-track" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Muted Knob gradient -->
    <radialGradient id="tgl-off-knob" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#64748b" />
    </radialGradient>

    <filter id="tgl-off-drop" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#020617" flood-opacity="0.6" />
    </filter>
  </defs>

  <g filter="url(#tgl-off-drop)">
    <!-- Outer Track Housing -->
    <rect x="4" y="4" width="72" height="32" rx="16" fill="url(#tgl-off-track)" stroke="#090d16" stroke-width="2" />
  </g>

  <!-- OFF Indicator Circle on Right -->
  <circle cx="56" cy="20" r="4" fill="#334155" />

  <!-- Thumb Knob on Left (OFF Position) -->
  <g transform="translate(24, 20)" filter="url(#tgl-off-drop)">
    <circle cx="0" cy="0" r="14" fill="url(#tgl-off-knob)" stroke="#334155" stroke-width="1.5" />
    <circle cx="0" cy="0" r="5" fill="#475569" />
    <ellipse cx="-4" cy="-4" rx="3" ry="1.8" transform="rotate(-30 -4 -4)" fill="#ffffff" opacity="0.6" />
  </g>
</svg>
