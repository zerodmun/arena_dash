<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <!-- Checked border gradient -->
    <linearGradient id="cb-chk-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Checked body gradient -->
    <linearGradient id="cb-chk-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <filter id="cb-drop" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#020617" flood-opacity="0.6" />
    </filter>
  </defs>

  <g filter="url(#cb-drop)">
    <!-- Base Rim -->
    <rect x="4" y="4" width="40" height="40" rx="10" fill="#082f49" stroke="url(#cb-chk-rim)" stroke-width="2" />
    <!-- Face -->
    <rect x="6" y="6" width="36" height="36" rx="8" fill="url(#cb-chk-bg)" stroke="#bae6fd" stroke-width="1" />
  </g>

  <!-- Glowing Checkmark -->
  <polyline points="13,24 21,32 35,16" fill="none" stroke="#082f49" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" transform="translate(0, 1.5)" opacity="0.6" />
  <polyline points="13,24 21,32 35,16" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
