<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 56" width="220" height="56">
  <defs>
    <!-- Capsule border gradient -->
    <linearGradient id="hud-cur-rim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Capsule inner gradient -->
    <linearGradient id="hud-cur-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0.95" />
    </linearGradient>

    <!-- Icon socket gold ring -->
    <linearGradient id="hud-socket-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#854d0e" />
    </linearGradient>

    <filter id="hud-cur-drop" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#020617" flood-opacity="0.6" />
    </filter>
  </defs>

  <g filter="url(#hud-cur-drop)">
    <!-- Capsule Pill Frame -->
    <rect x="24" y="8" width="186" height="40" rx="20" fill="url(#hud-cur-bg)" stroke="url(#hud-cur-rim)" stroke-width="2" />
  </g>

  <!-- Currency Text Placeholder -->
  <text x="120" y="34" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="20" 
        font-weight="900" 
        letter-spacing="2"
        text-anchor="middle" 
        fill="#f8fafc">12,450</text>

  <!-- Circular Icon Socket Base on Left (Image 3/4) -->
  <g transform="translate(28, 28)" filter="url(#hud-cur-drop)">
    <!-- Outer gold bevel ring -->
    <circle cx="0" cy="0" r="24" fill="url(#hud-socket-gold)" stroke="#78350f" stroke-width="2" />
    <!-- Inner dark socket -->
    <circle cx="0" cy="0" r="19" fill="#082f49" />

    <!-- Mini Gold Coin Insignia -->
    <circle cx="0" cy="0" r="14" fill="#facc15" stroke="#ca8a04" stroke-width="1.2" />
    <circle cx="0" cy="0" r="11" fill="#fef08a" />
    <polygon points="0,-6 2,-1 6,-1 3,2 4,7 0,4 -4,7 -3,2 -6,-1 -2,-1" fill="#eab308" />
  </g>

  <!-- Plus / Add Currency Button Pill on Right (Image 3/4) -->
  <g transform="translate(190, 28)">
    <circle cx="0" cy="0" r="13" fill="#22c55e" stroke="#15803d" stroke-width="1.5" />
    <!-- Plus symbol -->
    <line x1="-6" y1="0" x2="6" y2="0" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
    <line x1="0" y1="-6" x2="0" y2="6" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
  </g>
</svg>
