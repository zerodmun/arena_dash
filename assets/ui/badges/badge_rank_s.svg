<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <defs>
    <!-- Cyan/Gold Holographic Crest Gradient -->
    <linearGradient id="rnk-s-gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#fef08a" />
      <stop offset="55%" stop-color="#facc15" />
      <stop offset="85%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#7c2d12" />
    </linearGradient>

    <!-- Wing Plate Gradient -->
    <linearGradient id="rnk-s-wing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#082f49" />
    </linearGradient>

    <radialGradient id="rnk-s-glow" cx="50%" cy="50%" r="50%">
      <stop offset="40%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>

    <filter id="rnk-s-drop" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#020617" flood-opacity="0.7" />
    </filter>
  </defs>

  <!-- Aura Glow -->
  <circle cx="48" cy="48" r="44" fill="url(#rnk-s-glow)" />

  <g filter="url(#rnk-s-drop)">
    <!-- Wing Flairs Behind Crest -->
    <polygon points="48,22 14,32 18,52 34,48 48,60 62,48 78,52 82,32" fill="url(#rnk-s-wing)" stroke="#082f49" stroke-width="2" />
    
    <!-- Central Shield Medallion -->
    <polygon points="48,14 74,28 74,62 48,82 22,62 22,28" fill="#082f49" stroke="#facc15" stroke-width="3" />
    <polygon points="48,18 70,30 70,60 48,77 26,60 26,30" fill="#0f172a" />
  </g>

  <!-- Letter 'S' Insignia -->
  <!-- Shadow -->
  <text x="48" y="62" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="44" 
        font-weight="900" 
        font-style="italic"
        text-anchor="middle" 
        stroke="#451a03" 
        stroke-width="8" 
        stroke-linejoin="round"
        fill="#451a03">S</text>
  <!-- Foreground -->
  <text x="48" y="62" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="44" 
        font-weight="900" 
        font-style="italic"
        text-anchor="middle" 
        fill="url(#rnk-s-gold)">S</text>

  <!-- Glint Glare -->
  <polygon points="32,26 34,30 38,31 34,32 32,36 30,32 26,31 30,30" fill="#ffffff" />
</svg>
