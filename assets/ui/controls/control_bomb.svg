<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- Heavy Drop Shadow for 3D Bevel -->
    <filter id="mShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="16" flood-color="#000000" flood-opacity="0.75"/>
    </filter>

    <!-- Outer Chrome Bezel -->
    <linearGradient id="mBezel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="30%" stop-color="#94a3b8"/>
      <stop offset="65%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- 3D Amethyst Violet Bomb Trigger Dome -->
    <radialGradient id="mTrigger" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#f3e8ff"/>
      <stop offset="20%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#9333ea"/>
      <stop offset="80%" stop-color="#6b21a8"/>
      <stop offset="100%" stop-color="#3b0764"/>
    </radialGradient>
  </defs>

  <g filter="url(#mShadow)">
    <!-- Heavy Bezel Outer Ring -->
    <circle cx="256" cy="256" r="236" fill="url(#mBezel)" stroke="#0f172a" stroke-width="8"/>

    <!-- Dark Recessed Well -->
    <circle cx="256" cy="256" r="206" fill="#090d16" stroke="#9333ea" stroke-width="4"/>

    <!-- Raised 3D Trigger Button -->
    <circle cx="256" cy="256" r="192" fill="url(#mTrigger)" stroke="#6b21a8" stroke-width="8"/>

    <!-- Tactile Non-Slip Outer Groove -->
    <circle cx="256" cy="256" r="162" fill="none" stroke="#e9d5ff" stroke-width="5" stroke-dasharray="28 20" opacity="0.6"/>

    <!-- Quantum Bomb Hazard / Missile Glyph -->
    <g transform="translate(256, 256)">
      <!-- Central Core Circle -->
      <circle cx="0" cy="0" r="32" fill="#ffffff" stroke="#3b0764" stroke-width="6"/>
      <circle cx="0" cy="0" r="16" fill="#9333ea"/>
      
      <!-- 3 Hazard Blades (Radiation/Nova Crest) -->
      <path d="M 0 -36 L -24 -82 A 85 85 0 0 1 24 -82 Z" fill="#ffffff" stroke="#3b0764" stroke-width="4"/>
      <path d="M 31 18 L 88 12 A 85 85 0 0 1 65 55 Z" fill="#ffffff" stroke="#3b0764" stroke-width="4"/>
      <path d="M -31 18 L -65 55 A 85 85 0 0 1 -88 12 Z" fill="#ffffff" stroke="#3b0764" stroke-width="4"/>
      
      <!-- Outer Orbit Ring -->
      <circle cx="0" cy="0" r="95" fill="none" stroke="#ffffff" stroke-width="6" stroke-dasharray="35 25" opacity="0.9"/>
    </g>

    <!-- Specular Highlight Curve -->
    <path d="M140,165 A165,165 0 0,1 372,165" stroke="#ffffff" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.75"/>
  </g>
</svg>
