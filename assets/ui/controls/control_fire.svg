<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- Heavy Drop Shadow for 3D Bevel -->
    <filter id="fShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="16" flood-color="#000000" flood-opacity="0.75"/>
    </filter>

    <!-- Outer Chrome Bezel -->
    <linearGradient id="fBezel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="30%" stop-color="#94a3b8"/>
      <stop offset="65%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- 3D Crimson Trigger Dome -->
    <radialGradient id="fTrigger" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fee2e2"/>
      <stop offset="20%" stop-color="#f87171"/>
      <stop offset="50%" stop-color="#ef4444"/>
      <stop offset="80%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </radialGradient>
  </defs>

  <g filter="url(#fShadow)">
    <!-- Heavy Bezel Outer Ring -->
    <circle cx="256" cy="256" r="236" fill="url(#fBezel)" stroke="#0f172a" stroke-width="8"/>

    <!-- Dark Recessed Well -->
    <circle cx="256" cy="256" r="206" fill="#090d16" stroke="#ef4444" stroke-width="4"/>

    <!-- Raised 3D Trigger Button -->
    <circle cx="256" cy="256" r="192" fill="url(#fTrigger)" stroke="#b91c1c" stroke-width="8"/>

    <!-- Tactile Non-Slip Outer Groove -->
    <circle cx="256" cy="256" r="162" fill="none" stroke="#fca5a5" stroke-width="5" stroke-dasharray="28 20" opacity="0.6"/>

    <!-- Target Reticle & Crosshair -->
    <circle cx="256" cy="256" r="105" fill="none" stroke="#ffffff" stroke-width="8" opacity="0.95"/>
    <line x1="256" y1="120" x2="256" y2="170" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>
    <line x1="256" y1="342" x2="256" y2="392" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>
    <line x1="120" y1="256" x2="170" y2="256" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>
    <line x1="342" y1="256" x2="392" y2="256" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>

    <!-- Center Reticle Node -->
    <circle cx="256" cy="256" r="28" fill="#ffffff" stroke="#7f1d1d" stroke-width="4"/>
    <circle cx="256" cy="256" r="12" fill="#ef4444"/>

    <!-- Specular Highlight Curve -->
    <path d="M140,165 A165,165 0 0,1 372,165" stroke="#ffffff" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.75"/>
  </g>
</svg>
