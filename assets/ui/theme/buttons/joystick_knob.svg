<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- Heavy Drop Shadow for 3D Knob -->
    

    <!-- Metallic Dome Bevel -->
    <radialGradient id="kDome" cx="36%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#bdcedb"/>
      <stop offset="25%" stop-color="#a4b8ca"/>
      <stop offset="60%" stop-color="#7b91a7"/>
      <stop offset="85%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </radialGradient>

    <!-- Glowing Cyber Core Jewel -->
    <radialGradient id="kCore" cx="38%" cy="32%" r="60%">
      <stop offset="0%" stop-color="#bdcedb"/>
      <stop offset="35%" stop-color="#90b4c4"/>
      <stop offset="75%" stop-color="#486278"/>
      <stop offset="100%" stop-color="#334c62"/>
    </radialGradient>
  </defs>

  <g>
    <!-- Outer 3D Thumbstick Base -->
    <circle cx="256" cy="256" r="210" fill="url(#kDome)" stroke="#0f172a" stroke-width="10"/>

    <!-- Concentric High-Traction Grip Grooves -->
    <circle cx="256" cy="256" r="172" fill="none" stroke="#64748b" stroke-width="7" opacity="0.85"/>
    <circle cx="256" cy="256" r="140" fill="none" stroke="#475569" stroke-width="6" opacity="0.9"/>

    <!-- Inner Well -->
    <circle cx="256" cy="256" r="102" fill="#0f172a" stroke="#486278" stroke-width="7"/>

    <!-- Glowing Cyber Core Jewel -->
    <circle cx="256" cy="256" r="74" fill="url(#kCore)" stroke="#b7ced9" stroke-width="4"/>

    <!-- Specular Highlight Curve -->
    <ellipse cx="236" cy="230" rx="26" ry="16" transform="rotate(-30 236 230)" fill="#bdcedb" opacity="0.9"/>
  </g>
</svg>
